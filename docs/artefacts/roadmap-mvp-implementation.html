<!--
	roadmap-artefact.html: template consumed by `roadmap.py render`.
	Two placeholders, each substituted exactly once below: the phase-name
	title (in the head and heading) and the JSON data blob

	roadmap-data script element near the foot of the document. Render does a
	global string replace, so the data-blob token must appear verbatim exactly
	once in this file (the render step asserts this); a second copy here would
	inject the blob into this comment and the mermaid edge arrows would close
	the comment early and spill the JSON onto the page. For the same reason
	this comment must not contain a raw comment-close sequence.

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
	font-family: "IBM Plex Sans", system-ui, sans-serif;
	background:
		linear-gradient(var(--grid-line) 1px, transparent 1px),
		linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
		var(--bg);
	background-size: 32px 32px, 32px 32px, auto;
	color: var(--text);
	line-height: 1.55;
}
.layout { display: flex; max-width: 1200px; margin: 0 auto; gap: 2rem; padding: 0 1.25rem; }
nav {
	position: sticky; top: 0; align-self: flex-start;
	width: 180px; flex-shrink: 0; padding: 2rem 0;
	font-family: "IBM Plex Mono", monospace; font-size: 0.8rem;
}
nav a { display: block; padding: 0.35rem 0.6rem; color: var(--muted); text-decoration: none; border-left: 2px solid var(--line); }
nav a:hover, nav a.active { color: var(--color-milestone); border-left-color: var(--color-milestone); }
main { flex: 1; min-width: 0; padding: 2rem 0 4rem; }

header.page h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 0.2rem; }
header.page .meta { font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); }

section { margin-top: 2.5rem; }
h2 {
	font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; font-weight: 500;
	text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
	display: flex; align-items: center; gap: 0.5rem; margin: 0 0 1rem;
}
h2 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--color-milestone); flex-shrink: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem 1.3rem; min-width: 0; }
.card--hero { background: var(--color-milestone-bg); border-color: var(--color-milestone); }
.card--hero .kpi { font-size: 2.1rem; font-weight: 600; color: var(--color-milestone-text); }
.card--hero .kpi small { font-size: 1rem; font-weight: 400; color: var(--color-milestone); margin-left: 0.5rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.9rem; margin-top: 0.9rem; }
.grid > * { min-width: 0; }
.mini h3 { margin: 0 0 0.3rem; font-size: 0.9rem; font-weight: 600; overflow-wrap: break-word; }
.mini .count { font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); }
.progress-bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 0.55rem; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; }

details.milestone { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 0.8rem; }
details.milestone > summary {
	cursor: pointer; padding: 0.85rem 1.2rem; font-weight: 600;
	display: flex; align-items: center; gap: 0.7rem; list-style: none; min-width: 0;
}
details.milestone > summary::-webkit-details-marker { display: none; }
details.milestone > summary .mid {
	font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
	background: var(--color-milestone-bg); color: var(--color-milestone-text);
	border: 1px solid var(--color-milestone); border-radius: 4px; padding: 0.1rem 0.4rem;
}
details.milestone > summary .count { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
details.milestone .body { padding: 0 1.2rem 1rem; }
.group h4 { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin: 0.9rem 0 0.35rem; }
.group ul { list-style: none; margin: 0; padding: 0; }
.group li { position: relative; padding: 0.28rem 0 0.28rem 1.15rem; overflow-wrap: break-word; min-width: 0; }
.group li::before { content: ""; position: absolute; left: 0; top: 0.72rem; width: 8px; height: 8px; border-radius: 50%; background: var(--g-colour, var(--muted)); }
.tid {
	font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
	background: var(--color-primary-bg); color: var(--color-primary-text);
	border: 1px solid var(--color-primary); border-radius: 4px; padding: 0.05rem 0.35rem; margin-right: 0.45rem;

.depnote { color: var(--muted); font-size: 0.82rem; }
li.oos { text-decoration: line-through; color: var(--muted); }

.diagram-shell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; position: relative; overflow: hidden; }
.diagram-toolbar { position: absolute; top: 0.5rem; right: 0.5rem; z-index: 2; display: flex; gap: 0.25rem; }
.diagram-toolbar button {
	font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; line-height: 1;
	background: var(--bg); color: var(--text); border: 1px solid var(--line);
	border-radius: 4px; padding: 0.3rem 0.5rem; cursor: pointer;

.diagram-toolbar button:hover { border-color: var(--color-milestone); color: var(--color-milestone); }
.mermaid-wrap { overflow: hidden; cursor: grab; min-height: 320px; }
.mermaid-wrap:active { cursor: grabbing; }
.mermaid-wrap svg { display: block; transform-origin: 0 0; max-width: none !important; }
.diagram-shell.expanded { position: fixed; inset: 1.5rem; z-index: 10; box-shadow: 0 4px 40px rgba(0,0,0,0.35); }
.diagram-shell.expanded .mermaid-wrap { height: calc(100% - 0px); }

.legend {
	display: flex; flex-wrap: wrap; gap: 0.35rem 1.1rem; align-items: center;
	margin-top: 0.6rem; font-size: 0.78rem; color: var(--muted);
	font-family: "IBM Plex Mono", monospace;
}
.legend .key { display: inline-flex; align-items: center; gap: 0.4rem; }
.legend .sw { width: 0.9rem; height: 0.9rem; border-radius: 3px; border: 1.5px solid; box-sizing: border-box; }
.legend .key--mile { font-weight: 600; }
.legend .key--gate { font-style: italic; }
.legend .keynote { flex-basis: 100%; }

.nextup li { display: block; }
.pill {

.signal { color: var(--muted); font-size: 0.78rem; font-family: "IBM Plex Mono", monospace; margin-left: 0.4rem; }

	.layout { flex-direction: column; gap: 0; }
	nav { position: sticky; top: 0; width: auto; display: flex; overflow-x: auto; gap: 0.25rem; padding: 0.6rem 0; background: var(--bg); z-index: 5; }
	nav a { border-left: none; border-bottom: 2px solid var(--line); white-space: nowrap; }
	nav a:hover, nav a.active { border-bottom-color: var(--color-milestone); }
}
</style>

lausibilityRule` as a new discriminated union in `types/plausibility.ts`, interfaces-first per the `ClassificationRule`/`GrammarRule` precedent rather than co-located with the data — the union didn't exist anywhere in the codebase before this task, only inline in doc 05 §6.2; predicate variants (`material-physics`, `ergonomic`) fixed a convention doc 05 leaves ambiguous: `predicate(artefact)` returns `true` when the artefact VIOLATES the rule, so `checkPlausibility` (2GN.12) can collect every violated rule's `reason` directly into `failures`; shipped all four doc 05 §6.2 worked examples as predicates in `data/plausibility.ts` — edged-blade-needs-a-grip, long-blade-needs-grip-length, heavy-perpendicular-attachment-needs-rigid-shaft, heavy-component-on-thin-walled-hollow — since each turns on a component property (`edge`, `length`, `wall`, `flexibility`, attachment `type`) rather than a primitive-to-primitive relationship, so only the predicate variants could express them faithfully; the declarative `requires`/`excludes`/`ordering` variants ship in the type union with zero MVP instances, commented as awaiting a component-role/classification vocabulary this project doesn't have yet — a bare `primitiveType` string can't express \"a grippable component\"; every proxy (grip = a second component exists, rigid shaft = `bar-form` or `flexibility: 'rigid'` `sheet-form`) is commented as an MVP stand-in pending 2GN.23 material assignment; covered by 18 new Deno tests in `plausibility.test.ts` — discriminant validity, non-empty/unique `reason`s, an every-shipped-predicate sweep against the `mockNormalisedArtefact` fixture, three violate/satisfy cases per rule using crafted artefacts, and a cross-reference check that every `primitiveType`/`AttachmentType` string literal the predicates key off resolves against the real `PRIMITIVE_TYPES`/`ATTACHMENT_TYPE_VALUES` vocabularies)", "status": "done", "dependsOn": ["M1"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.12", "description": "`engine/generation/plausibility.ts` — `checkPlausibility(artefact): { valid, failures }`", "status": "done", "dependsOn": ["2GN.8", "2GN.11", "2GN.1"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.13", "description": "`engine/generation/plausibility.ts` — physical viability rules (structural integrity, load paths, cantilever limits)", "status": "blocked", "dependsOn": ["2GN.12", "2GN.116"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.14", "description": "`engine/generation/plausibility.ts` — ergonomic rules (grip length for edged forms, handleability)", "status": "blocked", "dependsOn": ["2GN.12", "2GN.116"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.15", "description": "`engine/generation/plausibility.ts` — material-structural compatibility (material tags constrain joins/forms)", "status": "blocked", "dependsOn": ["2GN.12", "2GN.10", "2GN.111"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.16", "description": "`engine/generation/plausibility.ts` — re-expansion loop: on failure, re-expand from grammar up to N attempts", "status": "todo", "dependsOn": ["2GN.12"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.17", "description": "`src/lib/data/classification.ts` — classification rules: feature→tag scoring, structural/container/decorative/cross-layer contributions", "status": "done", "dependsOn": ["1FD.12", "2GN.12"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.19", "description": "`engine/generation/classification.ts` — `extractFeatures(artefact, decorativeLayers = []): ExtractedFeatures` — unified feature extraction from components, now covering the full geometry-derived `ExtractedFeatures` contract 2GN.17 authored rules against (structural fields plus `pointSharpness`, `bladeLengthBand`, `bladeProfile`, `perforation`, `wallThickness`, `ringGap`, `sheetFlexibility`, `massBand`, `sizeBand`, `curvature`, `openingType`, `baseType`, `appliedElementPresent`; 2GN.27 and 2GN.34 still complete the doc 05 stage-8 contract with material and decorative-motif fields)", "status": "done", "dependsOn": ["2GN.12"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.20", "description": "`engine/generation/classification.ts` — `classifyArtefact(features, rules): Map\u003cFunctionTag|ContextTag, number\u003e` — rule-based scoring", "status": "done", "dependsOn": ["2GN.17", "2GN.19"], "milestone": "M2", "notes": "`FunctionTag`/`ContextTag` named in this description are retired: 2GN.94 renamed the vocabulary to `AbsoluteTag`/`RelativeTag`/`ArtefactTag`; `classifyArtefact`'s real return type is `Map\u003cArtefactTag, number\u003e`. Description left as originally written — an accurate historical record of what shipped at 2GN.20's own time — rather than rewritten to a vocabulary that did not exist yet (flagged by CodeRabbit against `docs/artefacts/roadmap-mvp-implementation.html`'s embedded copy, PR #53 review).", "assignee": "Jason Warren"}, {"id": "2GN.21", "description": "`engine/generation/classification.ts` — `physicalLabel` generation from observable properties (neutral, not interpretive)", "status": "blocked", "dependsOn": ["2GN.20", "2GN.118"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.22", "description": "`src/lib/data/materials.ts` — material definitions: id, label, tags, physical properties, decorability (geological scarcity and cultural affinity modifiers deliberately kept in `world.ts`'s `GeologicalContext.materialAvailability`/`CulturalProfile.materialAffinities` rather than duplicated here — both are already keyed by `id`/`tags`, the join keys this file provides; `craftDomain` added instead, resolving `MaterialDefinition`'s own doc 05 §15 follow-up note per which `PhaseCharacteristics.technology` axis governs working each material)", "status": "done", "dependsOn": ["1FD.12", "M1"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.23", "description": "`engine/generation/materials.ts` — `assignMaterial(component, culture, phase, geology, trade, materials, prng): MaterialDefinition` — per-component assignment", "status": "done", "dependsOn": ["2GN.12", "2GN.22"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.24", "description": "`engine/generation/materials.ts` — `isAvailable(material, geology, trade): boolean` — local + trade availability check", "status": "done", "dependsOn": ["2GN.23"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.25", "description": "`engine/generation/materials.ts` — `computeMaterialWeight(material, culture, phase): number` — cultural affinity × phase technology", "status": "done", "dependsOn": ["2GN.23"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.26", "description": "`engine/generation/materials.ts` — `MaterialProvenance` metadata generation (source, origin region, trade path)", "status": "done", "dependsOn": ["2GN.23"], "milestone": "M2", "notes": "`likelyOriginRegion` is necessarily a provisional string keyed against `mockGeologicalContext`'s single `'test-region'` fixture — no region vocabulary exists yet (`Culture` carries no region binding); true region attribution is 3WS.7's, which must reconcile whatever this task and 2GN.47 mint (dependency sweep 2026-07-25)", "assignee": "Jason Warren"}, {"id": "2GN.75", "description": "`engine/generation/materials.ts` — `assignMaterials(artefact, culture, phase, geology, trade, prng, materials): MaterialAssignment[]` — artefact-level material pass producing the componentId→material mapping the rest of the pipeline needs", "status": "done", "dependsOn": ["2GN.26"], "milestone": "M2", "notes": "`assignMaterial` only handles one component and returns a bare `MaterialDefinition`; no engine code currently produces `MaterialAssignment[]` — the only working precedent is duplicated Explorer route logic in `materialAssignment.ts`/`decorationLayers.ts`, which this task promotes into the engine, including resolving the per-component PRNG namespacing both currently work around. Constructs each `MaterialAssignment` complete, including its required `provenance`, via 2GN.26's generator — sequenced after 2GN.26 specifically so `provenance` is never stubbed. Added by dependency sweep 2026-07-25: 2GN.30/2GN.27/2GN.70 each need per-component assigned materials and had no producer.", "assignee": "Jason Warren"}, {"id": "2GN.27", "description": "`engine/generation/materials.ts` + `engine/generation/classification.ts` — material influence on tag accumulation: materials **the producing culture treats as precious** boost elite/ceremonial, derived from the material's situation rather than a catalogue fact. ⚠️ **Reframed 2026-08-11 by 2GN.78**: the original title read \"precious metals → elite/ceremonial boosts\", which presumed a static precious-material class that no longer exists — `MaterialTag`'s `precious-*` members are retired (doc 11 §2.9, doc 12 §2.40). Standing comes from availability × cultural affinity × provenance × stratification. `explainMaterialWeight` (2GN.74) supplies the first two (`level`, `culturalAffinity`, `tradeRescued`); provenance comes separately from `MaterialAssignment.provenance` via `deriveMaterialProvenance`; stratification from `PhaseCharacteristics.society.stratification`, unread today. Blocked on 2GN.110 for the same reason as 2GN.68: whether `materialAffinities` can express a per-material judgement determines how precisely \"this culture values this material\" can be read", "status": "todo", "dependsOn": ["2GN.20", "2GN.75", "2GN.78", "2GN.82", "2GN.83", "2GN.84", "2GN.85", "2GN.110", "2GN.97"], "milestone": "M2", "notes": "⚠️ breaking: `ExtractedFeatures` carries zero component-material fields today (its one material-adjacent field, `preciousMaterialsInDecoration`, is about decorative-layer materials and belongs to 2GN.68); this task adds new `ExtractedFeatures` fields (materialId/precious-material signal, in the style of 2GN.17's 13-field addition), a new `materials`/`assignments` parameter on `extractFeatures`, and fixture updates (`neutralExtractedFeatures`/`mockExtractedFeatures`), on top of the rules themselves. Dependency sweep 2026-07-25 corrected the dependency to 2GN.75 (assignments, not just the single-component `assignMaterial`) and flagged the breaking scope the original line hid. Depends on 2GN.78: that task retires `precious-metal`/`precious-stone` as classification inputs entirely, so this task's \"precious metals → elite/ceremonial\" rule must derive standing from material situation (availability × affinity × provenance × stratification) rather than a static precious-tag lookup — without 2GN.78 sequenced first, this task could restore the static reading 2GN.77 ruled against.", "assignee": "Jason Warren"}, {"id": "2GN.28", "description": "`src/lib/data/decorations.ts` — decorative technique definitions: surface treatments (polish, patina, scoring, engraving, relief, painting, glaze), applied elements (inlay, overlay, studs, wire-wrapping, gilding), textile elements (wrapping, tassels, beading) with material prerequisites", "status": "done", "dependsOn": ["1FD.13", "M1"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.29", "description": "`engine/generation/decoration.ts` — decorative grammar expansion: iterate surfaces, select techniques weighted by culture + phase", "status": "done", "dependsOn": ["2GN.23", "2GN.28"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.30", "description": "`engine/generation/decoration.ts` — material prerequisite enforcement (engraving → hard material, glaze → ceramic, etc.)", "status": "done", "dependsOn": ["2GN.29", "2GN.75"], "milestone": "M2", "notes": "Evidence surfaced 2026-08-09 during PR #53 review (roadmap 2GN.99's `oxidisation: -1` sentinel fix): `computeLayerGrade` (`engine/generation/decoration.ts`) computes a finite difficulty for ANY technique/material pairing, including ones the technique's own `substrate` test already declares impossible, because per-component substrate enforcement (this task) does not exist yet. Measured exhaustively across all 16 techniques × 16 materials: 49 gate-failing pairings across 9 material-gated techniques are still gradeable. Six invert — a gate-failing material grades EASIER than every legitimate substrate, at craft 0.8: `glaze` (gate: non-combustible ceramic) — linen 0.7873, leather, ash all grade above fired-clay's 0.7707, the one material that actually passes; `overlay` (gate: rigid surface) — linen 0.7947, leather grade above ash's 0.7680; `gilding` (gate: sufficiently rigid surface) — linen 0.7627 grades above leather's 0.7560. The `glaze` case is sharpest: its gate reads `combustibility \u003c= 2`, but its `TECHNIQUE_MATERIAL_SENSITIVITY` row weights only `fragility`/`porosity` — nothing that knows a material would burn in the kiln — so linen, which would literally combust, currently reads as the easiest material in the catalogue to glaze.\n\nTwo alternative fixes considered and rejected in the PR #53 round: (1) making `computeLayerGrade` substrate-aware directly — correct, but a real behavioural change across every technique that would move many pinned calibration figures, and it is this task's own scope, not a side-fix; (2) authoring more `-1` not-applicable sentinels onto `combustibility`/`rigidity` to mirror `oxidisation` — rejected because those are honest continuous scales (`rigidity: 1` carries real meaning elsewhere, e.g. why linen drapes), so the mismatch is not in the material data. The fix belongs here: gate the grade, not the axis.\n\nShipped 2026-08-09: new `enforceSubstrates` export in `engine/generation/decoration.ts`, mirroring `gradeDecorativeLayers`' post-pass shape (PRNG-free, pure, recursive over `sublayers`). Strips a layer whose target component's assigned material fails the technique's own `kind: 'material'` substrate test; a stripped layer takes its sublayers with it. Ruled during implementation planning: `kind: 'form'` substrates (`wire-wrapping`/`wrapping`/`beading`) pass through unstripped — nothing resolves component geometry yet (`allowedMaterialTags` stubbed until 2GN.10); follow-on filed as 2GN.104. An unresolvable assignment (missing or unknown `materialId`) also passes through, mirroring `gradeDecorativeLayers`' honest-degradation contract. The `oxidisation \u003c 0` guard in `effectiveDifficulty` was kept, not removed: it is `effectiveDifficulty`'s own correct handling of a legal input value (`-1` on 8 of 16 materials, pinned by `materials.test.ts`), not a stand-in this pass retires — `computeLayerGrade` has four production callers (`baselines.ts`, `calibration.test.ts`, `ruleCalibration.ts`, `tagInspector.ts`) that never route through stripping, plus two direct pinned tests on inert materials. Verified exhaustively: across all 16 techniques × 16 materials, every surviving material-substrate layer now satisfies its own `substrate.test` (new test in `decoration.test.ts`). **Ships unwired**, matching 2GN.99's precedent — no production caller invokes it, so no calibration pin moved. 11 new tests; full suite 550 → 561 passing, 0 failing.", "assignee": "Jason Warren"}, {"id": "2GN.104", "description": "`engine/generation/decoration.ts` — resolve `kind: 'form'` decorative substrates (wire-wrapping/wrapping/beading's `grippable`/`attachment-point`) against a `NormalisedComponent`'s geometry, and feed the result into `enforceSubstrates` (2GN.30)", "status": "blocked", "dependsOn": ["2GN.30", "2GN.10"], "milestone": "M2", "notes": "Filed 2026-08-09 during 2GN.30 implementation. `enforceSubstrates` only enforces `kind: 'material'` substrates; the three `kind: 'form'` techniques pass through unevaluated, matching the Explorer's existing `'unevaluated'` verdict (`routes/dev/explorer/decoration/decorationLayers.ts`). Nothing in the pipeline currently answers a geometry question about a component: `NormalisedComponent.allowedMaterialTags` is stubbed empty until 2GN.10, and no other field expresses `grippable` or `attachment-point`. This task needs 2GN.10 landed first, then a resolver function (likely alongside `enforceSubstrates`, same shape) and a decision on what `primitiveType`/`properties` combination counts as grippable or carrying an attachment point — that judgement call was explicitly deferred, not decided, when 2GN.30 shipped.", "assignee": ""}, {"id": "2GN.31", "description": "`engine/generation/decoration.ts` — layering support: `DecorativeLayer` with sublayers, decoration-on-decoration", "status": "todo", "dependsOn": ["2GN.29"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.32", "description": "`engine/generation/decoration.ts` — recursion depth cap from `craftSpecialisation` × `aesthetics.decorativeEmphasis`", "status": "todo", "dependsOn": ["2GN.29"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.33", "description": "`engine/generation/decoration.ts` — motif assignment from culture's `motifVocabulary`, shared motifs via cultural exchange", "status": "done", "dependsOn": ["2GN.29"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.76", "description": "`engine/generation/decoration.ts` — motif salience fluctuates across a culture's lifespan: native and borrowed motifs are not equally prominent at every point in the culture's timeline; motif selection weights vary by phase", "status": "todo", "dependsOn": ["2GN.33"], "milestone": "M2", "notes": "Added 2026-07-25 during the 2GN.33 design interview: `assignDecorativeDetails` weights native motifs at 1 and borrowed motifs by exchange intensity, with no temporal variation — this task adds the phase-driven salience dimension.", "assignee": ""}, {"id": "2GN.79", "description": "`tests/fixtures/world.ts` + `src/lib/data/classification.ts` + `src/lib/types/artefact.ts` — geological fixture correction and whole-rule-set tag-contribution rebalance", "status": "done", "dependsOn": [], "milestone": "M2", "notes": "`mockGeologicalContext` models only 4 of 16 catalogue materials (bronze/iron/gold/flint), so the other twelve fell through `isAvailable`'s \"unmodelled → obtainable\" lenience at full weight — measuring 1200 pipeline artefacts found silver the second most common material at 10.3% of components and jade 6.6%, while genuinely-scarce gold sat at 1.4%, giving 53.4% of artefacts at least one \"precious\" component. Landed (interviewed decision-by-decision per the classification-branch oversight preference; doc 12 §2.25 records the session) as **six named regional worlds** rather than the single `mockFullGeologicalContext` originally scoped — `riverValley`, `highlandMine`, `coastalPort`, `forestInterior`, `desertMargin`, `steppeMargin`, each modelling all 16 materials explicitly and paired with its own `MaterialFlow[]`, so a threshold tuned against one geology is exposed by another. Between them they cover every `AvailabilityLevel` and both exclusion paths (`absent` in `desertMargin`; trade-only-with-no-matching-flow in `forestInterior`, which carries an empty flow array). `mockGeologicalContext` is deliberately left untouched — it is now the fixture that covers the unmodelled-lenience path the six full worlds no longer reach. `sampleWorld()` takes a region argument (default `coastalPort` at the time — superseded by 2GN.88, which dropped the default entirely) and all five samplers gained `--world`, a scope expansion agreed at interview beyond the task's original two files.\n\n**The fixture fix corrected materials but not `elite`, which was the substantive finding.** Re-measuring 7200 artefacts across the six worlds: precious-bearing artefacts fell 55.3% → 27.1%, silver 11.1% → 3.9%, jade 6.6% → 1.4%, and gold rose above jade — the ordering is now archaeologically sane. But `elite` was unmoved (89.8% presence, 35.4% leader) and near-identical in all six worlds (89.2–90.8%) despite radically different material availability, proving it was never material-driven. Investigation found the applied-element rule's 84.6% firing is **structural, not a mistuned threshold**: `expandDecoration` gives each BNF category its own per-component slot rolls (0.45 base chance at the fixture phase), so a ~4.15-component artefact reaches ~87% by arithmetic alone — no weight on a boolean fixes that.\n\n**Two rules retuned**, both for intent-behaviour divergence (the criterion agreed at interview; a rule firing often because the structure is genuinely common is honest and was left alone): R31 now reads a new `ExtractedFeatures.appliedElementCount` at its measured p75 (`\u003e= 4`, firing 25.2%, within a point of retuned R30's 25.3%) instead of the saturating boolean — an extraction-side change agreed at interview, so this task was not data-only; R29 raised to `attachmentDiversity \u003e= 3` (44.4% → 22.3%) with its `partCount \u003e= 3` clause **dropped as inert** (measured identical fire rate with the clause, without it, and with it raised to `\u003e= 4`). R32's 98% firing was investigated and deliberately left: it does not diverge from its stated intent, doc 12 §2.24 had already ruled the same way, and `ornament`'s leadership fell 27.0% → 18.8% on the R31 fix alone — the 2GN.79 entry's original diagnosis blaming it is corrected in doc 12 §2.25. Result: `elite` leadership 35.4% → 27.4%, top four tags now within 12 points rather than 25.\n\n**Durability tested, and one axis failed.** Thresholds are robust to catalogue growth (measured identical at 2×, 4× and 10× the applied-element technique pool — slot count sets the number, pool size only decides which technique fills a slot) and to geology (22–26% across the six worlds). They are **not** robust to phase attributes: R31 fires 4.3% at `decorativeEmphasis` 0.1 and 48.1% at 1.0; 2.3% at `craftSpecialisation` 0.1 and 74.5% at 1.0. That affects every measured threshold in the file including §2.24's seven, and spawned spike 2GN.80 plus recalibration tasks 2GN.82–85. Also spawned 2GN.81 (Rule Calibration Explorer panel) and fixed five pre-existing broken `assignMaterial`/`expandDecoration` call sites in the samplers (argument order; `deno check` was failing on `scripts/dev/` and two samplers threw at runtime). New coverage: `tests/fixtures/world.test.ts` (11 tests), `src/lib/data/calibration.test.ts` (fire-rate regression guard over all 43 rules — the gap that let R31 sit at 85% since 2GN.34), plus extraction and rule tests for the new field.", "assignee": "Jason Warren"}, {"id": "2GN.77", "description": "design spike — does a material's classificatory value derive from static catalogue tags (`precious-metal`/`precious-stone`) or from its situation in the generated world?", "status": "done", "dependsOn": ["2GN.79"], "milestone": "M2", "notes": "Ruled 2026-08-04, jointly with 2GN.80 — see doc 11 §2.9 (decision) and doc 12 §2.28 (rationale + measurements). **Status tags are culture-relative; physical/function tags stay absolute, and the boundary is cut by the tag a rule awards rather than the feature its condition reads** — which catches R12/R15, whose conditions are physical but whose awards are status claims, alongside the eleven decoration-conditioned rules. Baselines are sampled empirically per culture-phase at world generation (pipeline stages 1–7 only, so there is no bootstrap circularity) and cached in world state. Sample size n=400, measured rather than inherited: doc 12 §2.27's n=100 knee was for fire rates (a proportion), while a baseline is a percentile, whose worst-case relative spread runs 20–28% at n=100 and 8–17% at n=400. Percentiles are stored as fractional thresholds because `appliedElementCount` takes only 9–16 distinct integer values and its nearest-rank p90 flips between adjacent integers at any sample size. `PhaseCharacteristics.society.stratification` becomes a live input, gating how much `elite` can exist at all. Drift is recorded against the immediately preceding phase only (magnitude + direction); the proposed culture-wide baseline was dropped as incoherent — it would score an artefact against phases that had not yet happened. `ClassificationRule.condition` widens to `(features, context) =\u003e boolean`, amending doc 12 §2.20's pure-function contract. Surfaced 3WS.21 (phase-attribute continuity), on which the drift measure depends.\n\nOriginal framing: The static model bakes an Earth judgement into `data/materials.ts`: a generated culture with abundant gold would have `elite` stamped across most of its material record under a naive material→tag rule — the tag system reporting a society composed entirely of elites — while obsidian in a culture with no volcanic geology reads ordinary despite being genuinely scarce there. The world-relative alternative derives value from `GeologicalContext.materialAvailability` × `CulturalProfile.materialAffinities` × `MaterialAssignment.provenance.source` × `PhaseCharacteristics.society.stratification` (the last currently read by nothing, despite doc 05 §3.2 commenting \"Affects elite/utilitarian distribution\"). Deliverables: decision recorded in doc 11 (locked decisions) and doc 12 (propagation register); the derived-value formula if world-relative wins; a ruling on whether `MaterialTag`'s `precious-*` members survive as classification inputs; and the resulting contract for whether `extractFeatures` needs world context, which determines whether doc 12 §2.20's pure-function contract breaks. Surfaced 2026-07-31 during 2GN.27 planning, before any material→tag rule was authored.", "assignee": "Jason Warren"}, {"id": "2GN.78", "description": "`src/lib/types/tags.ts` + `src/lib/data/materials.ts` — revisit `MaterialTag`'s `precious-metal`/`precious-stone` members per the 2GN.77 ruling", "status": "done", "dependsOn": ["2GN.77"], "milestone": "M2", "notes": "**Closed 2026-08-11: both members retired.** `MaterialTag` is now eight material classes (`types/tags.ts`). 2GN.77 ruled preciousness world-relative (doc 11 §2.9); §2.37 first closed this task on the narrower finding that no classification rule read the tags, which was correct but too small a boundary — they still gated `gilding` and skewed `culturalAffinityWeight`, leaving the same Earth-judgement in the generator one step removed. Retirement was possible because everything the tags did was already modelled: gilding now gates on physics (`metallurgy && formability \u003e= 5 && oxidisation \u003c= 3`, reproducing the retired pool exactly), scarcity lives in `GeologicalContext.materialAvailability`, and a specific material's reachability in `MaterialFlow.specificMaterials`. Doc 12 §2.22's interviewed gilding/inlay/overlay/studs/beading tag sets stay in the material-tag domain — they name what a technique can be worked from, which is a `MaterialTag` question, not an `AbsoluteTag`/`RelativeTag` one; the five non-gilding sets simply drop their precious entries as redundant beside their class tags (pool membership measured unchanged). Material-derived standing is now derived from the material's situation (availability × cultural affinity × provenance × stratification), which is 2GN.68's and 2GN.27's to populate via `explainMaterialWeight` (2GN.74).\n\n**Scope addition from 2GN.84 (doc 12 §2.34, 2026-08-06), resolved:** `culturalAffinityWeight` takes the MAX across a material's tags when reading `CulturalProfile.materialAffinities`. With one tag per shipped material the reduction is now unreachable, so the max/most-specific/product ruling dissolved rather than being made — both `culturalAffinityWeight` and `decoration.ts`'s inlined `bestMaterialAffinity` record that the choice was never ruled and needs one before it carries weight again, and a test pins the one-tag-per-material invariant. The measured dead data was worse than 2GN.84 recorded: three of five authored precious affinities were inert (Khaltiris' 1.4 lost to `metal: 1.7`, Xoconahtl's 1.4 lost to `stone: 1.8`), only Thalassar's `precious-metal: 1.2` live. Whether `materialAffinities` should support per-material entries — the one expressive loss, since a culture can no longer say \"we prize gold specifically\" — is filed as 2GN.110.", "assignee": "Jason Warren"}, {"id": "2GN.34", "description": "`src/lib/data/classification.ts` — decorative classification rules consuming layer count, technique variety and depth", "status": "done", "dependsOn": ["2GN.20"], "milestone": "M2", "notes": "Rescoped by dependency sweep 2026-07-25: `extractFeatures` (2GN.19) already computes `decorativeComplexity`/`techniqueComplexity` from real signal (`tally.layerCount`, `tally.techniques.size`, `motifDensity`, `tally.maxDepth` via `tallyLayers`' existing sublayer recursion) — the extraction side needs no further work here. The remaining task is authoring classification rules in `data/classification.ts` that read those already-populated fields (a data task, not an engine one, hence the corrected file path); `maxDepth` stays pinned at 1 until 2GN.31 lands sublayers, so depth-sensitive rules should note that (soft follow, not a hard dependency). ⚠️ per the classification-branch oversight preference, this rule set needs decision-by-decision sign-off, same as 2GN.17/2GN.20 (doc 12 §2.19/§2.21).", "assignee": "Jason Warren"}, {"id": "2GN.35", "description": "`src/lib/data/descriptions/observational/` — observational register templates per component type and decorative technique", "status": "done", "dependsOn": ["1FD.31", "M1"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.36", "description": "`src/lib/data/descriptions/interpretive/` — interpretive register templates with function tag variants", "status": "todo", "dependsOn": ["1FD.31", "M1", "2GN.91"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.37", "description": "`src/lib/data/descriptions/technical/` — technical register templates (craft-process, manufacturing)", "status": "todo", "dependsOn": ["1FD.31", "M1", "2GN.91"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.68", "description": "`engine/generation/classification.ts` — update: decorative motif and introduced-material features contribute to unified tag accumulation (`motifCulturalOrigins` from `DecorativeLayer.motifRef`→culture lookup; `preciousMaterialsInDecoration` from the layer material's **situation in the producing culture**). ⚠️ **Rescoped 2026-08-11 by 2GN.78** (doc 11 §2.9, doc 12 §2.40): this line previously read \"`preciousMaterialsInDecoration` from `DecorativeLayer.material`→precious-material lookup\", which is exactly the static catalogue read 2GN.77 ruled against and which no longer has anything to look up — `MaterialTag`'s `precious-metal`/`precious-stone` members are retired. Populate the field from availability × cultural affinity × provenance instead: Doc 11 §2.9's formula has four terms sourced from three places: `explainMaterialWeight` (2GN.74) returns `level`, `culturalAffinity` and `tradeRescued` for a material/culture pair (availability and cultural affinity); provenance comes separately from `MaterialAssignment.provenance` via `deriveMaterialProvenance`, since `tradeRescued` is a reachability boolean rather than a provenance substitute; and stratification from `PhaseCharacteristics.society.stratification`, which §2.9 makes live and nothing reads yet. The threshold over them is this task's to rule and has not been set. Blocked on 2GN.110 because the affinity term's keyspace (per-tag only, or per-material too) changes what \"this culture prizes it\" can even mean", "status": "todo", "dependsOn": ["2GN.33", "2GN.20", "2GN.82", "2GN.83", "2GN.84", "2GN.85", "2GN.110", "2GN.97"], "milestone": "M2", "notes": "**Note from 2GN.84 (doc 12 §2.34, 2026-08-06):** confirmed `assignDecorativeDetails` (`engine/generation/decoration.ts`) has no production caller anywhere in `src/` — only its own tests reach it. This task needs that wired into the pipeline before `DecorativeLayer.material` is ever populated outside tests, which is the direct upstream reason `preciousMaterialsInDecoration` is hardcoded `false` in `extractFeatures`.", "assignee": "Jason Warren"}, {"id": "2GN.38", "description": "`engine/generation/description.ts` — `generateDescription(artefact, registers): ArtefactPresentation` — assemble ordered observation list per component", "status": "blocked", "dependsOn": ["2GN.34", "2GN.68", "2GN.35", "2GN.36", "2GN.37", "2GN.27"], "milestone": "M2", "notes": "`ArtefactPresentation.provenance: ProvenancePresentation` is required, but `Provenance` generation is 2GN.47, which sits downstream via `2GN.38 → 2GN.44 → 2GN.47`; per dependency sweep 2026-07-25 this task takes a caller-supplied `Provenance` (extract `mockArtefact`'s inline default into an exported `mockProvenance` fixture) rather than reordering — matches the 2GN.23 M2-provisional convention. Revisit once 2GN.47 lands real provenance.", "assignee": "Jason Warren"}, {"id": "2GN.39", "description": "`engine/generation/description.ts` — template expansion: parameterised template system with property slots", "status": "blocked", "dependsOn": ["2GN.38"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.40", "description": "`engine/generation/description.ts` — per-component descriptions in all three registers for structural components", "status": "blocked", "dependsOn": ["2GN.39"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.41", "description": "`engine/generation/description.ts` — per-layer descriptions for decorative elements (techniques, motifs, materials)", "status": "blocked", "dependsOn": ["2GN.39"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.42", "description": "`engine/generation/description.ts` — `physicalLabel` composite label from observable properties", "status": "blocked", "dependsOn": ["2GN.39", "2GN.21"], "milestone": "M2", "notes": "", "assignee": "Jason W 6-07-25) — no region vocabulary or culture→region binding exists yet, so this task mints convention-agreed strings for 3WS.7 to reconcile once real geography lands.", "assignee": "Jason Warren"}, {"id": "2GN.48", "description": "`engine/world/scholars.ts` — `generateNPCScholars(cultures, chronology, prng): NPCScholarSeed[]` — 3-4 NPCs with name, specialisation, career stage", "status": "blocked", "dependsOn": ["2GN.66"], "milestone": "M2", "notes": "Signature takes the loose `Culture[]`/`WorldChronology` bag M2 can actually supply rather than `WorldState` (see 2GN.56's note); also needs an `InterpretiveModel` fixture factory added to `tests/fixtures/` since none exists (dependency sweep 2026-07-25).", "assignee": "Jason Warren"}, {"id": "2GN.49", "description": "`engine/world/scholars.ts` — NPC `InterpretiveModel` generation: cultural/artefact/chrono claims with calibrated wrongness (~70% correct, ~30% wrong)", "status": "blocked", "dependsOn": ["2GN.48"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.50", "description": "`engine/generation/corpus.ts` — `simulateExcavations(npcs, cultures, geology, trade, prng): SimulatedExcavation[]` — 6-8 campaigns biased by NPC preferences", "status": "blocked", "dependsOn": ["2GN.49", "2GN.47"], "milestone": "M2", "notes": "Signature drops `WorldState` for the loose bag M2 can supply (see 2GN.56's note; dependency sweep 2026-07-25).", "assignee": "Jason Warren"}, {"id": "2GN.51", "description": "`engine/generation/corpus.ts` — `generatePublications(npcs, excavations, cultures, prng): DocumentNode[]` — ~15-20 summary publications with lineage and commitments", "status": "blocked", "dependsOn": ["2GN.50"], "milestone": "M2", "notes": "Signature drops `WorldState` (see 2GN.56's note; dependency sweep 2026-07-25).", "assignee": "Jason Warren"}, {"id": "2GN.52", "description": "`engine/generation/corpus.ts` — coverage gap generation: `CoverageBudget` with culture/site/period bias, guaranteed gaps per culture", "status": "blocked", "dependsOn": ["2GN.50"], "milestone": "M2", "notes": "⚠️ breaking: `ProfessionalCorpus` has no `coverageGaps` field today; this task must add one (dependency sweep 2026-07-25).", "assignee": "Jason Warren"}, {"id": "2GN.53", "description": "`engine/generation/corpus.ts` — `aggregateCorpus(publications): ProfessionalCorpus` — material/form frequencies, context associations, active debates, consensus", "status": "blocked", "dependsOn": ["2GN.51"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.54", "description": "`engine/generation/corpus.ts` — dating framework generation per site: layer datings, methods, error margins, some deliberately wrong", "status": "blocked", "dependsOn": ["2GN.50"], "milestone": "M2", "notes": "⚠️ breaking: `ProfessionalCorpus` has no `datingFrameworks` field today; this task must add one (dependency sweep 2026-07-25).", "assignee": "Jason Warren"}, {"id": "2GN.55", "description": "`engine/generation/corpus.ts` — calibrated wrongness distribution: interpretive errors, absence claim errors, rarity assessment errors, cross-cultural errors", "status": "blocked", "dependsOn": ["2GN.49"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.66", "description": "`src/lib/data/names/` — naming grammars for sites, cultures, scholars (doc 08 `data/names/`)", "status": "todo", "dependsOn": ["1FD.14", "M1"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.67", "description": "`engine/generation/grammar.ts` — arrangement detection + pattern assignment: annotate `NormalisedComponent.arrangementGroup` (pattern, index, totalInGroup) at flatten time, descoped out of 2GN.8 since the grammar never assigns an arrangement pattern (2GN.3 rolls repetition incidentally, 2GN.6's `checkAccumulation` only validates admissibility, never labels one), so `arrangementGroup.pattern` has no faithful source at flatten time and fabricating one would invent data; detection reuses `tallyArrangements`' same-primitiveType-within-one-top-level-group boundary (already the detection contract behind 2GN.6, cheap to apply again here), leaving pattern *assignment* as the open question this task owns — may mean threading a choice through `expandGrammar`'s determinism-critical draw sequence; nothing consumes the field yet, so this task is currently childless in the graph", "status": "todo", "dependsOn": ["2GN.8", "2GN.108"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.56", "description": "`engine/generation/pipeline.ts` — `runGenerationPipeline(culture, period, geology, trade, corpus, prng): ClassifiedArtefact` — full 9-stage orchestrator", "status": "blocked", "dependsOn": ["2GN.53", "2GN.16", "2GN.30"], "milestone": "M2", "notes": "`WorldState` does not exist as a type until 3WS.9 (`save.ts` confirms: \"No runtime `WorldState` aggregate exists yet\"), so this and the four corpus-chain signatures above (2GN.48/50/51) take the loose bag M2 can actually supply; 3WS.15 collapses them to the real `WorldState` parameter once it lands (dependency sweep 2026-07-25).", "assignee": "Jason Warren"}, {"id": "2GN.57", "description": "Explorer: structure viewer tab — generate from seed + culture selector, component tree with join types", "status": "done", "dependsOn": ["2GN.8"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.58", "description": "Explorer: plausibility panel — generate N structures, show pass/fail with rejection reasons, running rejection rate", "status": "done", "dependsOn": ["2GN.12"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.59", "description": "Explorer: tag inspector — tag map as scored bar chart, per-component contribution breakdown", "status": "done", "dependsOn": ["2GN.20"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.60", "description": "Explorer: material viewer — resolved material per component, culture bias breakdown (scarcity vs affinity vs trade)", "status": "done", "dependsOn": ["2GN.23"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.61", "description": "Explorer: decoration inspector — decoration layers per component with prerequisites, technique, layer depth", "status": "done", "dependsOn": ["2GN.29"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.62", "description": "Explorer: description viewer — three-register prose side by side, register divergence highlighting", "status": "blocked", "dependsOn": ["2GN.40"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.63", "description": "Explorer: excavation viewer — artefacts grouped by site, ambiguity distribution chart", "status": "blocked", "dependsOn": ["2GN.45"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.64", "description": "Explorer: corpus browser — NPC researchers, publications, dating frameworks, coverage gaps, correct vs wrong claim toggle", "status": "blocked", "dependsOn": ["2GN.54", "2GN.53"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.65", "description": "Explorer: pipeline stage viewer — stage-by-stage output display", "status": "blocked", "dependsOn": ["2GN.56"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.1", "description": "`src/lib/data/grammars/primitives.ts` — geometric primitive defs (elongated, cylindrical, flat-broad, hollow-enclosed, ring-form, disc-form, bar-form, sheet-form) with parameter enums (doc 05 §5.3 transcribed verbatim as a single `as const` `PRIMITIVE_PARAMETERS` registry — primitive id → parameter name → ordered value list — with `PrimitiveType` derived via `keyof typeof`, a flagged deviation from the interfaces-first convention per the `Serialised\u003cT\u003e` zero-drift precedent in save.ts; \"parameter enums\" realised as string-literal value lists per the no-`enum` convention committed in artefact.ts; parameters deliberately scoped per primitive, no shared unions — `crossSection` and `taper` carry different value-sets across primitives; `PRIMITIVE_TYPES` array + `isPrimitiveType` guard round out the union-values-guard trio per the visibility.ts precedent; material-tag compatibility stays with 2GN.10, dimension derivation with 2GN.8, selection weights with 2GN.2/2GN.4 — this module is data only, no `MaterialTag` import needed; covered by 7 Deno tests asserting the eight-primitive vocabulary, per-primitive parameter names and verbatim spot-checked value lists)", "status": "done", "dependsOn": ["1FD.10", "M1"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.2", "description": "`src/lib/data/grammars/core.ts` — MVP component grammar rules: `\u003cobject\u003e` → `\u003ccomponent-group\u003e+`, `\u003ccomponent-group\u003e` → `\u003cprimary-component\u003e` + optional attachments, base weights (four `GrammarRule`s in BNF order exported as a `readonly GrammarRule[]` — interfaces-first against the 1FD.10 types, no keyed index since `symbol` is already the rule's identity; `attachment` authored as a fourth rule so `selectGrammarOption` (2GN.4) applies culture-biased weighted selection uniformly to join choice, with the caveat documented in the module header that its options expand to `AttachmentType` terminals — neither rule symbols nor primitives — consumed positionally by `expandGrammar` (2GN.3) as edge labels, never expanded as components; the BNF's `+`/`*` repetition is deliberately not encoded — chain length is engine behaviour (2GN.3) bounded by accumulation constraints (2GN.6/2GN.7); all `baseWeight`s and `culturalModifiers` are authored MVP-provisional archaeology-flavoured priors since doc 05 §5.4 gives the modifier maths but no numbers, to tune once generation is observable in the Explorer; five illustrative `phaseModifiers` entries — hollow-enclosed on `technology.ceramics`, bar-form/socketed/riveted/threaded on `technology.metallurgy` — as fixtures for `phaseInfluence`, multiplier semantics firming up at 2GN.5; covered by 8 Deno tests asserting the four-rule vocabulary, exact primitive and attachment coverage in registry/union order, `expandsTo` resolution, positive finite weights and valid modifier keys — no assertions on specific weight values, so tests don't fossilise provisional numbers)", "status": "done", "dependsOn": ["1FD.10", "M1"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.3", "description": "`engine/generation/grammar.ts` — `expandGrammar(rules, culture, phase, prng)`: top-level grammar expansion, selects primary component, expands attachment chains (walks the §5.3 BNF top-down into an `ExpandedObject` — tree shapes `ComponentNode`/`AttachmentBranch`/`ComponentGroupNode`/`ExpandedObject` added to `types/grammar.ts`, deliberately carrying no ids, dimensions or portability since those are the 2GN.8 flatten's concerns, keeping the tree a cheap re-rollable intermediate for §6.2 re-expansion (2GN.16); `primitiveType` stays a plain `string` per the `NormalisedComponent` precedent — `types/` never imports `data/`; `ATTACHMENT_TYPE_VALUES` + `isAttachmentType` complete the union-values-guard trio per the visibility.ts precedent so the engine validates join terminals at runtime; primitive terminals roll their physical parameters at expansion time, uniform per parameter in registry order, so normalisation never touches the PRNG; the attachment rule's options are consumed positionally as edge labels per the 2GN.2 contract, with non-attachment terminals throwing; every selection routes through `selectGrammarOption` including the single-option `object`/`component-group` rules — the prng draw sequence is the determinism contract, so future multi-option rules change distributions, not draw structure; repetition is bounded by provisional constants pending 2GN.6/2GN.7 — tier-specific continuation probabilities of 0.2/0.4/0.6 with group caps of 2/3/4 echoing §5.5's tier ceilings, attachment slots at 0.4 × 0.5^depth with breadth 2 and depth 3; malformed grammar (missing rules, unknown symbols, rule cycles via a hop budget) throws loudly; the `expandsTo` resolution order — rule symbol → primitive → attachment terminal → throw — is now the firmed contract in its JSDoc; covered by 10 Deno tests: same-seed deep-equal trees, seed divergence, structural validity over 200 seeds, cap enforcement over 500, repetition distribution ~70% single-group over 1 000, three malformed-grammar throw cases and an end-to-end culture-bias sweep)", "status": "done", "dependsOn": ["2GN.2"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.4", "description": "`engine/generation/grammar.ts` — `selectGrammarOption(rule, culture, phase, prng)`: culture-biased weighted selection with 0.01 floor (doc 05 §5.4's formula adapted to the callback-shaped `weightedSelect` from 1FD.7 — effective weights computed transiently in the `getWeight` callback via a private `effectiveOptionWeight` helper, never stored: `baseWeight` + affinity × modifier per cultural entry with missing affinities reading as 0, scaled by `phaseInfluence` (2GN.5), floored at 0.01, which also makes `weightedSelect`'s zero-total uniform fallback unreachable from this call site; exactly one prng draw per call regardless of option count, so draw ordering is a stable determinism contract for `expandGrammar` (2GN.3); `culture` param typed `CulturalProfile` not `Culture` — the pipeline passes `baseProfile`; covered by 6 Deno tests — determinism, culture and phase distribution shifts over 1 000 draws, floor reachability at the ~0.1% expected rate over 10 000 draws, inert modifiers for absent affinities, single-draw consumption via a call-counting prng wrapper — all against crafted rules so core.ts's provisional weights aren't fossilised, per the 2GN.2 precedent)", "status": "done", "dependsOn": ["2GN.3"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.5", "description": "`engine/generation/grammar.ts` — `phaseInfluence(option, phase)`: phase characteristics modify grammar option weights (the provisional `phaseModifiers` contract firmed here as promised at 1FD.10/2GN.2: each `[dottedPath, multiplier]` entry resolves its 0–1 attribute from `PhaseCharacteristics` and contributes the factor `1 + (multiplier − 1) × attribute` — neutral at attribute 0, the full multiplier at 1, sub-1 multipliers suppressing in proportion to the attribute — so low technology never suppresses below base weight, matching doc 05 §3.2's framing that high attributes *increase* probabilities; entries combine by product; absent/empty maps return a neutral 1; unresolvable paths throw, since grammar data is authored in-repo and core.test.ts guards the shipped keys — a miss is always an authoring typo, better loud than silently skewing distributions forever; path resolution is a generic object walk so new `PhaseCharacteristics` attributes need no engine change; `types/grammar.ts` JSDoc updated from \"expect this to firm up\" to the fixed contract; `tests/fixtures/culture.ts` gained exported `mockPhaseCharacteristics` (two-level merge overrides — a documented divergence from `mockCulture`'s whole-branch replacement, since all four branches are flat numeric records) and `mockCulturalProfile` builders; covered by 7 Deno tests — lerp endpoints and midpoint, product combination, sub-1 suppression, both throw cases and a shipped-fixture sweep asserting every core.ts modifier evaluates finite and positive)", "status": "done", "dependsOn": ["2GN.3"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.7", "description": "`engine/generation/grammar.ts` — complexity budget derivation from `craftSpecialisation` (simple/moderate/sophisticated thresholds) (exported `resolveComplexityTier` + `deriveComplexityBudget(craftSpecialisation)`, scalar signatures since doc 05 §5.5 derives from exactly one attribute — input-honest and fixture-free to test; `ComplexityTier` stays engine-local since `types/grammar.ts` is data shapes only and the tier is a derivation detail; the doc's overlapping tier bounds firmed as half-open upward — simple [0, 0.3), moderate [0.3, 0.6), sophisticated [0.6, 1] — so boundary values promote: more specialisation never means less complexity; non-finite or out-of-[0,1] input throws per the `resolvePhaseAttribute` loud-failure precedent; derivation is pure and PRNG-free so it can never perturb the draw-sequence determinism contract; `expandGrammar` now consumes `maxDistinctGroups` (2/3/4) as its group-repetition cap and enforces a per-tier `minDistinctGroups` (1/2/3) unconditionally before a per-tier `additionalGroupProbability` (provisional 0.2/0.4/0.6) governs further additions up to the cap — the minimum is kept engine-side in the tier table rather than on `AccumulationConstraints` so that type stays spec-verbatim, but it is enforced as a hard floor, giving the doc's tier group ranges (\"1–2/2–3/3–4\") exactly rather than as a distribution shift; `maxComponentsPerGroup` (4/8/12, rising to cover radial's doc maximum only at sophisticated) and `noTwoGroupsSameType` (true only at simple) are authored MVP-provisional per the 2GN.2 precedent — derived now, enforced at 2GN.6; pattern instances carry §5.5's example counts verbatim as authored data and are built fresh per call so no two budgets share mutable innards; attachment depth/breadth constants stay provisional pending 2GN.6; covered by 6 new Deno tests — tier boundaries, throw cases, doc-cited group caps, pattern-set widening per tier with a spot-check on symmetric's [2, 4, 6], monotone provisional limits, mutation safety — plus the 2GN.3 cap and distribution tests reworked tier-aware: group counts asserted within the enforced 1–2/2–3/3–4 ranges over 500 seeds per tier, and the distribution test now pins ordering (more specialisation → more groups) instead of the provisional probabilities)", "status": "done", "dependsOn": ["2GN.3"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.6", "description": "`engine/generation/grammar.ts` — accumulation checking: `ArrangementPattern` constraint enforcement (symmetric, radial, linear-array, stacked, nested, branching valid counts) (exported `checkAccumulation(object, constraints): AccumulationCheckResult` — a pure validator, not expansion-time enforcement, since doc 05 §6.2's model is check-and-re-roll with the re-expansion loop owned by 2GN.16; the result shape `{ valid, failures }` mirrors the planned `checkPlausibility` (2GN.12) so the loop can treat both uniformly, with `AccumulationCheckResult` engine-local per the `ComplexityTier` precedent; the doc gives no detection mechanism for arrangement groups on the raw tree — `arrangementGroup` only exists on `NormalisedComponent` at 2GN.8 — so the detection boundary firmed here (user-confirmed design decision) is per top-level group: same-`primitiveType` components within one top-level `ComponentGroupNode` (primary plus attachment descendants, recursively) form one arrangement group, never pooling across top-level groups, keeping `noTwoGroupsSameType` meaningful and setting the boundary 2GN.8's `arrangementGroup` annotation must follow; four checks — top-level group count vs `maxDistinctGroups` (defensive re-check, since `expandGrammar` already enforces it, keeping the validator authoritative over hand-built/deserialised trees), per-arrangement count vs `maxComponentsPerGroup`, pattern admissibility for every repetition (count ≥ 2) with `symmetric` as an exact-count allow-list and the other five as inclusive ranges per the 1FD.10 type asymmetry, and `noTwoGroupsSameType` triggering only when two top-level groups each carry an arrangement of the same type — same-type singles never trigger it, a single component being no arrangement at all; pure and PRNG-free, failure messages name type, count and violated bound; a failed check is not an error — expansion is cheap, the pipeline re-rolls; `expandGrammar`'s provisional attachment constants stay as generation-side heuristics with the checker now the validation authority, per the updated module comments; covered by 12 Deno tests against crafted trees and constraints so provisional tier numbers aren't fossilised — clean pass, symmetric allow-list vs range inclusivity at both bounds, cap-beats-pattern precedence, the never-pools-across-groups boundary, nested-descendant counting, both `noTwoGroupsSameType` polarities plus the singles exemption, defensive group-count failure, simultaneous-violation accumulation, purity/no-mutation via `structuredClone` snapshots, and a 500-seed moderate-tier integration sweep asserting expanded trees mostly satisfy their own derived budget)", "status": "done", "dependsOn": ["2GN.7"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.69", "description": "`engine/generation/grammar.ts` — deliberately model multi-part assemblages: distinguish an intentional co-deposited group (hoard, burial set) from an unattached stray component, since `\u003cobject\u003e ::= \u003ccomponent-group\u003e+` currently lets `expandGrammar` roll multiple independent groups with no signal for whether that's a designed assemblage or an accidental artefact of complexity-budget rolls", "status": "todo", "dependsOn": ["2GN.8", "2GN.108"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.70", "description": "`engine/generation/materials.ts` + `engine/generation/decoration.ts` — whole-object coherence pass: check material and decorative choices are coherent across an artefact's components as a set (not necessarily mono-material) rather than validating each component in isolation", "status": "blocked", "dependsOn": ["2GN.30", "2GN.31", "2GN.32", "2GN.33"], "milestone": "M2", "notes": "Dependency sweep 2026-07-25 corrected the dependency from 2GN.23 to 2GN.75: \"as a set\" requires the whole-artefact material assignment, which only 2GN.75 produces. The direct 2GN.75 edge was pruned in the 2GN.85 dependency sweep (2026-08-04) as transitively implied by 2GN.30, which already depends on it.", "assignee": "Jason Warren"}, {"id": "2GN.71", "description": "`engine/generation/description.ts` + `engine/generation/classification.ts` — consume assemblage membership: describe/classify a multi-part assemblage distinctly from a single object once 2GN.69 lands", "status": "blocked", "dependsOn": ["2GN.69", "2GN.39"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.72", "description": "`engine/generation/classification.ts` — per-component feature provenance: record which component each collapsed `ExtractedFeatures` field was derived from (doc 12 §2.20 defers this explicitly — the collapse policies are documented but carry no references), so a feature can be traced to its source without re-implementing the dominance rules outside the engine. Prerequisite for attributing classification evidence to components rather than only to rules", "status": "todo", "dependsOn": ["2GN.19", "2GN.97"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.73", "description": "Explorer: extend the tag inspector (2GN.59) with per-component feature provenance once 2GN.72 lands — show which component supplied each feature a fired rule reads. Note this is feature provenance, not tag attribution: a tag score sums whole-artefact rule predicates and never belongs to one component", "status": "blocked", "dependsOn": ["2GN.72", "2GN.59"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.74", "description": "`engine/generation/materials.ts` — `explainMaterialWeight(material, culture, phase, geology, trade)` returning the decomposed factors (cultural affinity, phase technology, scarcity) plus the availability level and whether trade rescued it, so the material viewer (2GN.60) can show the scarcity-vs-affinity breakdown its roadmap line asks for. Today `computeMaterialWeight` returns only the product and the tuning constants (`SCARCITY_WEIGHT`, `NO_TECHNOLOGY_FLOOR`) are module-private, so the panel cannot decompose it without duplicating numbers the engine expects to retune", "status": "done", "dependsOn": ["2GN.23"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.80", "description": "design spike — are status tags absolute across the world, or relative to the producing culture's norms?", "status": "done", "dependsOn": ["2GN.79"], "milestone": "M2", "notes": "Ruled 2026-08-04, jointly with 2GN.77 — see doc 11 §2.9 (decision) and doc 12 §2.28 (rationale + measurements). **Status tags are culture-relative; physical/function tags stay absolute, and the boundary is cut by the tag a rule awards rather than the feature its condition reads** — which catches R12/R15, whose conditions are physical but whose awards are status claims, alongside the eleven decoration-conditioned rules. Baselines are sampled empirically per culture-phase at world generation (pipeline stages 1–7 only, so there is no bootstrap circularity) and cached in world state. Sample size n=400, measured rather than inherited: doc 12 §2.27's n=100 knee was for fire rates (a proportion), while a baseline is a percentile, whose worst-case relative spread runs 20–28% at n=100 and 8–17% at n=400. Percentiles are stored as fractional thresholds because `appliedElementCount` takes only 9–16 distinct integer values and its nearest-rank p90 flips between adjacent integers at any sample size. `PhaseCharacteristics.society.stratification` becomes a live input, gating how much `elite` can exist at all. Drift is recorded against the immediately preceding phase only (magnitude + direction); the proposed culture-wide baseline was dropped as incoherent — it would score an artefact against phases that had not yet happened. `ClassificationRule.condition` widens to `(features, context) =\u003e boolean`, amending doc 12 §2.20's pure-function contract. Surfaced 3WS.21 (phase-attribute continuity), on which the drift measure depends.\n\nOriginal framing: Surfaced 2026-07-31 during 2GN.79's durability testing. Every threshold in `data/classification.ts` is an absolute constant, and every one is strongly phase-sensitive: the retuned applied-element rule fires on 4.3% of output at `decorativeEmphasis` 0.1 and 48.1% at 1.0; 2.3% at `craftSpecialisation` 0.1 and 74.5% at 1.0. So `elite` currently means \"unusually decorated *in absolute terms*\", which makes a highly decorative culture read as composed almost entirely of elites and an austere one as having none — the same failure 2GN.77 identifies for materials, reached from the decoration side. The alternative derives the threshold from the producing culture's own expected decorative volume, so \"lavish\" means lavish *for this culture*. ⚠️ `ClassificationRule.condition` currently receives only `ExtractedFeatures` and nothing else (doc 12 §2.20's pure-function contract), so a culture-relative reading breaks that signature — the ruling's main irreversible consequence. Deliverables: decision recorded in doc 11 (locked decisions) and doc 12 (propagation register); if culture-relative wins, the derivation formula and the new `condition` contract; a ruling on whether `PhaseCharacteristics.society.stratification` (read by nothing today, despite doc 05 §3.2 commenting \"Affects elite/utilitarian distribution\") becomes an input. Sibling to 2GN.77 — consider ruling on both together, since one asks the same question of materials. The Rule Calibration panel (2GN.81) is the instrument for reasoning about this: switching culture preset shows the swing directly (`elite` leads 35.4% against the flat-0.5 fixtures, 0.4% against the low-decoration Tarpan preset).", "assignee": "Jason Warren"}, {"id": "2GN.81", "description": "Explorer: rule calibration panel — per-rule fire rates and per-tag presence/leadership across a sampled population", "status": "done", "dependsOn": ["2GN.59"], "milestone": "M2", "notes": "Requested during the 2GN.79 interview and delivered with it. The Tag Inspector (2GN.59) answers \"why did *this artefact* score this way\"; this answers the population question underneath it, which no surface previously covered — a rule can look sensible on one artefact while firing on 85% of output, and under `classifyArtefact`'s plain-sum unbounded fold (doc 12 §2.21) that adds a near-constant to every score rather than discriminating. Landed as `/dev/explorer/calibration` with a pure `ruleCalibration.ts` model (16 tests) per the `tagInspector.ts` precedent: samples 100–1000 artefacts against any Explorer culture preset and reports per-rule fire rate with a saturated/discriminating/rare/dormant verdict (the `rare` band was measured and dropped by 2GN.88; three verdicts remain), and per-tag presence, leadership, mean score and top contributing rule — which is what turns \"elite is everywhere\" into \"because R31 fires on 85%\". Samples against `EXPLORER_CULTURES`, which already model all 16 materials, so the panel was never affected by the fixture defect 2GN.79 corrected. Switching preset makes 2GN.80's phase-sensitivity question directly visible.", "assignee": "Jason Warren"}, {"id": "2GN.94", "description": "`src/lib/engine/statistics.ts` — deterministic percentile helper (`percentileOf`/`percentileLadder`, R-7 interpolation) baselines are measured with", "status": "done", "dependsOn": [], "milestone": "M2", "notes": "Surfaced 2026-08-05 while scoping 2GN.82: no percentile helper existed anywhere in `src/lib` — every p50/p75/p90 figure in `classification.ts` was computed out-of-band and hand-transcribed, so the 2GN.34/2GN.79 recalibration was not reproducible from the tree. R-7 linear interpolation (NumPy's default), not nearest-rank: doc 12 §2.28 measured `appliedElementCount` taking only 9–16 distinct integer values, so a nearest-rank percentile flips between adjacent integers at any sample size. Regression-anchored against the recorded `decorativeLayerCount` p75 (10, roadmap 2GN.34) to catch a disagreement between the new helper and the old hand-transcription before anything depends on it. Prerequisite for 2GN.95.", "assignee": "Jason Warren"}, {"id": "2GN.95", "description": "`ClassificationContext` + baseline sampler (`engine/generation/baselines.ts`) — widen `ClassificationRule.condition` to `(features, context)`; zero rule migrations", "status": "done", "dependsOn": ["2GN.94"], "milestone": "M2", "notes": "Prerequisite for 2GN.82/83/84, surfaced 2026-08-05: the 2GN.80/2GN.77 ruling (doc 11 §2.9, doc 12 §2.28) is fully decided, but `ClassificationContext` was referenced in five places and defined nowhere, and `ClassificationRule.condition` was still single-argument. Widens the signature to `(features, context) =\u003e boolean` without migrating a single rule — TypeScript accepts a narrower-arity function wherever the wider signature is expected, so all 43 rules compile and fire identically; `EXPECTED_FIRE_RATES` in `calibration.test.ts` is bit-identical before and after, which is the checkpoint proving the slice changed no observable behaviour. Ships `sampleBaselines` (stages 1–7 only — `expandGrammar` → `normaliseArtefact` → `expandDecoration` → `extractFeatures`, no bootstrap circularity), `explorerCulturePhase` adapting `EXPLORER_CULTURES`, and `emptyClassificationContext` (used at every current call site, since no shipped rule reads a context yet — wiring real sampled baselines into the interactive Explorer tools now would cost real latency for zero observable effect). Deliberately not cached (`WorldState` doesn't exist until 3WS.9) and not wired to real culture generation (no generator exists until 3WS.3/3WS.4). Load-bearing test: Tarpan (decorativeEmphasis 0.4) vs Thalassar (0.75) must show a strictly higher decorativeComplexity p75 for the latter — the ruling's premise, checked empirically.", "assignee": "Jason Warren"}, {"id": "2GN.82", "description": "recalibrate the measured classification thresholds per the 2GN.80 ruling", "status": "done", "dependsOn": ["2GN.80", "2GN.95"], "milestone": "M2", "notes": "Migrated exactly nine of the eleven measured thresholds the roadmap line names, not all 34 rules the 2GN.80 ruling's selector catches — doc 12 §2.31 corrects the earlier 34-vs-9 conflation (needing-a-baseline and having-a-numeric-threshold-to-recalibrate are different counts). R29 (attachmentDiversity, p90), R30 (decorativeLayerCount, p75), R31 (appliedElementCount, p75), R35 (hasEdge && decorativeLayerCount, p75), R36 (hasContainer && decorativeLayerCount, p75), R40 (decorativeComplexity, p75), R41 (decorativeComplexity, p95), R42 (decorativePerPart, p75), R43 (techniqueComplexity, p90) all migrated to `ClassificationContext.exceeds`.\n\n**Migrating to a ladder rung is not free arithmetic.** Measured against the real pipeline (18 culture-phase cells, n=400 baselines): a rule's fire rate is not `(1 - percentile) * 100` — coarse features (attachmentDiversity, appliedElementCount) carry heavy tie-mass at the interpolated threshold under `exceeds`'s `\u003e=` convention, a third face of doc 12 §2.28's granularity defect that fractional thresholds alone don't cure. R29 at p75 fires 43.4% (recreating the 44.4% rate 2GN.79 retuned away from); p90 (21.5%) reproduces the rule's actual intent. Two rules' historically-measured percentiles (~p93, and a p90 value used as `\u003e= 8`) had no ladder rung at all, resolved by argument from stated intent rather than nearest-number arithmetic (R41 → p95, not p90, to avoid inflating the top elite tier ~45%). Two rules (R35/R36) were measured at a sub-population percentile `sampleBaselines` doesn't provide; moved to the whole-population p75 rather than building a sub-population sampler for what measured as a ≤5pp difference.\n\nRe-recorded `EXPECTED_FIRE_RATES` for the nine; the 34 unmigrated rules' rates came back bit-identical, the inertness checkpoint. Added three new calibration guards since a migrated rule's rate now sits near its rung almost by construction and would otherwise stop catching a whole-distribution generator shift (the 2GN.86 class of defect): per-cell sampled-threshold-value pins, a per-cell fire-rate spread guard, and R35/R36's own sub-population rate pins. Wired real per-culture-phase contexts into `calibration.test.ts` (18 cells, n=400 — costs ~0.3s, not the seconds feared while scoping), the Explorer's Tag Inspector (new `routes/dev/explorer/shared/baselineCache.ts`, memoised per culture id with a fixed seed) and calibration panel (samples directly, preserving its own-seed-and-count reproducibility contract), and `scripts/dev/sample-classification.ts` — which had not type-checked since 2GN.95 widened the rule arity, uncaught because `deno task check`'s `svelte-check` never reaches `scripts/`. `classification.test.ts` needed the bulk of the work: its 122 assertions shared one empty context, so migrating a rule made its negative assertions pass for the wrong reason; added a `relativeContext` fixture helper, a migration-coverage guard (any context-sensitive rule must award a RelativeTag), and a rule-level phase-discrimination test. Full detail and per-rule rationale: doc 12 §2.31. Doc 11 §2.9 amended with the closed-ladder consequence. **The 25 categorical relative-award rules (wallThickness, baseType, openingType, massBand, perforation, ringGap, sheetFlexibility, sizeBand, isWearable, hasFasteningMechanism) are out of scope** — `BaselineFeature` is a closed union of 8 numeric keys by design, so there's no baseline to migrate them against yet. Split to 2GN.97.", "assignee": "Jason Warren"}, {"id": "2GN.97", "description": "design spike — what does the 2GN.80 ruling mean for the 25 categorical relative-award rules 2GN.82 could not migrate", "status": "done", "dependsOn": ["2GN.82"], "milestone": "M2", "notes": "Ruled 2026-08-13 — see docs/spikes/2GN.97-categorical-relative-award-rules.md, doc 11 §2.12 and doc 12 §2.44. **The brief's framing was wrong and the ruling rejects it.** 2GN.82 left these rules as 'unmigrated, needing a categorical baseline'; measuring all of them found they are not one problem and most need no baseline at all. Count corrected: **24, not 25** — the roadmap figure predated 2GN.87's deletion of R4. Five groups. **(A1) ~10 rules where morphology determines the tag** — fine unchanged. **(A2→ absorbed) ambiguous morphology**: a central perforation reads spindle-whorl or pendant; ruled NOT a baseline problem (prevalence cannot disambiguate a single artefact) and NOT fixable by weight-splitting, because `classifyArtefact` accumulates additively with no suppression, so 'ambiguous' and 'weakly two things' are indistinguishable downstream. **(B-walls) 2 rules unrelativisable** — `wallThickness` is a three-value roll with no quantity beneath it, so one culture's thick may be thinner than another's thin and no baseline can recover it; filed 2GN.120. **(B-bases) 2 rules under-conditioned** — `baseType` IS a genuine categorical (unlike walls, nothing continuous is crushed) and prevalence would be meaningful, but a base is a relation between the base and what it supports: a pedestal under a statue and one under a hat-stand read oppositely with identical `baseType`. No relativisation fixes an under-conditioned rule. **(C) mass/size** — cheap route, `massBand` derives from a scored distribution. **(D) `precious-materials-in-decoration` is stubbed `false`** and cannot fire — 2GN.78 fallout, a fifth dormant rule; once derived it is culture-relative against regional scarcity per 2GN.77, and reads the keyspace 2GN.110 rules. **The finding that outgrew the brief**: 10 of 24 condition on exactly one property, 7 more on two properties of the same component, and only 1 is genuinely relational. ⚠️ The defect crosses doc 11 §2.9's boundary — `perforation-central-rotation` awards `tool`, an AbsoluteTag, and is under-conditioned identically — so it is a property of how conditions are written, not of which vocabulary they award. Filed 2GN.119, scoped to **all 43 rules**. Also sur
