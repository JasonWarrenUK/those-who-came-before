nt each collapsed `ExtractedFeatures` field was derived from (doc 12 §2.20 defers this explicitly — the collapse policies are documented but carry no references), so a feature can be traced to its source without re-implementing the dominance rules outside the engine. Prerequisite for attributing classification evidence to components rather than only to rules", "status": "todo", "dependsOn": ["2GN.19", "2GN.97"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.73", "description": "Explorer: extend the tag inspector (2GN.59) with per-component feature provenance once 2GN.72 lands — show which component supplied each feature a fired rule reads. Note this is feature provenance, not tag attribution: a tag score sums whole-artefact rule predicates and never belongs to one component", "status": "blocked", "dependsOn": ["2GN.72", "2GN.59"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.74", "description": "`engine/generation/materials.ts` — `explainMaterialWeight(material, culture, phase, geology, trade)` returning the decomposed factors (cultural affinity, phase technology, scarcity) plus the availability level and whether trade rescued it, so the material viewer (2GN.60) can show the scarcity-vs-affinity breakdown its roadmap line asks for. Today `computeMaterialWeight` returns only the product and the tuning constants (`SCARCITY_WEIGHT`, `NO_TECHNOLOGY_FLOOR`) are module-private, so the panel cannot decompose it without duplicating numbers the engine expects to retune", "status": "done", "dependsOn": ["2GN.23"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.80", "description": "design spike — are status tags absolute across the world, or relative to the producing culture's norms?", "status": "done", "dependsOn": ["2GN.79"], "milestone": "M2", "notes": "Ruled 2026-08-04, jointly with 2GN.77 — see doc 11 §2.9 (decision) and doc 12 §2.28 (rationale + measurements). **Status tags are culture-relative; physical/function tags stay absolute, and the boundary is cut by the tag a rule awards rather than the feature its condition reads** — which catches R12/R15, whose conditions are physical but whose awards are status claims, alongside the eleven decoration-conditioned rules. Baselines are sampled empirically per culture-phase at world generation (pipeline stages 1–7 only, so there is no bootstrap circularity) and cached in world state. Sample size n=400, measured rather than inherited: doc 12 §2.27's n=100 knee was for fire rates (a proportion), while a baseline is a percentile, whose worst-case relative spread runs 20–28% at n=100 and 8–17% at n=400. Percentiles are stored as fractional thresholds because `appliedElementCount` takes only 9–16 distinct integer values and its nearest-rank p90 flips between adjacent integers at any sample size. `PhaseCharacteristics.society.stratification` becomes a live input, gating how much `elite` can exist at all. Drift is recorded against the immediately preceding phase only (magnitude + direction); the proposed culture-wide baseline was dropped as incoherent — it would score an artefact against phases that had not yet happened. `ClassificationRule.condition` widens to `(features, context) =\u003e boolean`, amending doc 12 §2.20's pure-function contract. Surfaced 3WS.21 (phase-attribute continuity), on which the drift measure depends.\n\nOriginal framing: Surfaced 2026-07-31 during 2GN.79's durability testing. Every threshold in `data/classification.ts` is an absolute constant, and every one is strongly phase-sensitive: the retuned applied-element rule fires on 4.3% of output at `decorativeEmphasis` 0.1 and 48.1% at 1.0; 2.3% at `craftSpecialisation` 0.1 and 74.5% at 1.0. So `elite` currently means \"unusually decorated *in absolute terms*\", which makes a highly decorative culture read as composed almost entirely of elites and an austere one as having none — the same failure 2GN.77 identifies for materials, reached from the decoration side. The alternative derives the threshold from the producing culture's own expected decorative volume, so \"lavish\" means lavish *for this culture*. ⚠️ `ClassificationRule.condition` currently receives only `ExtractedFeatures` and nothing else (doc 12 §2.20's pure-function contract), so a culture-relative reading breaks that signature — the ruling's main irreversible consequence. Deliverables: decision recorded in doc 11 (locked decisions) and doc 12 (propagation register); if culture-relative wins, the derivation formula and the new `condition` contract; a ruling on whether `PhaseCharacteristics.society.stratification` (read by nothing today, despite doc 05 §3.2 commenting \"Affects elite/utilitarian distribution\") becomes an input. Sibling to 2GN.77 — consider ruling on both together, since one asks the same question of materials. The Rule Calibration panel (2GN.81) is the instrument for reasoning about this: switching culture preset shows the swing directly (`elite` leads 35.4% against the flat-0.5 fixtures, 0.4% against the low-decoration Tarpan preset).", "assignee": "Jason Warren"}, {"id": "2GN.81", "description": "Explorer: rule calibration panel — per-rule fire rates and per-tag presence/leadership across a sampled population", "status": "done", "dependsOn": ["2GN.59"], "milestone": "M2", "notes": "Requested during the 2GN.79 interview and delivered with it. The Tag Inspector (2GN.59) answers \"why did *this artefact* score this way\"; this answers the population question underneath it, which no surface previously covered — a rule can look sensible on one artefact while firing on 85% of output, and under `classifyArtefact`'s plain-sum unbounded fold (doc 12 §2.21) that adds a near-constant to every score rather than discriminating. Landed as `/dev/explorer/calibration` with a pure `ruleCalibration.ts` model (16 tests) per the `tagInspector.ts` precedent: samples 100–1000 artefacts against any Explorer culture preset and reports per-rule fire rate with a saturated/discriminating/rare/dormant verdict (the `rare` band was measured and dropped by 2GN.88; three verdicts remain), and per-tag presence, leadership, mean score and top contributing rule — which is what turns \"elite is everywhere\" into \"because R31 fires on 85%\". Samples against `EXPLORER_CULTURES`, which already model all 16 materials, so the panel was never affected by the fixture defect 2GN.79 corrected. Switching preset makes 2GN.80's phase-sensitivity question directly visible.", "assignee": "Jason Warren"}, {"id": "2GN.94", "description": "`src/lib/engine/statistics.ts` — deterministic percentile helper (`percentileOf`/`percentileLadder`, R-7 interpolation) baselines are measured with", "status": "done", "dependsOn": [], "milestone": "M2", "notes": "Surfaced 2026-08-05 while scoping 2GN.82: no percentile helper existed anywhere in `src/lib` — every p50/p75/p90 figure in `classification.ts` was computed out-of-band and hand-transcribed, so the 2GN.34/2GN.79 recalibration was not reproducible from the tree. R-7 linear interpolation (NumPy's default), not nearest-rank: doc 12 §2.28 measured `appliedElementCount` taking only 9–16 distinct integer values, so a nearest-rank percentile flips between adjacent integers at any sample size. Regression-anchored against the recorded `decorativeLayerCount` p75 (10, roadmap 2GN.34) to catch a disagreement between the new helper and the old hand-transcription before anything depends on it. Prerequisite for 2GN.95.", "assignee": "Jason Warren"}, {"id": "2GN.95", "description": "`ClassificationContext` + baseline sampler (`engine/generation/baselines.ts`) — widen `ClassificationRule.condition` to `(features, context)`; zero rule migrations", "status": "done", "dependsOn": ["2GN.94"], "milestone": "M2", "notes": "Prerequisite for 2GN.82/83/84, surfaced 2026-08-05: the 2GN.80/2GN.77 ruling (doc 11 §2.9, doc 12 §2.28) is fully decided, but `ClassificationContext` was referenced in five places and defined nowhere, and `ClassificationRule.condition` was still single-argument. Widens the signature to `(features, context) =\u003e boolean` without migrating a single rule — TypeScript accepts a narrower-arity function wherever the wider signature is expected, so all 43 rules compile and fire identically; `EXPECTED_FIRE_RATES` in `calibration.test.ts` is bit-identical before and after, which is the checkpoint proving the slice changed no observable behaviour. Ships `sampleBaselines` (stages 1–7 only — `expandGrammar` → `normaliseArtefact` → `expandDecoration` → `extractFeatures`, no bootstrap circularity), `explorerCulturePhase` adapting `EXPLORER_CULTURES`, and `emptyClassificationContext` (used at every current call site, since no shipped rule reads a context yet — wiring real sampled baselines into the interactive Explorer tools now would cost real latency for zero observable effect). Deliberately not cached (`WorldState` doesn't exist until 3WS.9) and not wired to real culture generation (no generator exists until 3WS.3/3WS.4). Load-bearing test: Tarpan (decorativeEmphasis 0.4) vs Thalassar (0.75) must show a strictly higher decorativeComplexity p75 for the latter — the ruling's premise, checked empirically.", "assignee": "Jason Warren"}, {"id": "2GN.82", "description": "recalibrate the measured classification thresholds per the 2GN.80 ruling", "status": "done", "dependsOn": ["2GN.80", "2GN.95"], "milestone": "M2", "notes": "Migrated exactly nine of the eleven measured thresholds the roadmap line names, not all 34 rules the 2GN.80 ruling's selector catches — doc 12 §2.31 corrects the earlier 34-vs-9 conflation (needing-a-baseline and having-a-numeric-threshold-to-recalibrate are different counts). R29 (attachmentDiversity, p90), R30 (decorativeLayerCount, p75), R31 (appliedElementCount, p75), R35 (hasEdge && decorativeLayerCount, p75), R36 (hasContainer && decorativeLayerCount, p75), R40 (decorativeComplexity, p75), R41 (decorativeComplexity, p95), R42 (decorativePerPart, p75), R43 (techniqueComplexity, p90) all migrated to `ClassificationContext.exceeds`.\n\n**Migrating to a ladder rung is not free arithmetic.** Measured against the real pipeline (18 culture-phase cells, n=400 baselines): a rule's fire rate is not `(1 - percentile) * 100` — coarse features (attachmentDiversity, appliedElementCount) carry heavy tie-mass at the interpolated threshold under `exceeds`'s `\u003e=` convention, a third face of doc 12 §2.28's granularity defect that fractional thresholds alone don't cure. R29 at p75 fires 43.4% (recreating the 44.4% rate 2GN.79 retuned away from); p90 (21.5%) reproduces the rule's actual intent. Two rules' historically-measured percentiles (~p93, and a p90 value used as `\u003e= 8`) had no ladder rung at all, resolved by argument from stated intent rather than nearest-number arithmetic (R41 → p95, not p90, to avoid inflating the top elite tier ~45%). Two rules (R35/R36) were measured at a sub-population percentile `sampleBaselines` doesn't provide; moved to the whole-population p75 rather than building a sub-population sampler for what measured as a ≤5pp difference.\n\nRe-recorded `EXPECTED_FIRE_RATES` for the nine; the 34 unmigrated rules' rates came back bit-identical, the inertness checkpoint. Added three new calibration guards since a migrated rule's rate now sits near its rung almost by construction and would otherwise stop catching a whole-distribution generator shift (the 2GN.86 class of defect): per-cell sampled-threshold-value pins, a per-cell fire-rate spread guard, and R35/R36's own sub-population rate pins. Wired real per-culture-phase contexts into `calibration.test.ts` (18 cells, n=400 — costs ~0.3s, not the seconds feared while scoping), the Explorer's Tag Inspector (new `routes/dev/explorer/shared/baselineCache.ts`, memoised per culture id with a fixed seed) and calibration panel (samples directly, preserving its own-seed-and-count reproducibility contract), and `scripts/dev/sample-classification.ts` — which had not type-checked since 2GN.95 widened the rule arity, uncaught because `deno task check`'s `svelte-check` never reaches `scripts/`. `classification.test.ts` needed the bulk of the work: its 122 assertions shared one empty context, so migrating a rule made its negative assertions pass for the wrong reason; added a `relativeContext` fixture helper, a migration-coverage guard (any context-sensitive rule must award a RelativeTag), and a rule-level phase-discrimination test. Full detail and per-rule rationale: doc 12 §2.31. Doc 11 §2.9 amended with the closed-ladder consequence. **The 25 categorical relative-award rules (wallThickness, baseType, openingType, massBand, perforation, ringGap, sheetFlexibility, sizeBand, isWearable, hasFasteningMechanism) are out of scope** — `BaselineFeature` is a closed union of 8 numeric keys by design, so there's no baseline to migrate them against yet. Split to 2GN.97.", "assignee": "Jason Warren"}, {"id": "2GN.97", "description": "design spike — what does the 2GN.80 ruling mean for the 25 categorical relative-award rules 2GN.82 could not migrate", "status": "done", "dependsOn": ["2GN.82"], "milestone": "M2", "notes": "Ruled 2026-08-13 — see docs/spikes/2GN.97-categorical-relative-award-rules.md, doc 11 §2.12 and doc 12 §2.44. **The brief's framing was wrong and the ruling rejects it.** 2GN.82 left these rules as 'unmigrated, needing a categorical baseline'; measuring all of them found they are not one problem and most need no baseline at all. Count corrected: **24, not 25** — the roadmap figure predated 2GN.87's deletion of R4. Five groups. **(A1) ~10 rules where morphology determines the tag** — fine unchanged. **(A2→ absorbed) ambiguous morphology**: a central perforation reads spindle-whorl or pendant; ruled NOT a baseline problem (prevalence cannot disambiguate a single artefact) and NOT fixable by weight-splitting, because `classifyArtefact` accumulates additively with no suppression, so 'ambiguous' and 'weakly two things' are indistinguishable downstream. **(B-walls) 2 rules unrelativisable** — `wallThickness` is a three-value roll with no quantity beneath it, so one culture's thick may be thinner than another's thin and no baseline can recover it; filed 2GN.120. **(B-bases) 2 rules under-conditioned** — `baseType` IS a genuine categorical (unlike walls, nothing continuous is crushed) and prevalence would be meaningful, but a base is a relation between the base and what it supports: a pedestal under a statue and one under a hat-stand read oppositely with identical `baseType`. No relativisation fixes an under-conditioned rule. **(C) mass/size** — cheap route, `massBand` derives from a scored distribution. **(D) `precious-materials-in-decoration` is stubbed `false`** and cannot fire — 2GN.78 fallout, a fifth dormant rule; once derived it is culture-relative against regional scarcity per 2GN.77, and reads the keyspace 2GN.110 rules. **The finding that outgrew the brief**: 10 of 24 condition on exactly one property, 7 more on two properties of the same component, and only 1 is genuinely relational. ⚠️ The defect crosses doc 11 §2.9's boundary — `perforation-central-rotation` awards `tool`, an AbsoluteTag, and is under-conditioned identically — so it is a property of how conditions are written, not of which vocabulary they award. Filed 2GN.119, scoped to **all 43 rules**. Also surfaced 2GN.118 (are the primitive value-sets rational) while stress-testing `baseType`.", "assignee": ""}, {"id": "2GN.83", "description": "recalibrate `expandDecoration`'s fill constants per the 2GN.80 ruling", "status": "done", "dependsOn": ["2GN.80", "2GN.95"], "milestone": "M2", "notes": "Landed doc-only (2026-08-06, doc 12 §2.32) — the re-scope anticipated on pickup. No constant moved: recalibration presupposes a calibration target, and relativisation removed the old one (fire rate) without supplying a new one — a uniform volume change moves the sampled baseline and the measured artefacts together and largely self-cancels. The only stated target anywhere in the docs, doc 05 §8.3's four-corner craft/emphasis table, was measured directly and found unsound as a target, for two independent reasons: (1) its numbers cap recursion depth, which has no producer until 2GN.31 (`expandDecoration` emits flat layers, `sublayers: []` always) — read as the nearest measurable analogue, layers-per-component, today's output is 0.41/1.64/1.72/3.14 against the table's 0–1/0–1/~1/up-to-3; (2) the two middle corners are not jointly reachable by any function of `(craftSpecialisation, decorativeEmphasis)` — a joint sweep over `CRAFT_WEIGHT × BASE_FILL_PROBABILITY × SLOT_DECAY × MAX_SLOTS_PER_CATEGORY` floors residual error at ~0.83 and never approaches zero, because the `hi/lo` corner is dominated by `partCount` (~6 components at high craft vs ~2 at low), set upstream by `deriveComplexityBudget` in `grammar.ts` and multiplied against inside `expandDecoration`, not cancellable from within the module. §8.3's own wording confirms the diagnosis — it separates the middle corners by kind (\"technically refined\" vs \"simple techniques\"), which a volume scalar cannot express. One concrete implementation defect surfaced and is recorded, not fixed: `craftSpecialisation` enters decorative volume twice (once via the blend, once via `partCount`), a measured 3.2× gap (3.61 vs 11.50 mean layers) at identical intensity 0.55 — the fix depends on how doc 11 §1.5 rules. New open question raised at doc 11 §1.5 with four named candidate answers (volume is per-artefact; volume is per-component and §8.3 is wrong; split volume from refinement; defer to 2GN.31) and no recommendation between them. `appliedElementPresent` saturation (89–100% across measured cells) recorded as a separate, already-diagnosed finding (`classification.ts:403` already calls it structural) rather than pursued here. Split to **2GN.98**: rule doc 11 §1.5, then recalibrate against whatever it decides.", "assignee": "Jason Warren"}, {"id": "2GN.98", "description": "design spike — rule doc 11 §1.5's decorative-volume question, then recalibrate `expandDecoration`'s fill constants against it", "status": "done", "dependsOn": ["2GN.83"], "milestone": "M2", "notes": "Ruled 2026-08-06 (doc 11 §2.10, doc 12 §2.33): `decorationVolume` reads `aesthetics.decorativeEmphasis` alone; a new `DecorativeLayer.grade` field reads `society.craftSpecialisation` scaled by a new authored `TECHNIQUE_DIFFICULTY` rating (`data/decorations.ts`, 16 values reviewed per-item). Two cheaper shapes were tried and rejected first: biasing `computeTechniqueWeight`'s selection toward low-difficulty techniques at low craft (real and directional, ~30% vs ~15-19% low-difficulty share, but capped — the function's other three factors dominate selection); `grade = craftSpecialisation` alone (cleanly orthogonal to volume but degenerate as a sampled feature — every layer on every artefact from one culture-phase got the identical value, so a percentile ladder over it never varies within a cell). The shipped formula (`craft * (1 - 0.5*difficulty) + 0.5*difficulty*craft²`) produces genuine within-cell spread instead, making `meanDecorativeGrade` a legitimate `BaselineFeature`. Doc 05 §8.3's four corners now land at 0.41-0.46/0.46-0.54/2.7-3.3/2.8-3.3 layers/component against the stated 0-1/0-1/~1/up-to-3 — a substantial improvement on the pre-2GN.98 blend's 0.42/1.65/1.65/3.16, where the two middle corners were indistinguishable. `BASE_FILL_PROBABILITY`/`SLOT_DECAY`/`MAX_SLOTS_PER_CATEGORY` left unchanged; the corners land acceptably without retuning them. The recorded `craftSpecialisation` double-count (2GN.83) is resolved by re-scoping, not patching: craft now has exactly two decorative-adjacent effects (`partCount`, unchanged; `grade`, new) rather than one effect counted twice. `appliedElementPresent` saturation confirmed unaffected (86.7% vs the prior 89.1%, within noise) — structural, per `MAX_SLOTS_PER_CATEGORY`, as diagnosed at 2GN.79/2GN.83. New classification rule (R44, `data/classification.ts`) reads `meanDecorativeGrade` at p90 (not p75 — measured 26.6%/12.3%, and p90 matches the rule's own 'exceptional' framing, same reasoning 2GN.82 used for the exceptional-lavishness and technique-breadth rules). `EXPECTED_THRESHOLDS`/`EXPECTED_FIRE_RATES`/`EXPECTED_GATED_RATES` re-measured and re-recorded in `calibration.test.ts` (R1-R28/R37-R39 bit-identical, the inertness checkpoint; R32 dropped 98.0%→89.2%, still exempt from `SATURATION_CEILING` by design); `statistics.regression.test.ts`'s p75 pin moved 10→12 and reframed against this task's own measurement rather than 2GN.34's superseded figure. `CLASSIFICATION_RULES.length` 43→44, relative/absolute split 34/43→35/44. Four new tests in `decoration.test.ts` (grade direction, gap-narrowing at high craft, [0,1] bounds, artefact-level monotonicity); textile-isolation and category-coverage tests verified unaffected. `deno task check` 0 errors, `deno test` 521/521 passing. Full detail: doc 12 §2.33.", "assignee": "Jason Warren"}, {"id": "2GN.84", "description": "recalibrate `SCARCITY_WEIGHT` and material weighting per the 2GN.80 / 2GN.77 rulings", "status": "done", "dependsOn": ["2GN.80", "2GN.77", "2GN.95"], "milestone": "M2", "notes": "Inverted 2026-08-06 (doc 12 §2.34): no calibration target existed (doc 05 §7 is qualitative only; §10.2 explicitly disclaims a quota reading), matching the trap 2GN.83 hit and flagged in this task's own notes. Delivered instead: `src/lib/data/materials.calibration.test.ts` (new) — a hierarchical per-region tag-share/intra-tag-split/provenance-mix/cross-region-spread guard derived from `MaterialDefinition.tags`, installing the missing target rather than recalibrating against an absent one, the same move 2GN.82/2GN.98 made for classification/decoration. `SCARCITY_WEIGHT`'s four values are UNCHANGED and now pinned as the measured baseline.\n\nTwo real defects found and fixed along the way: (1) `materialAccessGate` (`engine/generation/decoration.ts`) checked a technique's material *substrate* but not its *introduced* material — `wire-wrapping` (substrate: grippable form; introduces: metal) was never gated on metal availability, so a metal-free region (`forestInterior`) produced 26.3% wire-wrapping share (vs 5.8-6.1% elsewhere), more metal wirework than anywhere with metal. Fixed by extending the gate to also check `INTRODUCED_MATERIAL_TAGS` via `isAvailable` (availability only, not affinity). (2) `scarcityWeight`'s unmodelled-material lenience returned neutral `1`, ranking an unmodelled material above an explicitly `available` one (`0.6`) — same class of defect as doc 12 §2.25's silver/jade over-representation. Fixed to return the `available` rung instead.\n\nA full 16-entry catalogue audit (`data/materials.ts`) found and fixed one tag miss (`jade`: `['precious-stone']` → `['stone', 'precious-stone']`, matching gold/silver's dual-tag pattern) and one inert-material defect (`glass`: all three `decorability` flags were false; corrected to `engravable: true, paintable: true`, grounded in attested wheel-cut/diamond-point engraving and enamelled-glass practice; `glazeable` stays false as a ceramic-only process).\n\n`deno task check` 0 errors, `deno test` 527/527 passing. Full detail: doc 12 §2.34.\n\nExplicitly split out, not pursued here: `culturalAffinityWeight`'s max-across-tags semantics (Khaltiris authors `precious-metal: 1.4` on gold, silently dead since `metal: 1.7` wins the max — folded into 2GN.78's scope); material-dependent technique difficulty (new task 2GN.99); leatherworking/craft-domain taxonomy (new task 2GN.100); `assignDecorativeDetails` has no production caller (noted against 2GN.68).", "assignee": "Jason Warren"}, {"id": "2GN.99", "description": "recalibrate `computeLayerGrade` to read technique difficulty per-material, not technique alone", "status": "done", "dependsOn": ["2GN.98", "2GN.101"], "milestone": "M2", "notes": "Ruled and shipped 2026-08-07 (doc 12 §2.35). Blocked on a prerequisite that had to be built first: `physicalProperties` could not express material difficulty at all, so **2GN.101** rebuilt it (six orthogonal axes plus keyed `reactivity`) before this task could proceed.\n\n**Ships as an unwired post-pass, and that is the honest scope.** `computeLayerGrade` is called inside `expandDecoration`'s slot loop, where no component has an assigned material — assignments live in a parallel `MaterialAssignment[]` from `assignMaterials`, which no production caller runs first. Threading them in would force all six call sites to reorder, and `assignMaterials` consumes PRNG draws, so it would perturb the decoration draw sequence and move every recorded fire rate for reasons unrelated to grade. New `gradeDecorativeLayers` instead re-grades layers as a separate PRNG-free pass, mirroring `assignDecorativeDetails`' position. `expandDecoration` untouched; its grade is now documented as *provisional*. **Nothing in the sampled path changed at ship time, so no calibration pin moved then** — a stronger inertness checkpoint than 2GN.82/2GN.98's partial ones. That held only until the two remaining ungraded samplers (calibration.test.ts's measureFireRates, the Explorer's ruleCalibration.ts) were wired through the material-aware pass in a later review round: R44's pooled fire rate moved 4.0% → 10.4% once measured on the same scale as the baseline it is compared against (roadmap 2GN.103, doc 12 §2.36).\n\nFormula modulates *difficulty* (`TECHNIQUE_DIFFICULTY` baseline + weighted axis shifts, clamped) rather than the resulting grade: it keeps the [0,1] bound without clamping output, preserves the \"harder techniques degrade faster as craft falls\" curve, and makes the physical claim correctly — a difficult material makes a technique behave like a harder technique. New `TECHNIQUE_MATERIAL_SENSITIVITY` (16 techniques × up to 6 axes) authored technique-by-technique.\n\n**Weights scaled ×2.5 after measurement.** At the originally-authored ±0.15 band, engraving spanned only ~0.044 across all 16 materials against ~0.3 between easiest and hardest technique — material was a rounding error beside technique, with partially-cancelling weights collapsing the signal, and too little spread to keep `meanDecorativeGrade` a viable sampled feature (the exact degeneracy 2GN.98 rejected). Scaling preserved every relative judgement; only magnitude moved. Post-scaling spread: 0.10 (`overlay`/`inlay`) down to 0.02 (`scoring`), `tassels` zero by design.\n\nScaling exposed a clamping artefact — 22 of 256 pairs pushed difficulty below zero, claiming work was *perfectly* easy (craft irrelevant), and tying 7 techniques at the ceiling. `MINIMUM_DIFFICULTY = 0.05` fixes it; nothing pins at the ceiling now. Pinned by a test.\n\nKnown limitation, recorded not hidden: `wire-wrapping`/`wrapping`/`beading` score near-inert because their real difficulty comes from the *introduced* material (wire, cord, beads) and this model reads the *substrate*; `tassels` is flat zero because it introduces no material at all in the catalogue. Both split to successors. `deno task check` 0 errors, `deno test` 540/540.\n\n**Follow-on defect fixed in the same PR #53 review round, 2026-08-09:** the `oxidisation: -1` not-applicable sentinel reached `effectiveDifficulty`'s weighting unguarded, normalising to ≈-1.29 (outside the documented [-1,+1] band) and landing every inert material's `patina` grade below gold's — inverting the gate/difficulty distinction the sentinel exists to express. Fixed by skipping the axis when the sentinel is present, falling back to the bare technique baseline. Investigating its blast radius surfaced a wider, deliberately-unfixed-here defect: recorded against **2GN.30** (see that task's own notes).", "assignee": "Jason Warren"}, {"id": "2GN.100", "description": "add a distinct `leatherWorking` craft domain, separating hide-work from weaving", "status": "done", "dependsOn": [], "milestone": "M2", "notes": "Shipped 2026-08-07 (doc 12 §2.35). `leather` moves off `craftDomain: 'textiles'`, which it had been sharing with `linen`, conflating tanning with weaving under one technology axis. New `technology.leatherWorking` widens `CraftDomain` automatically (it is `keyof PhaseCharacteristics['technology']`).\n\nThe four explorer presets get independently argued values rather than clones of their `textiles` — cloning would have made the axis a no-op alias and shipped nothing. Tarpan 0.75 (its own text: \"the herd supplies bone, antler and hide\", leather `abundant` against linen `scarce`, mobile pastoralists tan continuously), Khaltiris 0.60 (militarised, `craftSpecialisation` 0.85, needs tanned hide at scale for armour backing and harness), Thalassar 0.45 (flax-abundant maritime palace culture, hide is workaday), Xoconahtl 0.30 (the only preset where leather is `scarce` below linen `available`; humid jungle is hostile to tanning).\n\nMeasured effect: Tarpan now weights leather at 6.4× its linen; Xoconahtl inverts that in linen's favour. Under the shared axis the two moved in lockstep.\n\n**Free of calibration consequence by construction:** the test fixture takes `0.5`, which its own \"every attribute neutral\" contract demands, and `materials.calibration.test.ts` runs on `mockPhaseCharacteristics()` with no overrides — so `phaseTechnologyWeight('leather')` is identical and all six leather pins hold unchanged.\n\n`TECHNIQUE_CRAFT_AXIS` deliberately unchanged, so no technique gates on `leatherWorking` on day one. `studs` stays on `metallurgy` (the substrate is what you attach *to*; the stud is metal and the skill is fastening). `wrapping` is the genuinely mixed case — it introduces `['fiber','leather']` — but pointing it at either pure axis is wrong half the time, and re-pointing would silently gut two tests that drive `technology.textiles` to 0 and 1; the correct fix is material-aware axis resolution, sharing 2GN.99's blocker. The axis earns its keep through `phaseTechnologyWeight`, which is where the conflation actually bit. Also updated: the two untyped axis-list duplicates (`materials.test.ts`'s `VALID_CRAFT_DOMAINS`, `grammars/core.test.ts`'s `PHASE_PATHS`) that fail only at runtime, and doc 05 §3.2's hand-copied interface.", "assignee": "Jason Warren"}, {"id": "2GN.101", "description": "rebuild `MaterialDefinition.physicalProperties` as orthogonal authored axes", "status": "done", "dependsOn": ["2GN.84"], "milestone": "M2", "notes": "Forced out of 2GN.99 on 2026-08-07 (doc 12 §2.35): that task assumed `physicalProperties` could say something useful about how hard a material is to work, and it could not. `workable: boolean` conflated three separate facts — brittleness (obsidian/flint/glass shatter), pliability (linen/leather deform rather than cut) and grain coarseness (granite cannot hold a fine line however carefully worked). `hardness: 'soft'|'medium'|'hard'` was not merely coarse but actively misused: `relief` and `overlay` both carried substrate comments conceding hardness was \"standing in as the nearest proxy\" for a fracture property the type lacked.\n\nSix authored axes replace the pair — `hardness` (1-10, pegged to the real Mohs scale so values stay independently checkable), `fragility`, `rigidity`, `grainFineness`, `porosity`, `combustibility` (all 1-7) — plus `reactivity: { oxidisation }`, keyed by reaction type so future chemistry is additive. All 16 materials scored against every axis, item-by-item, each argued from real materials practice.\n\nTwo axes were discovered mid-review by techniques that had nothing to key on: `patina` is a chemical process (hence `reactivity`, and hence its substrate was `{kind:'none'}` with the live generator patinating stone and glass), and `painting`/`glaze` both wanted absorbency (hence `porosity`), with `combustibility` following from glaze being a firing process. `oxidisation` carries a `-1` not-applicable sentinel feeding a substrate GATE rather than a difficulty penalty — glass has no oxidation chemistry at all, gold has it and is merely resistant (`0`), and keeping those distinct matters.\n\nAxis independence tested, not assumed: obsidian vs granite (same hardness/rigidity, granite less fragile, yet obsidian takes a far finer edge — only `grainFineness` explains it) and gold vs oak. Both pinned as tests.\n\nFour substrate corrections fell out: `patina` gains the oxidation gate; `glaze` a combustibility ceiling; `relief`/`overlay` retire the self-admitted hardness proxy (relief needing BOTH rigidity and fragility, since fragility alone admitted linen and leather); and **`gilding`'s gate was factually wrong** — it required metal, but real gilding is overwhelmingly on wood and gesso, with gilded leather and ceramic well attested. Doc 05 §8.2 carried the same error in prose (\"you don't gild wood\") and is corrected. `studs` changed verdict on gold deliberately (soft but rigid; real goldwork takes rivets).\n\n`deno task check` 0 errors, `deno test` 540/540. Both calibration guards held green throughout — the property model did not move material selection. Full detail: doc 12 §2.35.", "assignee": "Jason Warren"}, {"id": "2GN.85", "description": "propagate the 2GN.80 ruling into the tag vocabulary's documented status semantics", "status": "done", "dependsOn": ["2GN.80"], "milestone": "M2", "notes": "Landed doc-only (2026-08-04, doc 12 §2.29) — the re-scope anticipated on pickup. No code changed: `deno task check` was already 0 errors/549 files before this task started, since the 2GN.80 ruling PR (#48) shipped `AbsoluteTag`/`RelativeTag`/`ArtefactTag` completely, with no `FunctionTag`/`ContextTag` identifier surviving anywhere in `src/`, `scripts/` or `tests/`. Delivered: doc 05 §9.2's code block rewritten from the retired declarations to the shipped vocabulary (closing §2.28's own \"pending\" line), four stale type references elsewhere in doc 05 corrected to match, constraint notes recorded at the three unbuilt consumer sites (doc 05 §13.1 for description generation/2GN.38+, doc 04 §3.2 for the lens/M6, doc 06 §6 for NPC interpretation/M10), and two small corrections in doc 06 (a stale §7 cross-reference corrected to §3.3; the FOR/USED gloss reworded to past tense). Full detail in doc 12 §2.29.", "assignee": "Jason Warren"}, {"id": "2GN.86", "description": "`engine/generation/grammar.ts` — mass proxy sums component footprints; mass bands rebalanced to measured percentiles", "status": "done", "dependsOn": ["2GN.79"], "milestone": "M2", "notes": "Surfaced 2026-08-01 auditing all 43 classification rules at the user's request (the 2GN.79 session had cleared 41 of them in prose without per-rule sign-off). Three rules read `massBand` and all three were misbehaving: R27 (`very-heavy` → communal) fired on 0 of 7200 artefacts, and R25/R26 (heavy edge → labour tool; heavy container → storage) fired on 55.8% of edged and 61.1% of container artefacts while their JSDocs claimed contrasts (\"labour, **not** a blade weapon\"; \"storage jar **rather than** tableware\") that only hold for a minority.\n\n**Root cause was the proxy, not the band boundaries.** `deriveDimensions` computed `primaryExtent * secondaryExtent * (1 + 0.1 * (parts - 1))`, and both extents are *maxima* across components. Each component draws its size from a three-value ordinal table (4/14/40, 5/15/45, 3/8/18), so with 2–13 components at least one almost always rolled `large` and both axes pinned to 45cm: **57.4% of a 7200-artefact sample landed on exactly 45×45=2025**, one value holding the majority of output. No choice of boundary can separate a distribution like that — any cut either includes the spike (that band ≥57%) or excludes it (everything below sums to ≤43%). Compounding it, the proxy's reachable maximum was 4658 against a `very-heavy` threshold of 5000, making that band unreachable by arithmetic rather than merely rare. Same saturation-by-maximum failure as `appliedElementPresent` in 2GN.79, in a different guise.\n\nFixed by summing each component's own major×minor footprint instead: a many-part object is genuinely more massive than a one-part object sharing its largest axis, which a maximum can never express. Distribution went from 21 distinct products (top value 57.4%) to 1810 (top value 1.8%), range 9–4658 → 16–12183. Bands then pinned to measured p15/p45/p80/p95 (233/2033/2892/5007), deliberately tapering rather than equal-sized — most excavated finds are portable, and equal quintiles would have claimed a quarter of all finds are too heavy for one person to lift. Resulting spread: negligible 15.3% · light 29.2% · moderate 35.2% · heavy 15.6% · very-heavy 4.8%.\n\nDownstream: R27 0% → 5.0% (alive for the first time), R25 55.8% → 19.5% of edged, R26 61.1% → 24.8% of containers, R37 1.1% → 1.9% and R39 8.5% → 10.6% (their gated presence flags require `massBand` at most `light`, so more artefacts now qualify as wearable). `portability` also reads mass, so `major-effort` and `team-lift` became reachable. Every other rule unchanged to the decimal. The 2GN.79 calibration guard caught the drift and named both moved rules with their sizes — five recorded rates re-recorded and annotated. Two new grammar tests pin the invariants: mass grows with part count (the old proxy rated one and six large components equal), and no single band may hold a majority of output.", "assignee": "Jason Warren"}, {"id": "2GN.87", "description": "`src/lib/data/classification.ts` — R4's edge-family safety net catches nothing; decide whether to fix the grammar, the condition, or delete the rule", "status": "done", "dependsOn": ["2GN.79"], "milestone": "M2", "notes": "Surfaced 2026-08-01 during the 43-rule audit. R4 (`hasEdge && primaryAxisLength === 'short' && bladeLengthBand !== 'short'` → tool 0.4, everyday 0.2) fired on 0 of 7200 artefacts. Its own JSDoc states it exists \"so no edged artefact leaves the edge family with zero function signal\" — a deliberate safety net that has never caught anything.\n\nMeasured cause: only 50 of 7200 artefacts are edged with a short primary axis, and **all 50 carry `bladeLengthBand: 'short'`**, so R2 (dagger) or R3 (utility knife) always claims them first. The edged axis distribution is long 2214 / medium 444 / short 50, and no short-axis edged artefact has ever had a non-short blade band. Either the grammar cannot produce that combination — worth knowing as a generation gap — or the condition describes a shape that should not exist and the rule is dead code.\n\nDeliverable: determine whether the combination is reachable, then either fix the grammar, correct the condition, or delete R4 and record why. ⚠️ deleting shifts rule indices, so the pinned-index blocks in `classification.test.ts` and `EXPECTED_FIRE_RATES` in `calibration.test.ts` both need updating. Sibling R27 had the same shape (unreachable condition) and was resolved by 2GN.86's mass rebalance; R4 has no equivalent upstream fix identified.", "assignee": "Jason Warren"}, {"id": "2GN.88", "description": "calibration constants audited and justified; `SATURATION_CEILING` moved to the data layer", "status": "done", "dependsOn": ["2GN.79", "2GN.81"], "milestone": "M2", "notes": "Completing the 2GN.79 oversight audit: the retunes and fixtures had per-decision sign-off, but nine supporting constants were chosen without it. Each was measured or removed.\n\n`TOLERANCE_POINTS` 10 → 6. Re-running the whole calibration sweep under five different seed salts moves the worst-case rule by 3.8pp at n=1800, so 10 left only 6.2pp of genuine headroom — a rule could shift 9pp of real behaviour and pass. 6 keeps ~1.6× headroom over noise. Verified by inducing a subtler regression than the mass rebalance (R31 `\u003e= 4` → `\u003e= 3`, a 14.4pp drift), which the tightened band catches and names.\n\n`SAMPLES_PER_CELL` kept at 100, now justified rather than assumed: measured noise floor by cell size is 25→5.4pp, 50→5.1pp, 100→3.8pp, 200→3.3pp, 400→3.5pp, so 100 sits at the knee — 200 buys 0.5pp for double the runtime and 400 buys nothing.\n\n`SATURATION_CEILING` was **defined twice** (exported from the Explorer panel, re-declared as a local const in the guard) with nothing keeping them in sync — a defect introduced by 2GN.79/2GN.81. Now a single export in `src/lib/data/classification.ts`, since it is a fact about the rule set rather than about either consumer, and `routes/` may depend on `lib/` but not the reverse. Value kept at 60.\n\n`DORMANCY_FLOOR` removed along with the `rare` verdict. Measured across all four Explorer culture presets it flagged 4 rules on Tarpan (R27/R30/R31/R40), 1 each on Thalassar and Khaltiris, none on Xoconahtl — and on Tarpan those are the decoration rules, rare because it is a low-decoration culture, i.e. behaving correctly. The verdict reported a property of the selected culture rather than anything actionable, and the fire-rate column already says \"uncommon here\" more precisely. Three verdicts remain, each mapping to an action: `dormant` (investigate — a rule can be unreachable, as R4 is and R27 was), `saturated` (check intent against behaviour), `discriminating`.\n\nR31's weights (`elite 0.4, ornament 0.3`) reviewed and kept: they were authored for a rule meaning \"deliberate embellishment\", and the retuned condition finally delivers that meaning at a selectivity matching R30's (25.2% vs 25.3%). Any further weight change belongs to 2GN.82's systematic pass rather than one rule in isolation.\n\n`mockRegionalWorld`/`mockFullGeologicalContext`/`sampleWorld` lost their `coastalPort` default: which world you generate against changes material distribution substantially, so it is now always a stated choice. The CLI keeps a `DEFAULT_SAMPLE_REGION` so samplers run bare, and every sampler now prints its world in a header — an omitted `--world` was previously invisible in output.", "assignee": "Jason Warren"}, {"id": "2GN.91", "description": "`src/lib/types/description.ts` — add `condition?: VariantCondition` to `DescriptionVariant`; define `VariantCondition` (parameter-value gate + craftDomain/materialId/materialTag material gate)", "status": "done", "dependsOn": ["2GN.35"], "milestone": "M2", "notes": "Surfaced 2026-08-05 during 2GN.36/2GN.37 planning; widened 2026-08-05 during 2GN.36 authoring. `DescriptionVariant` addresses variants by `property` id + `register` + `emphasis` only — a variant fires for every value of its parameter, since the value itself only reaches the text via a `#slot#`. Two condition gaps surfaced against this:\n\n1. **Within-parameter value gating.** `elongated.crossSection`'s 'round' and 'rectangular' values don't support the same interpretive reading (a round cross-section is held differently to a rectangular one) — one template stretched across every value of a parameter reads as either shallow or false for some values.\n\n2. **Cross-property/material gating.** A geometric reading can depend on the component's *material*, not just its own parameter — 'taper suits a forceful strike' is false if the material is brittle. This was originally scoped as technical-only (craft process is materially determined at the root: grinding bronze, knapping obsidian, paring oak and throwing clay are different processes), but interpretive claims need the same gate for the same reason — a functional reading is a claim about geometry *given* material, not geometry alone. Originally proposed as a technical-only mechanism; interpretive authoring showed the same condition is required there, so both registers share this one field rather than duplicating the concept.\n\n`VariantCondition` fields are optional and any-of within, AND across fields (`{craftDomain: ['stoneWorking'], materialId: ['obsidian']}` requires both). No predicate functions (unlike `DECORATIVE_TECHNIQUES.substrate.test` in `data/decorations.ts`) — description data may cross the save boundary, so the condition must stay serialisable. Component *shape* deliberately has no field: the `property` id already carries it (`elongated.edge` only fires on an elongated component). Sibling-parameter conditions (e.g. edge=double AND crossSection=diamond on the same component) are deliberately out of scope — cheap to add later as a non-breaking extension, and premature inclusion risks the 2GN.87 failure mode (a plausible-looking conjunction that matches zero generated artefacts, silently). Guarded instead by the firing-frequency test added in 2GN.36/2GN.37's own test suites.", "assignee": "Jason Warren"}, {"id": "2GN.92", "description": "Doc 05 §13.1 + doc 12 propagation entry — record the `VariantCondition` shape change and the selection-order contract (condition filters the candidate set, then emphasis selects within it)", "status": "todo", "dependsOn": ["2GN.91"], "milestone": "M2", "notes": "Docs task pairing 2GN.91's type change. Doc 05 §13.1 currently publishes `DescriptionTemplate`/`DescriptionVariant` without a condition field; update the quoted interface and prose to match. Doc 12 gets a numbered propagation entry (next after §2.29) recording the change and its origin, matching the convention §2.28/§2.29 set for the `AbsoluteTag`/`RelativeTag` split.", "assignee": "Jason Warren"}, {"id": "2GN.93", "description": "`engine/generation/description.ts` — variant selection honours `condition`: filter candidates by the component's assigned material (via the `componentId → MaterialAssignment → MaterialDefinition` join) before emphasis-based selection", "status": "todo", "dependsOn": ["2GN.91", "2GN.111"], "milestone": "M2", "notes": "Nothing currently does the material join at description time — `NormalisedComponent` carries only `allowedMaterialTags` (a constraint), the actual assignment lives on `ClassifiedArtefact.materials` as a side-table (`MaterialAssignment[]`, joined by `componentId`). ⚠️ Overlaps 2GN.38, which already owns `generateDescription`'s variant selection — resolve at pickup whether this is a distinct task or 2GN.38's description should instead be amended to state selection honours `condition`. Flagged unresolved at authoring time (2026-08-05); do not let both exist as separately-tracked selection logic.", "assignee": "Jason Warren"}, {"id": "2GN.102", "description": "add a formability axis to MaterialDefinition.physicalProperties distinguishing materials worked by subtraction (knapping) from those with a formable/plastic working state (cast, thrown, blown, modelled)", "status": "done", "dependsOn": ["2GN.101"], "milestone": "M2", "notes": "Surfaced 2026-08-07 during PR #53 review fixes (roadmap 2GN.101 follow-on). relief substrate test needed to distinguish fired-clay/glass (both fragile once finished, but modelled/cast before hardening) from obsidian/flint (worked only by conchoidal-fracture subtraction, never formable). No existing axis expresses this: fragility describes the finished object, not the working process, and gating relief on it wrongly excluded fired-clay and glass. grainFineness cannot substitute either — its top rung (\"amorphous or glassy\") describes obsidian and glass identically, so it cannot separate them. Same shape as the reactivity axis 2GN.101 itself added for patina: a technique (relief) had nothing legitimate to key on, so a new orthogonal axis is the honest fix rather than another proxy. Until this lands, relief gates on rigidity alone (src/lib/data/decorations.ts), which is documented there as a known limitation: obsidian and flint pass relief's substrate test when they should not, because there is currently no axis to exclude them correctly. Sixteen materials need individually-argued values against the new axis, following 2GN.101's own per-item authoring pattern.", "assignee": "Jason Warren"}, {"id": "2GN.103", "description": "reconcile calibration.test.ts's measureFireRates and the Explorer's ruleCalibration.ts calibrateRules with sampleBaselines' material-aware grading, and discharge 2GN.99's forward hazard with a per-region meanDecorativeGrade pin", "status": "done", "dependsOn": ["2GN.99"], "milestone": "M2", "notes": "Surfaced 2026-08-07: a fix to sampleBaselines (src/lib/engine/generation/baselines.ts) threaded assignMaterials and gradeDecorativeLayers in before extractFeatures, so R44's meanDecorativeGrade baseline is sampled from the material-aware grade rather than expandDecoration's provisional technique-only value. That fix re-pinned R44's EXPECTED_FIRE_RATES entry from 12.3% to 4.0%, but touched only the baseline side — the two other places that call extractFeatures against generated layers (calibration.test.ts's measureFireRates, which sets EXPECTED_FIRE_RATES including the R44 figure this same fix moved, and ruleCalibration.ts's calibrateRules, the Explorer panel) still fed expandDecoration's ungraded layers straight in. Both were comparing a material-aware baseline against ungraded measured artefacts, so the 4.0% pin was itself measured on the wrong side of the asymmetry it was supposed to fix.\n\nWired both sites to match sampleBaselines' ordering (assignMaterials with its own `${seed}-materials` PRNG stream, then gradeDecorativeLayers, before extractFeatures). Since gradeDecorativeLayers is PRNG-free and assignMaterials draws from an independently-seeded stream, this cannot perturb any non-grade feature — verified directly: R1–R39, R42 came back bit-identical, R44 moved from 4.0% to 10.4% (landing at its p90 rung, as expected once both sides read the same scale). R40/R41/R43 showed a small pre-existing 0.2pp drift, traced to two unrelated substrate-gate fixes (78d7793) that landed between R44's last full recording (8a80823) and this task and were never re-measured against the full EXPECTED_FIRE_RATES array — within TOLERANCE_POINTS, left unpinned, and out of this task's scope.\n\nDischarged doc 12 §2.35's forward hazard against 2GN.99 (\"the moment grading enters the sampled path, meanDecorativeGrade becomes geology-sensitive, and EXPECTED_THRESHOLDS' pooling... becomes a claim nobody has measured\"): measured R44's fire rate per region directly rather than assuming the pooled figure was safe — a real 8.0%–13.7% spread across the six regional worlds, not sampling noise. Added EXPECTED_MEAN_GRADE_BY_REGION, a per-region pin (not pooled, unlike EXPECTED_THRESHOLDS' decorativeLayerCount/decorativeComplexity, which are region-invariant by construction) and a dedicated test asserting each region's rate individually. `deno task check` 552 files, 0 errors; `deno task test` 548/548 passing. Full detail: doc 12 §2.36.", "assignee": "Jason Warren"}, {"id": "2GN.105", "description": "`engine/generation/materials.ts` + `types/artefact.ts` + `data/materials.ts` — apply 2GN.111's ruling to the property model: give `rigidity` per-state values (`{worked, finished}`), re-author `fragility` and `hardness` to the **working** state across all 16 materials (they feed `computeLayerGrade` and nothing else, so the current finished-state authoring is wrong — glass `fragility: 7` cold while decorated hot, fired clay `6` fired while decorated wet), and document the pinned state on `formability` (working) and the state-independence of `grainFineness`, `porosity` and `combustibility`. ⚠️ re-authoring `fragility`/`hardness` shifts `meanDecorativeGrade` for glass and fired clay, so the 2GN.79 calibration guard will flag it and `EXPECTED_FIRE_RATES` needs re-recording with the drift annotated", "status": "todo", "dependsOn": ["2GN.111"], "milestone": "M2", "notes": "Rescoped 2026-08-13 by the 2GN.111 ruling. Was filed presupposing per-state values on every axis ('at minimum worked vs finished'); the spike measured that exactly one axis needs them, so this task now audits a specific list rather than performing a general reconciliation. Surfaced 2026-08-11 during 2GN.102 (doc 12 §2.38). Adding `formability` forced the discovery that its six siblings were authored against the finished object, without the question ever being asked or stated: `glass` (`fragility: 7`) reads cold glass, though hot glass (what `formability` reads) is viscous and freely formable; `iron`'s `hardness`/`rigidity` describe cold-worked iron, not the material as forged hot; `fired-clay`'s `fragility: 6` reads the fired result, though the working state is wet clay; `leather`'s `rigidity: 2` reads cured hide, though wet-moulded cuir bouilli holds a raised form. Only `fired-clay`'s data-file comment ever named this choice, as a one-off aside rather than a stated convention. Not a 2GN.102 workaround to clear — `relief`'s leather exclusion was already corrected on its cured-state merits in that task — this is the general problem of a single finished-state number standing in for a material whose worked properties differ.", "assignee": "Jason Warren"}, {"id": "2GN.106", "description": "`data/decorations.ts` + `engine/generation/decoration.ts` — add `formability` to `MaterialDifficultyAxis`, an `AXIS_NORMALISATION` entry, and per-technique `TECHNIQUE_MATERIAL_SENSITIVITY` weights, with re-measured grade distributions and 2GN.103's regional pins re-verified", "status": "todo", "dependsOn": ["2GN.102", "2GN.111"], "milestone": "M2", "notes": "Filed 2026-08-11 alongside 2GN.102 (doc 12 §2.38). Must first revisit the rung-5 casting/forging conflation recorded in that entry: `formability`'s rung 5 deliberately groups cast metals (bronze/gold/silver) with hot-forged iron as one plastic-working-regime rung — a simplification that is inert while `relief`'s gate is a `\u003e= 3` threshold (rungs 3–6 pass identically) but becomes load-bearing the moment this task reads the rungs as a difficulty gradient rather than a threshold. Note the `1`–`6` range differs from the other five difficulty axes' `1`–`7`, so `AXIS_NORMALISATION`'s `mid`/`half` need their own values, not a copy of a sibling's.", "assignee": "Jason Warren"}, {"id": "2GN.107", "description": "`data/decorations.ts` — sweep every `kind: 'material'` substrate test for exclusions that are artefacts of a proxy axis rather than attested practice, the way `relief`'s leather exclusion was", "status": "todo", "dependsOn": ["2GN.102", "2GN.111"], "milestone": "M2", "notes": "Filed 2026-08-11 during 2GN.102 (doc 12 §2.38). `relief` excluded leather solely as collateral from `rigidity \u003e= 3`, a test aimed at linen, with no material-science basis — corrected in 2GN.102 once `formability` gave the gate something honest to key on. `overlay` uses the identical `rigidity \u003e= 3` test `relief` used to carry; if `formability` is the correct gate for one, `overlay` is the first candidate for the same scrutiny. `studs`/`gilding` already carry a named leather exception and are not suspect on the same grounds.", "assignee": "Jason Warren"}, {"id": "2GN.108", "description": "design spike — should the artefact vocabulary express a short-bodied edged tool that is not a formed blade (scraper, chisel, small adze)? Today it cannot: `primaryAxisLength` bands `dimensions.primaryExtent`, a `Math.max` over every component's major axis drawn from the same `SHORT_MEDIUM_LONG_CM` table `bladeLengthBand` reads, so a non-short blade always lifts the artefact's axis above `short` and the blade band can never exceed the axis band. Measured over 8000 artefacts (2GN.87): only 6 of 12 `(axis, blade)` pairs occur, in a strict triangle, and `axis === 'short'` carried `blade === 'short'` in all 84 cases. These are among the commonest real assemblage finds, so the absence is a genuine content gap — but 2GN.87 ruled that the deleted R4 never encoded a decision to model them (it was authored in PR #37 review to plug a truth-table cell, with the scraper/chisel reading attached afterwards), so the question is open rather than inherited. If ruled yes, this spike also rules the mechanism: a shorter `elongated.length` rung below `short` / decoupling `bladeLengthBand` from the shared cm table so it bands the component's own proportion rather than absolute size / changing `deriveDimensions` so `primaryExtent` is not a plain `Math.max` (the 2GN.86 fix applied to a second symptom of the same cause). Each shifts fire rates set-wide and needs a recalibration sweep costed before it is chosen. A spike, not an implementation task — same shape as 2GN.80/2GN.77", "status": "done", "dependsOn": ["2GN.87"], "milestone": "M2", "notes": "Ruled 2026-08-13 — see docs/spikes/2GN.108-short-bodied-edged-tools.md (full spike), doc 11 §2.11 (locked decision) and doc 12 §2.43 (propagation). **The form is ruled in, on tag-space variety grounds rather than archaeological completeness**: short-bodied edged tools occupy the working/craft/domestic region, so their absence removes one region of the tag space rather than thinning the corpus evenly, leaving edged artefacts skewed to blade-family readings — which propagates into culture tag profiles and surfaces as repetition in the lens, the core mechanic. §2.9's culture-relative baselines cannot compensate, since they sample the same narrowed distribution. **All three candidate mechanisms were rejected as symptom-level.** The real defect is that `bladeLengthBand` bands the wrong quantity: absolute length cannot separate a scraper (edge-dominant, short) from a dagger (edge-dominant, long) from a hafted adze (long body, short edge) — the distinction is the grip-to-edge proportion. Re-based accordingly. **Grip-to-edge needs no role vocabulary**: `attachments` is a populated typed graph and `position` plus per-component extents already exist, so the span is a traversal the three plausibility proxies never used. **Root cause: `position` is documented as an oriented axis but minted as a depth-first traversal index**, so a blade can land at position 0 with its haft after it. Normalisation must orient, by **reversal** rather than rejection — a mirrored artefact carries no information, so rejecting it spends re-expansion budget enforcing probabilistically what construction can guarantee. Deferred: the general working-end definition (2GN.115), which blocks implementation rather than this ruling. Filed: 2GN.115, 2GN.116 (component roles, now blocking 2GN.13/2GN.14), 2GN.117 (implementation). ⚠️ 2GN.109 is live — it was contingent, void only if the form had been ruled out. Recalibration is set-wide and shared with 2GN.67, 2GN.69 and 2GN.109; sequence the sweep once.", "assignee": "Jason Warren"}, {"id": "2GN.109", "description": "`src/lib/data/classification.ts` — replacement edge-family rule for the short-bodied non-blade edge, framed morphologically rather than as a truth-table cell. The deleted R4 (roadmap 2GN.87) failed because its condition described a combination of feature *bands* rather than a shape: whatever signal this rule reads must be one the generator can actually vary independently. **Void if 2GN.108 rules the form out of MVP scope** — file the closure rather than authoring a rule for a form the game does not produce. Adding it shifts `CLASSIFICATION_RULES` indices again, so the pinned-index blocks in `classification.test.ts`, `EXPECTED_FIRE_RATES`/`MIGRATED_RULE_INDICES`/`UNIVERSAL_BY_DESIGN` in `calibration.test.ts` and the Explorer panel's label lookups all need updating together", "status": "todo", "dependsOn": ["2GN.108", "2GN.118"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.110", "description": "design spike — should `CulturalProfile.materialAffinities` support per-material entries alongside per-tag ones? Surfaced by 2GN.78 (doc 11 §2.9, doc 12 §2.40) as an accepted expressive loss: the map is keyed by `MaterialTag`, so with the `precious-*` members retired a culture can say \"we prize metal\" but no longer \"we prize gold specifically\". Thalassar's authored `precious-metal: 1.2` was the one live instance across the four Explorer presets and was dropped rather than re-expressed as `metal: 1.2`, which would newly favour bronze and iron that culture was never authored to prefer. Rule whether that granularity is worth carrying — and if so whether it belongs in `materialAffinities` as a second keyspace, or is better derived from the material's situation the way 2GN.77 ruled preciousness itself must be. Note the tension: a per-material affinity entry is a culture-authored judgement about one material, which is legitimate (it is *that culture's* opinion, not Earth's) but sits close enough to the retired tags that the boundary wants stating explicitly", "status": "done", "dependsOn": ["2GN.78"], "milestone": "M2", "notes": "Ruled 2026-08-13 — see docs/spikes/2GN.110-per-material-affinities.md, doc 11 §2.13 and doc 12 §2.45. **Yes: `materialAffinities` is re-keyed by `MaterialSelector`**, the same tagged union 2GN.112 built for `MaterialFlow`, and for the identical reason — `bone`, `glass` and `leather` each name both a `MaterialTag` and a `MaterialName`, so a bare union cannot distinguish them and precedence would make 3 of 16 materials unselectable by one of their readings. Only half the flow pattern transfers: `includes`/`excludes` exists because membership needs subtraction, and affinities are weights with nothing to subtract. **Resolution is most-specific-wins**: a class entry sets a default, a specific entry is an exception to it — `{tag:'metal'}: 1.5` with `{id:'gold'}: 0.8` reads 'all metals are 1.5, except gold, which is 0.8'. A specific entry with no class entry is well-formed and is what recovers Thalassar's dropped intent exactly (`{id:'gold'}: 1.2, {id:'silver'}: 1.2`, no `metal` entry). **This closes the unruled `max` reduction** flagged in `culturalAffinityWeight`'s JSDoc: per-material entries make the multi-value case arrive via the selector rather than via a multi-tag material, and 2GN.84 already measured max discarding authored values whenever the class tag scored higher (3 of 5 dead), so a specific entry could only ever raise a material, never lower it. Product-of-deviations rejected: 1.5 × 0.8 = 1.2, so a below-neutral authored value yields an above-neutral weight. `materials.ts`'s `culturalAffinityWeight` and `decoration.ts`'s `bestMaterialAffinity` move together. ⚠️ `effectiveOptionWeight` (`grammar.ts`) does NOT participate and this is not an inconsistency to reconcile: it weights grammar options by tag-keyed `culturalModifiers` at stage 4, before materials are assigned at stage 6, so it never sees a material; its `?? 0` default differs deliberately. ⚠️ **The tag-versus-tag tie stays explicitly unruled** — no shipped material carries two class tags, and authoring a rule for a shape that does not exist is the defect 2GN.87 punished. Boundary the brief asked for: a per-material affinity is legitimate because it lives in `CulturalProfile` (that culture's opinion), where the retired `precious-*` tags lived in `MaterialDefinition` (Earth's judgement, applied universally) — the test is where the statement lives, not how specific it is.", "assignee": "Jason Warren"}, {"id": "2GN.111", "description": "design spike — should `MaterialDefinition.physicalProperties` carry per-state values at all, and if so which states? 2GN.102 established a working-state convention for `formability` alone and named the inconsistency in `types/artefact.ts`'s preamble without resolving it (doc 12 §2.38); 2GN.105 was then filed presupposing the answer (\"at minimum worked vs finished\"). Rule the shape before the re-audit: whether a per-state model is warranted or the six pre-2GN.102 axes should instead be pinned to one documented state, how many states (`worked`/`finished`, or a third for `raw`), whether every axis needs every state or only those where the states genuinely differ, and what that does to the authoring burden across 16 materials × 7 axes. `glass`, `iron`, `fired-clay` and `leather` are the known-affected entries. 2GN.105 re-pointed to depend on this rather than on 2GN.102 directly, so the audit follows the ruling instead of assuming it", "status": "done", "dependsOn": ["2GN.102"], "milestone": "M2", "notes": "Ruled 2026-08-13 — see docs/spikes/2GN.111-per-state-physical-properties.md, doc 11 §2.14 and doc 12 §2.46. **Per-state on `rigidity` alone** (`{worked, finished}`); every other axis stays scalar with a documented state. Two states, not three. **The consumers are the fault line, not the physics**: three axes vary strongly by state and one marginally, but what decides the shape is which state each reader needs. `relief` (`formability \u003e= 3`) and wire-drawing (`formability \u003e= 5`) ask working-state questions; the three `rigidity \u003e= 3` gates on overlay/studs/gilding ask a finished-state one; `computeLayerGrade` reads its six difficulty axes in the working state, since difficulty is incurred while working. Bronze is the deciding case — whether it can be forged into a raised form and whether the finished object holds applied leaf are both true and are different numbers, so no single convention serves both. Only `rigidity` is asked in both states by different consumers. Pinning: `formability` working (already correct), `fragility` working, `hardness` working, `grainFineness`/`porosity`/`combustibility` state-independent. Blanket per-state rejected — 16×7×3 = 336 values to capture variation in four axes, and a uniform shape invites false precision (an author given three boxes fills all three). `raw` rejected: no consumer asks about an unworked material. ⚠️ **`fragility` and `hardness` are a live defect**: both feed `computeLayerGrade` and nothing else, so working state is the only correct reading, yet both are authored finished-state — glass carries `fragility: 7` (cold) while decorated hot, fired clay `6` (fired) while decorated wet, both inflating difficulty. The correction is independent of the shape change and ⚠️ **shifts `meanDecorativeGrade`** for those materials, so the 2GN.79 guard will flag it — sequence with the other recalibration-bearing work. Rescoped 2GN.105.", "assignee": "Jason Warren"}, {"id": "2GN.112", "description": "design spike — **RULED 2026-08-12 (PR #57 review), implemented same branch.** Should `MaterialFlow.specificMaterials` narrow a flow or widen it? Neither: the field is gone, and `MaterialFlow` now selects via `includes: MaterialSelector[]` plus optional `excludes`, where `MaterialSelector` is `{ tag: MaterialTag } | { id: MaterialName }`. A flow supplies a material when some `includes` selector names it and no `excludes` selector does — union then subtract, no precedence, no ordering. **Why the shape changed rather than the operator:** the old `materialTag` + `specificMaterials` pair had two fields feeding one selector with the combining rule unstated; `flowSuppliesMaterial` ORed them while the type's own JSDoc claimed the id list narrowed the tag, so the list could only widen and 2GN.78's three re-keyed flows silently reached the whole class. Making it narrow would have expressed 'no metals except gold' but not 'all metals except gold' (only by enumerating the complement, which freezes against a growing catalogue); a single explicit material list had the same gap and also lost the open-over-the-catalogue property of a class tag. Selector arms are tagged because `bone`, `glass` and `leather` each name both a `MaterialTag` and a material id. **Scope addition:** `MaterialName` (`types/tags.ts`) now types every material id — `MaterialDefinition.id`, `RegionalAvailability.materialId`, `GeologicalContext.materialAvailability`'s key, `MaterialAssignment.materialId` and the selector's `id` arm — declared rather than derived from `MATERIALS` (the import would cycle) and pinned to the catalogue by a two-directional test. Doc 05 §3.4 and doc 12 §2.41 record it", "status": "done", "dependsOn": ["2GN.78"], "milestone": "M2", "notes": "⚠️ breaking: `MaterialFlow` loses `materialTag` and `specificMaterials`; `MaterialDefinition.id`, `MaterialAssignment.materialId`, `RegionalAvailability.materialId` and `GeologicalContext.materialAvailability`'s key narrow from `string` to `MaterialName`. **One measured behaviour change:** across all four Explorer presets × 16 materials against `origin/main`, Thalassar loses jade — its `trade-only` jade had been arriving through the obsidian flow's `stone` tag arm under the OR, which nobody authored. Every other pair is byte-identical; all 30 calibration pins hold with nothing re-recorded; 578 tests pass. Two deliberate `as MaterialName` casts remain in `decoration.test.ts`, exercising the runtime unknown-id guard that the type now makes unreachable through normal call sites — still worth keeping against a persisted save or a future catalogue edit. Follow-on left open: whether `excludes` should ever carry a `{ tag }` arm in authored data (it is typed for it, for disambiguation rather than expressiveness, and no shipped flow uses one).", "assignee": "Jason Warren"}, {"id": "2GN.113", "description": "**RULED 2026-08-12 (PR #57 review), implemented same branch.** Give `ClassificationRule` a stable `id` so a rule has an identity independent of its position. Every rule carries a kebab-case slug naming what it reads and concludes (`edge-short-sharp-dagger`), unique across the array and pinned by test; `ruleById`/`requireRuleById` resolve one, and `ruleDisplayLabel` renders the positional `R{n}` the Explorer and samplers still show. **Why:** a rule's only identity was its index, so 2GN.87's deletion of R4 shifted every later rule up one and silently invalidated every `R{n}` reference in comments, docs and tests at once. Nothing failed; the staleness was found by eye, across four follow-up commits (49319ec, f12f535, 15f8c8f, f7dd239), and this review pass still found more (a `R32`/`R29` pair in `classification.ts` and an `R11` in `types/tags.ts` describing rules two indices away). An id-based reference cannot go quietly stale: `requireRuleById` throws naming the missing id, verified by deleting a rule and watching the suite fail. **Scope:** `R{n}` survives as a display label only. Dated measurement records (`calibration.test.ts`'s fire-rate tables, doc 12, the spikes) keep their original numbering, since they describe the 44-rule set as measured; only live cross-references were migrated.", "status": "done", "dependsOn": ["2GN.87"], "milestone": "M2", "notes": "Delivered: `id` on `ClassificationRule` (`types/tags.ts`) with the rationale inline; 43 authored slugs in `data/classification.ts`, each verified against its own condition rather than assigned by position; `RULES_BY_ID` built at module load, throwing on a duplicate id; `ruleById`, `requireRuleById` and `ruleDisplayLabel` exported. `classification.test.ts`'s 43 index constants now call `requireRuleById`, and its 37 weight-signature identity guards are deleted as redundant (the lookup is the guard). Three id-contract tests added: uniqueness plus kebab-case shape, round-trip over every shipped rule plus rejection of the retired `edge-short-body-non-short-blade`, and display-label positionality (`R1`/`R43`, `undefined` for an unshipped rule). Explorer `tagInspector.ts` and `ruleCalibration.ts` carry `ruleId` alongside `label`; `scripts/dev/sample-classification.ts` reads `ruleDisplayLabel`. Doc 05 §9.2's `ClassificationRule` block documents the field per that doc's dated-note convention. Fixture rules in `engine/generation/classification.test.ts` synthesise `fixture-rule-N` ids. Three already-stale live references corrected in passing. Guard verified by deleting a rule: the suite fails with `no rule with id 'edge-multiple-composite'` rather than silently repointing. `deno test`: 581 passed, 0 failed.", "assignee": "claude"}, {"id": "2GN.114", "description": "`tests/fixtures/culture.ts` — extend `mockCulturalProfile`/`mockPhaseCharacteristics` with a high-craft/elite preset (`craftSpecialisation`, `decorativeEmphasis`, `motifComplexity` pushed toward 1.0), so elite/ceremonial-grade artefacts are reachable through ordinary sampling and Explorer calibration runs rather than only via hand-built overrides", "status": "todo", "dependsOn": ["2GN.110"], "milestone": "M2", "notes": "Filed from a real-world-find coverage spike (2026-08-13): ran the full M2 chain (expandGrammar → normaliseArtefact → expandDecoration → assignMaterials → gradeDecorativeLayers → extractFeatures → classifyArtefact) against 18 common real-world archaeological find types across 3000 sampled artefacts (6 mock regions × 500). Coverage (18/18) and frequency ordering (dominant \u003e common \u003e occasional \u003e rare, unranked) both held with no tuning aimed at the outcome. The one gap: `meanDecorativeGrade` capped at ~0.494 across every region under the flat-neutral-0.5 `mockPhaseCharacteristics`/`mockCulturalProfile` fixtures, making elite/ceremonial signatures (gold-lunula-style ornament, ceremonial mace-head) invisible to any default-fixture test or Explorer run — confirmed reachable (70/1000 and 392/1000 respectively) only after hand-pushing `craftSpecialisation`/`decorativeEmphasis`/`motifComplexity` to 1.0 for the spike. Not a pipeline defect; a fixture coverage gap with no reusable preset today.", "assignee": "Jason Warren"}, {"id": "2GN.115", "description": "design spike — what defines an artefact's working end in general, for artefacts with no edge? 2GN.108 ruled that normalisation must orient the artefact (working end at a shared pole across all artefacts sharing a dimensional axis) and that orientation is achieved by reversal rather than rejection, but ruled the general pole definition out of its own scope. For edged forms the working end is the edge; for a hafted head it is the head; for a vessel, disc, ring or pin there may be no functional pole at all. Rule whether orientation is total (every artefact oriented, which needs a pole rule for shapes that have no working end) or partial by design (only artefacts with a distinguishable functional pole are oriented, the rest left unoriented as `bladeLengthBand` already reports `'none'` for edgeless forms). ⚠️ this blocks implementation rather than 2GN.108's ruling: reversal cannot be implemented for edged forms and retrofitted to a different general convention without repeating the recalibration sweep", "status": "todo", "dependsOn": ["2GN.108"], "milestone": "M2", "notes": "Split out of 2GN.108 during the 2026-08-13 spike session. 2GN.108 established that `position` is intended as an oriented shared axis but is minted in `grammar.ts` as a depth-first traversal index (primary-before-attachments), so the invariant is unenforced — a blade can land at position 0 with its haft after it, and nothing rejects or reverses it. The three existing plausibility proxies (`hasGrippableSecondComponent`, `hasAdequateGripLength`, `hasRigidShaft`) each guess around this absence. Reversal was chosen over rejection because a mirrored artefact carries no information (it is the same artefact described backwards), so rejecting it spends re-expansion budget to enforce something probabilistically rather than by construction — but reversal only works if orientation is definable wherever it is applied, which is this spike's question. ⚠️ **Constraint added 2026-08-13 by 2GN.118 (Finding 6):** `bar-form`'s `taper: ['none','single-end','both-ends']` encodes *which end*, and `single-end` is not reversal-invariant — reverse the component and it still reads 'one end' while which end has silently changed, with no data recording which it was. `none` and `both-ends` are symmetric and survive reversal untouched; `single-end` is the sole asymmetric value in the parameter. No classification rule reads `single-end` — `hasImpactSurfaceIn` tests `bar-form`'s taper only for `'none'`, and the one other rule-side consumer (`bladeProfile`, `classification.ts:181`) reads `elongated`'s taper, a different primitive whose `['none','gradual','abrupt']` vocabulary is symmetric and reversal-safe. The description layer does read it, though: `data/descriptions/observational/bar-form.ts:43` interpolates it into 'The form narrows with a `#taper#` taper.' (asserted at `prose.test.ts:123`), so `single-end` already reaches player-facing prose. A reversal would therefore leave a description asserting which end tapers while no data records which end it was — doc 02 pillar 3 (Simulation Honesty), not a dormant parameter — so whatever this spike rules must either make `single-end` a claim about the oriented axis or accept that reversal silently corrupts it. Ruling reversal without addressing it leaves a parameter whose meaning depends on a traversal order the ruling is designed to stop being meaningful.", "assignee": "Jason Warren"}, {"id": "2GN.116", "description": "design spike — should component roles (grip-system, head-system and whatever else the vocabulary needs) become first-class grammar output? All three rules in `data/plausibility.ts` are explicitly proxies standing in for an absent role concept: `hasGrippableSecondComponent` merely counts components, `hasAdequateGripLength` looks for some other medium/long `bar-form` or `elongated` component anywhere on the artefact (its own comment conceding a `disc-form` elsewhere \"says nothing about grip length\"), and `hasRigidShaft` accepts any rigid `sheet-form`/`bar-form` regardless of whether it bears the load. `types/plausibility.ts` names the same hole: the model cannot express a property-level concept like \"a grippable component\". Rule whether roles are authored into the grammar, derived from the attachment graph, or left as proxies for MVP — and if authored, what the role vocabulary is and what it costs across the primitive registry", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-13 from the 2GN.108 spike session. Scoped deliberately narrow: 2GN.108 established that grip-to-edge span is derivable from existing structure (`attachments` graph + `position` + per-component extents) without any role vocabulary, so roles are NOT a prerequisite for oriented normalisation or for a proportional `bladeLengthBand`. What roles would serve is the remaining proxy work in 2GN.13 and 2GN.14, which is why both now depend on this. Note that the `'grip-system'`/`'head-system'` strings in `types/interpretation.ts` are JSDoc illustration, not a defined type, and doc 05's `arrangementGroup` is repetition structure (symmetric/radial/linear-array), unrelated to role — so this vocabulary would be genuinely new rather than a specified-but-unwired concept.", "assignee": "Jason Warren"}, {"id": "2GN.117", "description": "`engine/generation/grammar.ts` + `engine/generation/classification.ts` — implement oriented normalisation and re-express `bladeLengthBand` as grip-to-edge proportion rather than absolute cm, with the full recalibration sweep", "status": "blocked", "dependsOn": ["2GN.115", "2GN.118"], "milestone": "M2", "notes": "Placeholder filed 2026-08-13 alongside the 2GN.108 ruling, so the implementation the spike unlocks exists in the graph rather than only in the spike doc. Depends on 2GN.115 alone: the 2GN.108 edge is reached transitively through it, so drawing it directly would be redundant. Carries two changes that must land together: normalisation orients the artefact by reversal (canonical working-end pole) instead of emitting a raw depth-first `position`, and `bladeLengthBand` bands the grip-to-edge span traversed over the `attachments` graph instead of reading absolute cm off `SHORT_MEDIUM_LONG_CM`. ⚠️ shifts fire rates set-wide — the 2GN.79 calibration guard will flag every moved rule, and `EXPECTED_FIRE_RATES` needs re-recording with the drift annotated. Downstream of 2GN.108 alongside 2GN.67, 2GN.69 and 2GN.109, so sequence the sweep once rather than per-task.", "assignee": "Jason Warren"}, {"id": "2GN.118", "description": "design spike — are the primitive grammar's categorical parameter value-sets rational and justified? `PRIMITIVE_PARAMETERS` (`data/grammars/primitives.ts`) reproduces doc 05 §5.3 verbatim, so this audits the spec's own vocabularies rather than any code drift. Surfaced by 2GN.97 2026-08-13 while stress-testing whether `baseType` is a genuine categorical: it is, but the value-sets around it are not obviously deliberate. Three measured instances, all of the same shape — two primitives expressing the same concept with disjoint vocabularies, so a value is unreachable by primitive typ
