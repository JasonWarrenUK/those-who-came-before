e rather than by design. (a) `base`: `cylindrical` rolls `['flat','rounded','pointed']`, `hollow-enclosed` rolls `['flat','rounded','pedestal']`, making a pedestalled bowl and a pointed cylinder both unreachable — and capping `base-pedestal-display`'s population at hollow-enclosed containers. (b) `opening`: `cylindrical` rolls `['open','restricted','closed']` while `hollow-enclosed` rolls `['wide','narrow','slit','none']` — different vocabularies AND different arities for one concept, leaving `slit` (read by `container-slit-votive`) unreachable on cylinders. (c) `perforation`: `flat-broad` rolls `['none','single','multiple']`, `disc-form` rolls `['none','central','off-centre']` — disjoint, so `perforation-central-rotation` can only ever fire on discs and `perforation-single-pendant` only on flat-broads. Rule for each parameter whether the split is deliberate morphological modelling or an artefact of authoring the BNF primitive-by-primitive; where deliberate, record why; where not, rule the corrected vocabulary. Same shape as 2GN.87's reachability finding, applied to the grammar's inputs rather than a rule's condition", "status": "done", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-13 from the 2GN.97 spike session, which reached it by stress-testing whether `baseType` is a genuine categorical (it is — unlike `wallThickness`, there is no crushed continuous quantity beneath it). The audit question is one level up: whether the value-sets themselves were designed or accreted. ⚠️ Ruling here may change which values exist, so anything authoring rules against them or deriving from them waits: 2GN.10 (`allowedMaterialTags` from primitive type + properties), 2GN.21 (`physicalLabel` from these observable values), 2GN.109 (replacement edge-family rule) and 2GN.117 (re-bands `bladeLengthBand` off `elongated.length`). 2GN.97 is NOT a dependent — it surfaced the defect rather than consuming the vocabulary. **Ruled 2026-08-13 — see docs/spikes/2GN.118-primitive-parameter-value-sets.md.** Seven disjoint shared-name pairs found, not the three filed. `base` unions to `[flat, rounded, pointed, pedestal]` on both primitives (the split made `base-pointed-amphora` unfireable on anything amphora-shaped, since `dominantContainer` always prefers `hollow-enclosed`); `diameter` unifies to `small/medium/large` with derivation owned by 2GN.120; `crossSection`, `shape` and `taper` stay as authored, being genuine per-primitive geometry; `opening` and `perforation` are deferred whole to 2GN.122, each being two axes crushed into one field rather than a vocabulary split. The two base rules keep their weights (authored in cb3e517 before EXPECTED_FIRE_RATES existed, so never fitted to observed rates); only the fire rates move. Ships no src/ change: each ruling lands in its own task so EXPECTED_FIRE_RATES re-records once. Per-culture base weighting filed as 2GN.121; taper reversal constraint recorded on 2GN.115.", "assignee": "Jason Warren"}, {"id": "2GN.119", "description": "design spike — should classification conditions read *relations between components* rather than isolated component properties? Measured 2026-08-13 over all 43 shipped rules during 2GN.97: **10 of the 24 unmigrated rules condition on exactly one property** (`f.x === 'value'` and nothing else) — `base-pedestal-display`, `base-pointed-amphora`, the three `perforation-*` rules, both `ring-*` rules, both `sheet-*` rules and `size-small-personal`. A further 7 read two properties that both describe the *same* component (the container rules pair `hasContainer`, a presence flag, with a feature extracted off the dominant container). Exactly one rule is genuinely relational (`motif-multiple-origins`, comparing origins across the artefact's decoration). A base is a relationship between the base and what it supports: a pedestal under a statue and a pedestal under a hat-stand carry opposite readings, identical `baseType`, and no amount of culture-relativity separates them because the difference is not cultural. The rule reads one term of a two-term relation and discards the term carrying the meaning — doc 02 Simulation Honesty. ⚠️ This is orthogonal to doc 11 §2.9's absolute/relative cut: `perforation-central-rotation` awards `tool` (an AbsoluteTag) and is under-conditioned identically, so the defect is a property of how conditions are written, not of which vocabulary they award from. `NormalisedArtefact.attachments` and `NormalisedComponent.position` are populated and unread by every rule — the same unused-graph finding as 2GN.108. Rule whether conditions gain access to component relations, what that does to `ClassificationRule.condition`'s signature (already widened once by 2GN.80), and which rules are rewritten versus left as affordance readings", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-13 from the 2GN.97 spike session. Scope is **all 43 rules**, not the 24 unmigrated ones: the measurement that produced it covered the 24, but the defect cuts across the absolute/relative boundary, so scoping to relative-award rules would audit the wrong set. Supersedes the framing 2GN.97 inherited — those rules are not unmigrated-but-fine awaiting a baseline, a class of them is under-conditioned, and no baseline of any kind fixes an under-conditioned rule. Absorbs the ambiguity originally filed as a competing-readings question (a central perforation reads spindle-whorl or pendant depending on the disc's size, mass and what it attaches to — the ambiguity IS the missing relational term). ⚠️ Interacts with 2GN.118: that audits which parameter *values* exist, this audits what a condition may *read*. Independent questions on the same surface; neither blocks the other.", "assignee": "Jason Warren"}, {"id": "2GN.120", "description": "`engine/generation/grammar.ts` — derive `wallThickness` as a modelled quantity rather than a free three-value roll. Today `PRIMITIVE_PARAMETERS` rolls `wall: ['thin','medium','thick']` directly, with no continuous value beneath and no input from craft process, material or vessel role. Three consequences ruled in 2GN.97 (2026-08-13): (a) thickness is plausibly a *derivative of the crafting process* and is currently uninfluenced by `craftSpecialisation`, the component's assigned material or what the vessel is for; (b) three rungs is the entire gradation available, too coarse for the distinctions the classification rules try to draw on it; (c) **cross-culture comparison is impossible by construction** — one culture's `thick` may be physically thinner than another's `thin`, and since the band is cut from a global table before anything culture-relative is consulted, no baseline can recover the difference. Fourth instance of the band-computed-from-an-absolute-table family after 2GN.86 (mass), 2GN.87 (blade) and 2GN.108 (axis). Deliverable: a derived thickness quantity with its inputs ruled, and bands cut per-culture rather than globally. ⚠️ **Scope extended 2026-08-13 by 2GN.118 (Finding 5):** `diameter` joins this task as the same defect in a second parameter. 2GN.118 unified its labels (`cylindrical`’s `narrow/medium/wide` and `ring-form`/`disc-form`’s `small/medium/large` were one three-rung axis under two names) but ruled the derivation here, because the argument for keeping the two label sets apart is really an argument for deriving: a cylinder’s diameter reads relative to its own length (a wide tube is wide *for a tube*) whereas a disc’s diameter is its principal dimension, which is a ratio to model rather than two vocabularies to maintain. Nothing reads `diameter` today, so it carries no live consequence yet — but 2GN.118 noted that “harmless because unread” is exactly what let `base-pointed-amphora` sit broken.", "status": "blocked", "dependsOn": ["2GN.135"], "milestone": "M2", "notes": "Filed 2026-08-13 by the 2GN.97 ruling, which found `vessel-thin-walled-fine-ware` and `vessel-thick-walled-utilitarian` unrelativisable: no baseline of any kind — prevalence, stratification or weight-scaling — can relativise a three-value label rolled from a global table, because there is no quantity for a culture to have opinions about. Prevalence in particular cannot work here (unlike `baseType`, where it can): band frequency says nothing about actual thickness, so a culture whose walls are all 3mm and one whose walls are all 30mm both read '100% thin' or '100% thick' depending only on where the global cut falls. ⚠️ The two wall rules stay as they are until this lands — they were left absolute rather than migrated or deleted, recorded as blocked-with-reason. ⚠️ Overlaps 2GN.118, which audits whether the `wall` vocabulary is justified at all; if that spike rules the three-value set out, this task's shape changes with it.", "assignee": "Jason Warren"}, {"id": "2GN.122", "description": "design spike — is there one aperture model, and does it subsume `perforation`? 2GN.118 ruled (2026-08-13) that `opening` is not one axis but at least two crushed into one field: **presence/count** (`closed`/`none` are the same physical fact, scored identically at 0 by `OPENNESS_BY_OPENING`) and **aperture size** (`wide`/`narrow`/`slit`). It also ruled the `cylindrical`/`hollow-enclosed` vocabularies commensurable — `OPENNESS_BY_OPENING` already ranks all seven values on one 0–1 scale, and three shipped rules (`container-wide-open`, `container-restricted-access`, `container-closed-sealed`) pair the cylinder and vessel labels as synonyms by hand, which is the rule layer compensating for a split that should not exist. Two questions this spike owns. **(1) Multiplicity**: a through-void has two mouths (bead, socketed axe, tube) and a two-mouthed vase has two separate apertures — these are different facts and neither is expressible today. **(2) Subsumption**: a hole through a disc (`perforation`) and a hole through a cylinder wall (`opening`) are plausibly one concept split across two parameter names by primitive-by-primitive BNF authoring, the same defect as `base` one level up. If they are one axis, `perforation`'s count/position split (2GN.118's case (c), deferred here whole rather than ruled) resolves inside this model instead. Rule the axis set (count, size, through/blind, position), which parameters survive, and what `ExtractedFeatures` carries. ⚠️ 8 shipped rules read `openingType` or `perforation`; `EXPECTED_FIRE_RATES` re-records once at implementation, which is why this is ruled before 2GN.118's own vocabulary changes are implemented rather than after", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-13 from the 2GN.118 spike session, cases (b) `opening` and (c) `perforation`. The full cross-tabulation of `PRIMITIVE_PARAMETERS` found seven disjoint shared-name pairs, not the three originally filed: `base`, `opening`, `perforation` (all unioned into `ExtractedFeatures` and read by rules) plus `crossSection`, `diameter`, `shape`, `taper` (read by no rule, so no live consequence). 2GN.118 ruled on `base` and on the four unread pairs; `opening` and `perforation` were split out here because they outgrew a vocabulary fix. `opening` is the worst of the three splits — zero shared values between the two primitives AND different arities (3 vs 4) for one concept — but the fix is not a union: Jason ruled the two-axis reading, and then raised multiplicity, which neither vocabulary can express at any arity. Subsumption is this spike's open question and was deliberately not ruled in 2GN.118 for want of measurement: if `opening` and `perforation` are one aperture axis, ruling `opening` first and merging `perforation` later means recalibrating `EXPECTED_FIRE_RATES` twice. Scoped as one spike rather than two on that basis. Renaming was considered and rejected as a separate concern: splitting the axes makes the intuitive vocabulary fall out (`closed`/`none` → count, `open` → `wide`, `restricted` → `narrow`), so no new words are needed for the values that survive.", "assignee": "Jason Warren"}, {"id": "2GN.123", "description": "`types/world.ts` + `engine/generation/materials.ts` + `engine/generation/decoration.ts` — re-key `CulturalProfile.materialAffinities` from `Map\u003cMaterialTag, number\u003e` to the `MaterialSelector` tagged union 2GN.112 built for `MaterialFlow`, resolved **most-specific-wins**. 2GN.110 ruled this on 2026-08-13 and nothing has carried it: the type is still tag-keyed at `types/world.ts:220`, and `data/explorer-cultures.ts` still holds the comment recording Thalassar’s dropped `precious-metal: 1.2` as an open design question. A bare `MaterialTag | MaterialName` union cannot work because `bone`, `glass` and `leather` each name both a class and a material, which is exactly why the flow side needed the tagged form. `includes`/`excludes` does NOT transfer: membership needs subtraction, affinities are weights with nothing to subtract. Deliverable: the re-keyed type, `culturalAffinityWeight` (`materials.ts`) and `bestMaterialAffinity` (`decoration.ts`) moved onto most-specific-wins resolution, the four Explorer presets migrated, and Thalassar’s authored intent restored as `{id:'gold'}: 1.2, {id:'silver'}: 1.2` with no `metal` entry. ⚠️ closes the unruled `max` reduction flagged in `culturalAffinityWeight`’s JSDoc: 2GN.84 measured max discarding authored values whenever the class tag scored higher (3 of 5 dead), so under max a specific entry could only ever raise a material, never lower it — most-specific-wins is what makes `{id:'gold'}: 0.8` under `{tag:'metal'}: 1.5` mean what it reads as. ⚠️ moves material-selection distributions, so `EXPECTED_FIRE_RATES` needs re-recording with the drift annotated", "status": "done", "dependsOn": ["2GN.110"], "milestone": "M2", "notes": "Filed 2026-08-13 during PR #61 review. 2GN.110 was marked done on the strength of its ruling, but no task carried the implementation: `2GN.27`, `2GN.68`, `2GN.114` and `3WS.3` all depend on 2GN.110 while consuming or fixture-building around affinities rather than re-keying them, so the ruling had no destination. Surfaced by a review comment on `site/design/classification.html`, which described the new shape as shipped when the type had not moved; the page now describes it as a ruled contract, and this task is what makes it true. Product-of-deviations was rejected in the ruling (1.5 × 0.8 = 1.2, so a below-neutral authored value would yield an above-neutral weight). A specific entry with no class entry is well-formed and is the case that recovers Thalassar exactly.", "assignee": "Jason Warren"}, {"id": "2GN.124", "description": "`src/lib/data/materials.ts` + `src/lib/types/tags.ts` — widen the material catalogue beyond the 16 shipped materials, scoped to what artefact generation and craft actually need. Four of the eight `MaterialTag` classes are single-leaf (clay, glass, fiber, leather), so `materials.calibration.test.ts` emits no intra-tag split for them — it would \"always read 100% and carry no information\" — leaving half the guard's two-level tree unmeasurable by construction. Covers both filling out thin classes (copper, tin and lead under `metal`; wool and hemp under `fiber`; further clays) and breadth for archaeological plausibility (shell, amber, horn, pigments, composite materials), judged by what a real assemblage needs rather than by filling tag rows for their own sake. ⚠️ may require new `MaterialTag` members, which touches the `MaterialSelector` keyspace and every authored `materialAffinities` entry array; `MATERIAL_NAMES` is declared rather than derived from `MATERIALS` (the import would cycle), so `materials.test.ts`'s two-directional pin fails loudly until the list is updated alongside. ⚠️ moves material-share distributions, so `EXPECTED_TAG_SHARES` and `EXPECTED_INTRA_TAG_SHARES` need re-recording", "status": "blocked", "dependsOn": ["2GN.136"], "milestone": "M2", "notes": "⚠️ **Forward hazard (2GN.128, 2026-08-14):** this task changes the availability model the affinity-silence validator computes its verdict from, so materials that were legitimately silent may become accessible and re-open violations 2GN.128 closed. Re-run the validator and re-close the four presets as part of this task.", "assignee": "Jason Warren"}, {"id": "2GN.125", "description": "design spike — does `AvailabilityLevel` conflate materials that are **found** with materials that are **produced**? `GeologicalContext`'s own JSDoc calls itself \"geological material scarcity\" and cites obsidian, gold and tin, yet it keys `leather`, `linen`, `bone`, `antler`, `oak`, `ash`, `fired-clay` and `glass` — none of which are geological. Measured 2026-08-13: **10 of the 16 shipped materials are produced rather than dug.** Sharpest are `bronze` and `iron`: bronze does not exist in the ground at all (an alloy requiring tin *and* copper) and iron requires smelting from ore, yet each carries a single `AvailabilityLevel` conflating \"the ore is here\" with \"we can smelt it\". **This double-counts**, because `computeMaterialWeight` multiplies `scarcityWeight × phaseTechnologyWeight` as independent terms: for granite they genuinely are independent (the rock is underfoot; carving is a separate skill), but Tarpan's bronze `scarce` stands in for ore-plus-tin-plus-smelting, which its `metallurgy: 0.6` already encodes — the same constraint applied twice. It also makes authoring unstatable: nothing can express \"abundant cattle, no tanning tradition\" or \"rich ore, no smelting\" as distinct from simply \"little leather\" or \"little iron\". Rule whether `AvailabilityLevel` splits into substrate-versus-product, whether a `requiresExtraction` flag or an input-material relation hangs off `MaterialDefinition`, or whether `craftDomain` absorbs the distinction. Sequenced after 2GN.124 deliberately, so the ruling is made against the widened catalogue rather than a 16-material sample that may not contain the awkward cases", "status": "blocked", "dependsOn": ["2GN.124"], "milestone": "M2", "notes": "Filed 2026-08-13 from a preset-cultures audit. The conflation surfaced while checking whether each preset's authored affinities were reachable: Tarpan authors `metal: 1.3` and its geology marks bronze `scarce`, which reads as a statement about deposits but is really a statement about metallurgy. Downstream of 2GN.124 because the ruling should be made against the full catalogue — a widened `metal` class carrying copper and tin separately may itself resolve part of the bronze case, and ruling first would risk modelling around a gap the catalogue task closes.", "assignee": "Jason Warren"}, {"id": "2GN.126", "description": "apply the 2GN.125 ruling to the availability model — `types/world.ts` (`AvailabilityLevel`, `GeologicalContext`, `RegionalAvailability`), `types/artefact.ts` (`MaterialDefinition`), `engine/generation/materials.ts` (`scarcityWeight`, `computeMaterialWeight`, `explainMaterialWeight`) and the four Explorer preset geologies. ⚠️ moves material-selection distributions wherever a produced material stops being weighted as though it were dug, so `EXPECTED_FIRE_RATES` (`calibration.test.ts`), the region/tag share and intra-tag split guards (`materials.calibration.test.ts`) and the preset affinity guard all need re-recording with the drift annotated. ⚠️ breaking if `AvailabilityLevel` gains or splits members: `save.ts` persists world state, and every authored geology in `data/explorer-cultures.ts` and `tests/fixtures/world.ts` is keyed on the current five levels", "status": "blocked", "dependsOn": ["2GN.125"], "milestone": "M2", "notes": "Blocks 3WS.3, 3WS.6 and 3WS.7 — the three M3 generators that emit or consume this model. 3WS.7 generates `AvailabilityLevel` directly; 3WS.3 generates `CulturalProfile.materialAffinities`, whose coherence depends on what an availability level means; 3WS.6 generates `MaterialFlow`s, and a found/produced split changes what a flow can coherently carry (ore, ingots and finished hide are different goods). All three already sit behind the M2 gate via 3WS.1, so these edges record ordering rather than changing any status today — they survive the gate lifting, which is the point. ⚠️ **Forward hazard (2GN.128, 2026-08-14):** this task changes the availability model the affinity-silence validator computes its verdict from, so materials that were legitimately silent may become accessible and re-open violations 2GN.128 closed. Re-run the validator and re-close the four presets as part of this task.", "assignee": "Jason Warren"}, {"id": "2GN.127", "description": "design spike — should a material absent from `CulturalProfile.materialAffinities` resolve to the neutral `1`, or is silence an authoring error that should throw? `culturalAffinityWeight` (`engine/generation/materials.ts`) returns `1` for any material no entry matches, and `computeTechniqueWeight` (`decoration.ts`) does the same for `techniqueAffinities` — so **an unauthored material is indistinguishable from one deliberately authored at exactly `1.0`.** Measured 2026-08-13 across the four Explorer presets: 8–12 of 16 materials and 13–14 of 16 techniques resolve by default rather than by authorship, so most of every preset is silence. Xoconahtl's `['clay', 1.0]` is the case that exposes it — behaviourally identical to omitting the entry, kept only because a comment says it is deliberate indifference, which is exactly the distinction the type cannot carry. ⚠️ The stakes cut both ways and the spike must weigh both: throwing makes every preset state a judgement about every material (~250 authored numbers across four presets today, growing with 2GN.124's widened catalogue) and turns a new material into a breaking change for all authored cultures; keeping the default leaves \"considered and indifferent\" and \"never considered\" permanently indistinguishable, which is the same silently-dead-authoring failure 2GN.84 measured on the retired `precious-*` entries. Options to rule between include: keep the default; throw on omission; require an explicit neutral sentinel; or a `completeness: 'partial' | 'exhaustive'` flag on the profile letting a culture opt into strictness. Applies equally to `techniqueAffinities`, `contextWeights` and `siteTypeWeights`, which share the shape — rule the family, not the one map", "status": "done", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-13 from a preset-cultures audit. Sits alongside doc 12 §2.47's lesson that a dormant path accumulates no evidence about itself: a defaulted entry is dormant authoring, and nothing in the suite can tell it from a decision. Related to 2GN.124 (a widened catalogue multiplies the authoring cost of throwing) but not blocked on it — the ruling is about the contract, not the catalogue size, and can be made against the 16 shipped materials. Ruled 2026-08-14 — see docs/spikes/2GN.127-affinity-silence.md, doc 11 §2.15 and doc 12 §2.49. **Silence is legitimate iff the material is inaccessible** (`absent` locally with no flow reaching it, or unmodelled in that geology); anything obtainable locally or by trade must carry an entry, class or specific, enforced by a validator at profile-construction time. None of the four options in the brief was taken: absence is derivable from `isAvailable`, so the distinction becomes a validation question rather than a syntax one — no sentinel, no completeness flag, no migration of authored profiles. ⚠️ Throwing on all omission was rejected for abolishing absence rather than distinguishing it. Two corrections to the brief: `contextWeights`/`siteTypeWeights` have **no engine readers**, so ruling the whole family would author contracts against unobserved behaviour; and `isAvailable`'s MVP lenience reads unmodelled as available, which inverts the rule, so the validator treats it as a third state. Measured 31 violations against 8 legitimate silences across the four presets. Implementation is 2GN.128; `techniqueAffinities` is 2GN.129, deferred behind the `materialAccessGate` `\u003e 1` substrate-gate defect the ruling surfaced.", "assignee": "Jason Warren"}, {"id": "2GN.128", "description": "`engine/generation/cultureValidation.ts` (new) + `data/explorer-cultures.ts` — enforce the 2GN.127 ruling: silence in `CulturalProfile.materialAffinities` is legitimate **iff** the material is inaccessible to that culture (`absent` locally with no `MaterialFlow` reaching it, **or** unmodelled in that geology); a material that is locally obtainable, or `trade-only` with a flow that reaches it, must carry a matching entry, class or specific. Validator throws at profile-construction time, not during generation. ⚠️ `isAvailable`'s MVP lenience returns `true` for an unmodelled material, which read naively inverts the rule — unmodelled is the strongest case for \"never encountered\", so the validator must treat `level === undefined` as a third state, the way `scarcityWeight`'s JSDoc already does, rather than folding it into accessible. ⚠️ The obligation is **one-directional**: accessible ⟹ must be covered; covered ⟹ nothing implied about access, so an entry covering an inaccessible material is legal and silent. Class entries discharge the obligation (most-specific-wins already treats a `{ tag }` entry as each covered material's real weight), which is what keeps authoring terse — khaltiris states 2 entries covering 8 materials. Measured 2026-08-14 across the four presets: **31 violations against 8 legitimate silences** (tarpan 6/3, thalassar 11/1, xoconahtl 6/4, khaltiris 8/0), so all four are re-authored here and the validator throws from the start. Khaltiris has no legitimate silences and must state a position on all 16 materials. Presets are re-authored to fit the rule, not the reverse: they exist to showcase the engine. Xoconahtl's `['clay', 1.0]` and its comment naming this question resolve here", "status": "done", "dependsOn": ["2GN.127"], "milestone": "M2", "notes": "Ruled by 2GN.127 on 2026-08-14 — see docs/spikes/2GN.127-affinity-silence.md, doc 11 §2.15 and doc 12 §2.49. Ships ahead of 2GN.124/2GN.126 deliberately: both rewrite the availability model the validator reads, so each will re-open violations this task closes, but the validator is the durable artefact and building it first is what makes those tasks' preset edits checkable. ⚠️ Forward hazard recorded on 2GN.124 and 2GN.126. Scope is `materialAffinities` only — `techniqueAffinities` is 2GN.129, and `contextWeights`/`siteTypeWeights` have no engine readers at all and inherit the principle when they get one (ruling strictness for a dormant map is the defect 2GN.87 punished). **Landed 2026-08-14** — validator is `findAffinitySilenceViolations` / `assertAffinitiesCoverAccessibleMaterials` in `engine/generation/cultureValidation.ts`; enforcement point is module load in `data/explorer-cultures.ts`. All 31 violations closed (tarpan 7 entries, thalassar 12, xoconahtl 8, khaltiris 9); suite 594 → 611 passing with no calibration pin re-recorded. Two findings recorded in doc 12 §2.50: the three-state read needed no new export (`explainMaterialWeight` already returns `level` and `available` separately, so accessibility is `level !== undefined && available`, and the private region helpers stayed private); and a duplicate class selector silently voids `materials.calibration.test.ts`'s `classLifted` arm, which is why thalassar discharges bronze/iron specifically rather than with a `metal` class entry. Xoconahtl's `['clay', 1.0]` keeps its value — only the comment was discharged — because it is the live instance of the `\u003e 1` substrate-gate defect 2GN.129 rules.", "assignee": "Jason Warren"}, {"id": "2GN.129", "description": "`engine/generation/decoration.ts` — extend the 2GN.127 silence rule to `techniqueAffinities`, and rule the substrate-gate question it exposes. Techniques have a derivable accessibility one hop out: `materialAccessGate` already establishes that a culture with no gold cannot gild and no engravable material cannot engrave, so \"silence is legitimate iff inaccessible\" transposes cleanly. ⚠️ **Blocked on a prior defect, which is this task's to rule**: `materialAccessGate`'s substrate check requires `culturalAffinityWeight(material, culture) \u003e 1`, strictly better than neutral, so a material authored at exactly `1.0` fails it identically to one the culture cannot obtain. Once 2GN.128 pushes cultures to author far more entries, a culture that explicitly states indifference to bronze gets bronze-substrate techniques suppressed exactly as though bronze were unobtainable — the ambivalent-versus-absent collapse 2GN.127 exists to eliminate, reappearing inside the gate meant to model access. Whether affinity should gate substrate access at all is the question; `hasIntroducedMaterialAccess` deliberately gates on availability alone and is the contrast case. ⚠️ moves technique-selection distributions, so decorative calibration guards need re-recording with the drift annotated ⚠️ Measured 2026-08-14 by 2GN.128 and now live in the presets: xoconahtl authors `['clay', 1.0]` against `abundant` clay, and it fails the gate (`affinity=1, isAvailable=true` → substrate access `false`). 2GN.128 deliberately kept the `1.0` rather than nudging it past the gate, so the evidence survives for this ruling.", "status": "blocked", "dependsOn": ["2GN.128", "2GN.134"], "milestone": "M2", "notes": "Filed 2026-08-14 by the 2GN.127 ruling, which deferred the technique half rather than ruling it blind — see docs/spikes/2GN.127-affinity-silence.md's closing section and doc 12 §2.49. The `\u003e 1` gate is a live defect independent of whether the silence rule extends: it already means an authored-neutral material cannot serve as a substrate, which no ruling ever established.", "assignee": "Jason Warren"}, {"id": "2GN.130", "description": "`src/lib/data/names/modern.ts` — the curated modern language: one pinned `Phonology` shared by every world seed, naming the player's own institutions, venues and colleagues. Generated by `generatePhonology` from a fixed seed constant rather than hand-authored, so it emanates from the same system as the ancient languages and inherits any later sound-change work; curated only in the sense that its seed is pinned, not rolled per world. Establishes the diegetic contrast the interpretive frame needs: the player reads ancient names *through* a modern tongue, and the untranslated-tablet phase later depends on the player's own language being a fixed, known reference point against which unknown ones are strange. Adds a `MODERN_LANGUAGE_ID` reserved outside the per-world `LanguageForest`, since it belongs to no ancient family and must never be assigned to a culture.", "status": "done", "dependsOn": ["2GN.66"], "milestone": "M2", "notes": "Ruled during the 2GN.66 spike conversation: the modern language sits OUTSIDE `LanguageForest`, not as a family of one inside it. The forest is per-world-seed and generated; this is global and fixed, so a member inside it would be a language belonging to no culture. `generatePhonology(createPrng(MODERN_LANGUAGE_SEED))` is the whole curation mechanism — a fixed seed string yields one stable phonology, verified during 2GN.66.", "assignee": "Jason Warren"}, {"id": "2GN.131", "description": "design spike — what does the decorative recursion depth cap actually compute from `craftSpecialisation` and `aesthetics.decorativeEmphasis`?", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "2GN.32's own title names both inputs, but no integer mapping, scale, or per-depth decay exists anywhere. Doc 05 §8.3's four-corner table ('0–1 layers' / 'up to 3 layers deep') was measured and ruled unbuildable as a single volume scalar by doc 11 §2.10 (roadmap 2GN.98), which deliberately split the table into `decorationVolume` (reads `decorativeEmphasis` alone) and `DecorativeLayer.grade` (reads `craftSpecialisation` alone) — leaving recursion depth itself unresolved; doc 12 §2.24 records 'defer to 2GN.31' as one of the rejected candidate answers, confirming depth was consciously left open rather than decided in advance. Nearest in-codebase precedent: `grammar.ts`'s attachment recursion (`MAX_ATTACHMENT_DEPTH = 3`, `ATTACHMENT_PROBABILITY = 0.4`, `ATTACHMENT_DEPTH_DECAY = 0.5`, gated via `prng() \u003c probability * decay ** depth`) — the same shape, but with fixed constants rather than values derived from two phase attributes. Doc 05 §8.3's 'up to 3 layers deep' corner is the only numeric ceiling anchor in the docs. Also stale and worth correcting alongside this ruling: `types/world.ts` lines 42–44 still say craft alone drives the recursion cap, predating §2.10's split of volume from grade. Surfaced 2026-08-19 during an attempt to implement 2GN.31/2GN.32 (see BLOCKED.md at the repo root for the full research trail).", "assignee": "Jason Warren"}, {"id": "2GN.132", "description": "design spike — does sublayer generation live inside `expandDecoration`'s existing slot loop, or as a separate unwired post-pass?", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Folding sublayer draws into `expandDecoration`'s existing slot loop changes its deterministic draw sequence for every artefact, moving `EXPECTED_FIRE_RATES`/`EXPECTED_THRESHOLDS`/`EXPECTED_MEAN_GRADE_BY_REGION` in `calibration.test.ts`, the p75 pin in `statistics.regression.test.ts`, and breaking `classification.test.ts`'s explicit `maxDepth === 1` regression guard (the '2GN.31 regression guard' test) — all three carry the 'when this fails, it is usually right, widening the band is usually wrong' warning, so re-recording them correctly requires deliberately re-measuring the new distribution, not just making the assertion pass. The alternative, a separate post-pass, matches the precedent `enforceSubstrates` (2GN.30) and the material-sensitivity extension (2GN.99) already set: both shipped unwired specifically to avoid perturbing the draw sequence and moving any calibration pin. `assignDecorativeDetails`/`gradeDecorativeLayers` are already written recursion-ready in this shape, waiting for something to populate `sublayers`. Neither option is free: the first is real integration at calibration-breaking cost; the second is safe to ship but leaves `expandDecoration` itself flat, and nothing currently calls `assignDecorativeDetails` in production (2GN.84's note) — a discouraging precedent for 'ship it unwired and something will call it later'. Surfaced 2026-08-19 during an attempt to implement 2GN.31/2GN.32 (see BLOCKED.md at the repo root for the full research trail).", "assignee": "Jason Warren"}, {"id": "2GN.133", "description": "`engine/generation/decoration.ts` — make `enforceSubstrates` and `gradeDecorativeLayers` parent-material-aware for sublayers", "status": "blocked", "dependsOn": ["2GN.31"], "milestone": "M2", "notes": "`satisfiesSubstrate` (`enforceSubstrates`) and `regrade` (`gradeDecorativeLayers`) both read `componentMaterial.get(layer.targetComponentId)` at every recursion depth, so a sublayer's substrate/grade check tests against the parent component's assigned material rather than the parent layer's own introduced material — silver inlay chased on top of a bronze panel would have its chasing tested against bronze, never silver. Neither 2GN.31 nor 2GN.32's description names this; it only becomes checkable once sublayers exist for real. Filed separately from 2GN.31 rather than absorbed into its scope, per the project's convention of naming a surfaced model gap rather than working around it silently. Surfaced 2026-08-19 during an attempt to implement 2GN.31/2GN.32 (see BLOCKED.md at the repo root for the full research trail).", "assignee": "Jason Warren"}, {"id": "2GN.134", "description": "design spike — should cultural affinity gate substrate access at all? `materialAccessGate` (`engine/generation/decoration.ts`) requires `culturalAffinityWeight(material, culture) \u003e 1`, strictly better than neutral, so a material authored at exactly `1.0` — explicit indifference under the 2GN.127 ruling — fails the gate identically to one the culture cannot obtain: the ambivalent-versus-absent collapse 2GN.127 eliminated, reappearing inside the gate meant to model access. `hasIntroducedMaterialAccess` deliberately gates on availability alone and is the contrast case. Evidence is live in the presets: xoconahtl authors `['clay', 1.0]` against `abundant` clay and fails the gate (`affinity=1, isAvailable=true` → substrate access `false`); 2GN.128 deliberately kept the `1.0` so the evidence survives for this ruling. Rules the gate question so 2GN.129 can extend the silence rule without inheriting the defect. ⚠️ any change moves technique-selection distributions, so the recalibration cost must be measured before a mechanism is chosen", "status": "todo", "dependsOn": ["2GN.128"], "milestone": "M2", "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.129 was written as implementation but its own text names this as \"this task's to rule\", and its dependency 2GN.128 only implements the `materialAffinities` half — the spike (2GN.127) scoped itself to materials and deferred the substrate-gate question by name. Splitting the ruling out leaves 2GN.129 as pure implementation.", "assignee": "Jason Warren"}, {"id": "2GN.135", "description": "design spike — rule the inputs to the derived `wallThickness`/`diameter` quantity 2GN.120 implements: which modelled quantities feed the derivation (`craftSpecialisation`, the component's assigned material, vessel role for thickness; the length ratio 2GN.118 identified for diameter — a cylinder's diameter reads relative to its own length while a disc's is its principal dimension), what continuous value sits beneath the bands, and how per-culture band cutting works so cross-culture comparison stops being impossible by construction. Fourth instance of the band-computed-from-an-absolute-table family (2GN.86 mass, 2GN.87 blade, 2GN.108 axis) — but unlike those, no spike has ruled this one's derivation", "status": "todo", "dependsOn": ["2GN.118"], "milestone": "M2", "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.120's deliverable says \"a derived thickness quantity with its inputs ruled\", but nothing upstream rules them — spike 2GN.118 explicitly deferred diameter's derivation \"to the 2GN.120 family\", and 2GN.120 itself has no spike dependency. This spike owns the ruling; 2GN.120 becomes pure implementation.", "assignee": "Jason Warren"}, {"id": "2GN.136", "description": "design spike — rule the selection criteria and target size for widening the material catalogue: what \"what a real assemblage needs\" (2GN.124's stated judge) means concretely — which single-leaf `MaterialTag` classes must gain siblings for `materials.calibration.test.ts`'s intra-tag guard to measure anything (clay, glass, fiber, leather), which archaeologically common materials earn a slot (shell, amber, horn, pigments, composites), whether new `MaterialTag` members are admitted, and the per-candidate recalibration cost (`EXPECTED_TAG_SHARES`/`EXPECTED_INTRA_TAG_SHARES` move; every authored `materialAffinities` entry array and the 2GN.128 validator verdicts are touched)", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.124 is written as implementation but no doc section defines selection criteria or a target catalogue size, and the change is calibration-shifting. This spike rules the scope; 2GN.124 implements it.", "assignee": "Jason Warren"}, {"id": "2GN.137", "description": "design spike — rule the value of N for the plausibility re-expansion attempt cap. The exhaustion contract is already fully specified (doc 05 §5/§14 and doc 12: typed `PlausibilityExhaustedError`, no fallback artefact), but both docs use \"N attempts\" as a literal placeholder — no numeric value is pinned anywhere. Rule it measured rather than guessed: sample the plausibility-failure rate distribution over seeds with `checkPlausibility` (2GN.12, done) and pick the N that bounds exhaustion probability at an agreed tolerance", "status": "done", "dependsOn": ["2GN.12"], "milestone": "M2", "notes": "Ruled 2026-08-25 — see docs/spikes/2GN.137-re-expansion-attempt-cap.md, doc 11 §2.19 and doc 12 §2.54. **N = 20**, shipped as `MAX_PLAUSIBILITY_ATTEMPTS` in `data/plausibility.ts` with `PLAUSIBILITY_FAILURE_CEILING = 0.5` and a per-preset guard in `plausibility.calibration.test.ts`. Measured over 5000 seeds × 7 cells: per-attempt failure runs 13.2% (craft 0.1) to 43.3% (xoconahtl); attempts confirmed independent, so exhaustion is p^N = 5.4e-8 per artefact at the worst cell (≈3e-5 per 500-artefact career). N=10 rejected (11% of careers would hit the error), N=15 rejected (no headroom against the next rule). The rate itself is a generator defect — wrapped-join and rigid-shaft rules reject structure `expandGrammar` rolls without reading `allowedMaterialTags` — filed as 2GN.145. Original notes: Filed 2026-08-20 from the M2 dependency audit: the narrowest of the audit's five gaps — 2GN.16's contract is real, only the constant is unruled. Deliberately small; may resolve in one measurement session.", "assignee": "Jason Warren"}, {"id": "2GN.138", "description": "design spike — define \"interpretive challenge\" as a measurable per-artefact quantity and rule the excavation ambiguity distribution targets. Doc 05 §11.3 specifies the principle (measure the interpretive-challenge distribution of a batch, steer the next excavation if skewed) and gives one illustrative skew example (\"90%+ clearly classifiable\"), but never defines the quantity — no formula, no per-artefact scoring rule. 2GN.45's target bands (~30-40% clear / ~40-50% moderate / ~20-30% high) trace to no doc section. Rule the scoring formula (candidate inputs: classification-rule fire counts and margins, tag ambiguity, occluded-property coverage) and re-derive or ratify the bands against measured generator output", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.45 and 2GN.46 both require a metric doc 05 deliberately left qualitative, and 2GN.45's bands appear to originate in the roadmap task text itself. Blocks both.", "assignee": "Jason Warren"}, {"id": "2GN.139", "description": "design spike — rule the arrangement-pattern assignment mechanism 2GN.67 needs: detection is already contracted (`tallyArrangements`' same-primitiveType-within-one-top-level-group boundary, per 2GN.6), but nothing in the grammar ever *assigns* a pattern (2GN.3 rolls repetition incidentally, `checkAccumulation` only validates admissibility), so `arrangementGroup.pattern` has no faithful source. Rule whether assignment threads a deliberate choice through `expandGrammar`'s determinism-critical draw sequence (moving every calibration pin) or is derivable at flatten time from structure already rolled — and if threaded, where in the sequence the draw lands", "status": "todo", "dependsOn": ["2GN.108"], "milestone": "M2", "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.67's own text names pattern assignment as \"the open question this task owns\", and its spike dependency 2GN.108 ruled a short-bodied-edged-tool vocabulary question, not this. 2GN.108 stays as a dependency for the shared recalibration-sweep sequencing its notes record.", "assignee": "Jason Warren"}, {"id": "2GN.140", "description": "design spike — rule how the grammar models intentional multi-part assemblages versus stray components: `\u003cobject\u003e ::= \u003ccomponent-group\u003e+` lets `expandGrammar` roll multiple independent groups with no signal for whether that is a designed co-deposit (hoard, burial set) or an accidental artefact of complexity-budget rolls. Rule what carries the signal (a deliberate assemblage draw with its own cultural weighting, a post-hoc heuristic over rolled structure, or a provenance-level property assigned at excavation composition rather than generation), and what downstream consumers — classification, description, the lens — are entitled to read from it", "status": "todo", "dependsOn": ["2GN.108"], "milestone": "M2", "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.69 is written as implementation but no doc or spike supplies an assemblage-detection heuristic, and its spike dependency 2GN.108 ruled a vocabulary question, not assemblage modelling. 2GN.108 stays as a dependency for the shared recalibration-sweep sequencing its notes record.", "assignee": "Jason Warren"}, {"id": "2GN.141", "description": "`src/lib/data/plausibility.ts` — revisit the material-structural plausibility rules (roadmap 2GN.15) once `fragility` is re-authored to the working state: (1) reconsider whether `fragility` should be reintroduced as a genuine second axis in the wrapped-join check, alongside `rigidity`, and (2) confirm which state (worked vs finished) the rigid-fastener and wrapped-join rules actually want to read once 2GN.105 implements the per-state `{worked, finished}` shape 2GN.111 ruled for `rigidity` (the current code reads the pre-split scalar interface, since 2GN.105 hasn't landed yet)", "status": "blocked", "dependsOn": ["2GN.105"], "milestone": "M2", "notes": "Filed 2026-08-21 during 2GN.15's implementation. 2GN.15's wrapped-join rule deliberately does not use `fragility` today: jade's currently-authored finished-state `fragility: 2` would have wrongly passed a rigid, unbendable stone as \"wrappable\" under an OR-with-rigidity test, and `fragility` is pinned by 2GN.105 (still open) to move to the working state `computeLayerGrade` actually needs, so today's values describe the wrong moment for a workability question either way.", "assignee": "Jason Warren"}, {"id": "2GN.142", "description": "design spike — should `ClassificationContext`/`FeatureBaseline`/`baselines.ts`'s sampling machinery gain a region dimension, and if so what shape? Doc 11 §2.9 states plainly that \"material baselines are keyed by culture-phase × region\" (unlike decoration baselines, which need no region key, since geology is regional and culture is not — a culture spanning two regions faces different material availability in each), but `ClassificationContext` (`types/tags.ts`) carries only `cultureId`/`phaseId`, `FeatureBaseline` has no region field, and `baselines.ts`'s sampling pass has no region dimension anywhere (confirmed: zero hits for \"region\" in that file outside one comment). Rule: (1) whether `ClassificationContext` gains a region field alongside `cultureId`/`phaseId`, or region-keyed baselines live in a separate structure (e.g. a nested map); (2) whether the sampling pass needs a per-region pass mirroring §2.36's `EXPECTED_MEAN_GRADE_BY_REGION` precedent for `meanDecorativeGrade`'s identical regional-pooling problem; (3) how a rule reads a region-keyed baseline when an artefact's producing region isn't always known to the classification-time context", "status": "done", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-21 while scoping 2GN.27: this is a real gap in already-shipped baseline infrastructure, not new scope invented for that task — doc 11 §2.9 predates the code that should have implemented region-keying. 2GN.27 cannot percentile a material-derived weight signal correctly without it, since `explainMaterialWeight`'s availability/scarcity term is fundamentally regional (`bestRegionalLevel` reads `GeologicalContext` by region) and a culture-phase-only baseline would silently pool distinct regional distributions into one, understating or overstating precious-material fire rates for a culture spanning multiple regions. Also blocks 2GN.68, which shares 2GN.27's exact four-term formula and the same regional-pooling problem. Ruled 2026-08-24: region is world-level, referenced by a new `CulturePhase.geography.regions: string[]` (plural, for a phase spanning several); `bestRegionalLevel` resolves against a phase's occupied regions rather than collapsing across the whole world (the measured defect); production region is a complete copy of deposition region for MVP; no rule reads region directly, so `ClassificationRule.condition` doesn't widen again. Full reasoning: `docs/spikes/2GN.142-region-keyed-baselines.md`, propagated to doc 11 §2.9 and doc 12 §2.53. Implementation (the consequences list: `CulturePhase.geography`, `CulturePhaseSample`, `ClassificationContext` region label, `bestRegionalLevel` fix) is unimplemented and filed as a follow-up task rather than folded into this spike.", "assignee": "Jason Warren"}, {"id": "2GN.143", "description": "design spike — what role does `MaterialAssignment.provenance` (`local`/`trade`/`unknown`, from `deriveMaterialProvenance`) play in the material-standing formula doc 11 §2.9 states as \"availability × cultural affinity × provenance × stratification\"? Provenance is categorical, not numeric, so it cannot be a literal multiplicative term — the formula as stated in doc 11/roadmap prose is imprecise about provenance's actual mechanism. Measured 2026-08-21 while scoping 2GN.27: `explainMaterialWeight`'s existing weight (culturalAffinity × phaseTechnology × scarcity) already produces a real local/trade split with no separate provenance term (mean weight 0.371 for locally-sourced materials vs 0.119 for trade-sourced, across all 6 regional worlds × 16 materials) — provenance's effect may already be embedded in the scarcity term via `bestRegionalLevel`'s trade-only rung, not an independent signal. Rule whether provenance should (a) stay implicit in the weight as measured, (b) become an explicit categorical multiplier keyed by `provenance.source`, or (c) something else entirely, and update doc 11 §2.9's formula statement to match whichever is ruled", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-21 per Jason's ruling that session: 2GN.27 proceeds using the 3-term weight alone (availability × cultural affinity, folded through `explainMaterialWeight`, plus stratification once 2GN.96 lands), dropping provenance as a separate factor for that task rather than blocking on this spike. Also relevant to 2GN.68, which shares the identical formula.", "assignee": "Jason Warren"}, {"id": "2GN.144", "description": "`types/world.ts` + `engine/generation/baselines.ts` + `types/tags.ts` + `engine/generation/materials.ts` — implement 2GN.142's ruling: `CulturePhase` gains `geography: { regions: string[] }` (plural, for a phase spanning several regions); `CulturePhaseSample` gains a matching `geography` field directly (not a nested `CulturePhase` — the sample bag stays structural until 3WS.3/3WS.4 land real culture/phase generation); `ClassificationContext` gains a region label sourced from the same field, alongside the existing `cultureId`/`phaseId` provenance labels (`emptyClassificationContext` needs a placeholder value); `bestRegionalLevel` (`materials.ts`) resolves against a culture-phase's occupied regions instead of scanning the whole `GeologicalContext` unconstrained — the actual collapse fix the spike measured, threaded through its four callers (`isAvailable`, `scarcityWeight`, `explainMaterialWeight`, `deriveMaterialProvenance`) and `assignMaterials`'s call chain. Three call sites also need the new field: `calibration.test.ts`'s `baselineFor` (stops abusing `cultureId` to hold a region name), `routes/dev/explorer/shared/baselineCache.ts`'s `baselineFor`, and the `tests/fixtures/artefact.ts` `ClassificationContext` fixture builder", "status": "todo", "dependsOn": ["2GN.142"], "milestone": "M2", "notes": "Filed 2026-08-25 as the implementation follow-up to 2GN.142 (ruled, not implemented). Not a blocker for 2GN.27/2GN.68 — neither reads region directly (per 2GN.142's own Finding 2), and both are already unblocked by the ruling itself. 3WS.7 depends on this: it is the task that generates real `GeologicalContext`/regions for production cultures and needs `CulturePhase.geography.regions` to exist before it can populate it. 2GN.143 (provenance-formula spike) gets a soft link, since it measures directly against `bestRegionalLevel`, whose signature this task changes — not a hard blocker since 2GN.143 is unstarted design work, but re-measurement should happen in the right order. Recalibration risk noted in the spike: the `bestRegionalLevel` fix only changes behaviour once a culture-phase's `geography.regions` has more than one entry, which no shipped preset does yet, so `EXPECTED_MEAN_GRADE_BY_REGION` and other calibration pins are not expected to move — confirm with `deno task test` before landing. Full reasoning: `docs/spikes/2GN.142-region-keyed-baselines.md`.", "assignee": "Jason Warren"}, {"id": "2GN.145", "description": "`engine/generation/grammar.ts` — `expandGrammar` consults `allowedMaterialTags` (2GN.10) when rolling join types and head placements, so it stops producing structure the wrapped-join and rigid-shaft plausibility rules reject on sight. 2GN.137 measured 13–43% of expansions discarded at Stage 5 depending on the cell, dominated by those two rules; the rules are correct and the grammar is uninformed. Rule where in the draw sequence the constraint is read (a filter on the attachment option set before `selectGrammarOption`, so the draw count is unchanged, versus a re-roll, which is not), and re-record every calibration pin, since any change here moves `expandGrammar`'s draw sequence for every artefact", "status": "todo", "dependsOn": ["2GN.137", "2GN.10"], "milestone": "M2", "notes": "Filed 2026-08-25 from the 2GN.137 spike. ⚠️ calibration-shifting: `EXPECTED_FIRE_RATES`, `EXPECTED_TAG_SHARES` and the plausibility calibration guard all re-record. Not a blocker for 2GN.16 — the cap was ruled with headroom for today's rate — but landing it makes N=20 conservative rather than load-bearing.", "assignee": "Jason Warren"}, {"id": "3WS.1", "description": "`engine/world/seed.ts` — `createWorldSeed(raw: string): WorldSeed` — seed string → PRNG", "status": "blocked", "dependsOn": ["2GN.56", "M2"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.2", "description": "`engine/world/chronology.ts` — `generateChronology(seed, prng): WorldChronology` — startYear, endYear, presentYear, culture-relative periodisation (no shared timeline)", "status": "blocked", "dependsOn": ["3WS.1"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.3", "description": "`engine/world/culture.ts` — `generateCultures(prng, count): Culture[]` — culture generation with `CulturalProfile` (materialAffinities, motifVocabulary, craftInvestment)", "status": "blocked", "dependsOn": ["3WS.2", "2GN.110", "2GN.123", "2GN.126"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.4", "description": "`engine/world/culture.ts` — `generatePhases(culture, prng): CulturePhase[]` — 3-4 phases per culture with `PhaseCharacteristics` (technology, economy, society, aesthetics)", "status": "blocked", "dependsOn": ["3WS.3"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.5", "description": "`engine/world/culture.ts` — `generateRelationships(cultures, prng): CultureRelationship[]` — temporal relationship phases with trade, conflict, cultural exchange, politics", "status": "blocked", "dependsOn": ["3WS.3"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.6", "description": "`engine/world/culture.ts` — `MaterialFlow` generation within relationships (tag, materials, direction, volume)", "status": "blocked", "dependsOn": ["3WS.5", "2GN.126"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.7", "description": "`engine/world/seed.ts` — geological context generation: `GeologicalContext` with material availability per region, `AvailabilityLevel` per material", "status": "blocked", "dependsOn": ["3WS.1", "2GN.126", "2GN.144"], "milestone": "M3", "notes": "Inherits the region-vocabulary decision dependency sweep 2026-07-25 deferred here: decide whether regions become first-class (`Culture` gains a region binding, ⚠️ breaking) or stay convention-agreed strings, and reconcile the provisional region strings 2GN.26 and 2GN.47 already mint against mock fixtures. That decision is now ruled by 2GN.142 (2026-08-24), with implementation filed as 2GN.144 (2026-08-25): region is world-level, referenced by `CulturePhase.geography.regions: string[]` — this task generates the real `GeologicalContext`/regions for production cultures and needs that field to exist before it can populate it.", "assignee": "Jason Warren"}, {"id": "3WS.8", "description": "`engine/world/culture.ts` — motif vocabulary generation per culture (distinctive sets for cultural fingerprinting)", "status": "blocked", "dependsOn": ["3WS.3"], "milestone": "M3", "notes": "Generated vocabularies must be non-empty: doc 05 §8.5 treats motifs as the primary cultural fingerprint and doc 06's decorative-mismatch strain assumes motif attribution works for every culture; `assignDecorativeDetails` (2GN.33) deliberately degrades gracefully on an empty vocabulary rather than enforcing this, so enforcement lives here (recorded 2026-07-25).", "assignee": "Jason Warren"}, {"id": "3WS.9", "description": "`engine/world/seed.ts` — `createWorld(seed: string): WorldState` — full orchestrator: chronology + cultures + geology + relationships", "status": "blocked", "dependsOn": ["3WS.4", "3WS.7", "3WS.5"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.10", "description": "`src/lib/stores/worldState.svelte.ts` — reactive wrapper: chronology, artefacts, sites, scholars, documents, lineage graph, venues, career events", "status": "blocked", "dependsOn": ["3WS.9"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.11", "description": "`src/lib/stores/playerInterpretation.svelte.ts` — reactive wrapper around player's `InterpretiveModel` with immutable update methods (placeholder)", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.12", "description": "`src/lib/stores/lensState.svelte.ts` — lens state store (placeholder, computed later)", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.13", "description": "`src/lib/stores/ui.svelte.ts` — UI state: selected artefact, active panel", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.14", "description": "`src/lib/stores/gameState.svelte.ts` — orchestrator: imports all stores, provides `initialise(seed)`, `surfaceArtefact()`, `refreshLens()`, cross-store coordination", "status": "blocked", "dependsOn": ["3WS.12", "3WS.11", "3WS.13"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.15", "description": "`engine/generation/pipeline.ts` — replace mock culture profiles with real `WorldState` data throughout", "status": "blocked", "dependsOn": ["3WS.14"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.16", "description": "End-to-end determinism verification: same seed + same position → identical artefacts", "status": "blocked", "dependsOn": ["3WS.15"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.17", "description": "Explorer: chronology timeline with period boundaries", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.18", "description": "Explorer: culture profiles with bias summaries", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.19", "description": "Explorer: culture relationship graph visualisation", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.20", "description": "Explorer: store inspector panel — live view of `worldState`, `playerInterpretation` contents (`termState` added at 9CR.21)", "status": "blocked", "dependsOn": ["3WS.14", "3WS.19", "3WS.18", "3WS.17"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.21", "description": "`engine/world/culture.ts` — phase-attribute continuity: `generatePhases` must evolve `PhaseCharacteristics` continuously between adjacent phases, with bounded per-phase change and sharp breaks as deliberate rare events rather than the default", "status": "blocked", "dependsOn": ["3WS.4"], "milestone": "M3", "notes": "Surfaced 2026-08-04 by the 2GN.80/2GN.77 ruling (doc 11 §2.9, doc 12 §2.28), which records status-tag drift per culture-phase against the immediately preceding phase. That measure is only meaningful if phases evolve continuously, and nothing enforces it: `CulturePhase.characteristics` is a free `PhaseCharacteristics` per phase, and doc 05's five coherence rules are all within-artefact (structural, geological, decorative), none temporal. As specified, a culture could oscillate `decorativeEmphasis` 0.1 → 1.0 → 0.1 across three phases unchallenged, and drift measured across those phases would report noise. Recorded by the decision that depends on it rather than discovered later.", "assignee": "Jason Warren"}, {"id": "2GN.96", "description": "baselines cached on real `WorldState`; drift-vs-preceding-phase; `PhaseCharacteristics.society.stratification` as a live classification input", "status": "blocked", "dependsOn": ["2GN.95", "3WS.4", "3WS.9", "3WS.21"], "milestone": "M3", "notes": "Split out of 2GN.95's scope 2026-08-05: doc 11 §2.9 says baselines are \"cached in world state\", but `WorldState` does not exist (`types/save.ts` — lands at 3WS.9). Drift-vs-preceding-phase needs a real multi-phase timeline; every fixture today is single-phase, and 3WS.21 (phase-attribute continuity) is doc 11 §2.9's own named prerequisite for that measurement to mean anything rather than measure noise across incoherent phases. `stratification` is ruled a live input gating how much `elite` can exist at all, independent of any one distribution — deliberately absent from `ClassificationContext` until this task, since declaring it unread would be a lie the type tells. Moved from M2 to M3 2026-08-05: its dependencies (3WS.4/3WS.9/3WS.21) are all M3 tasks, and M3's own entry point (3WS.1) gates on the whole of M2 completing — an M2 task cannot depend on M3 work without a cycle.", "assignee": ""}, {"id": "2GN.121", "description": "`engine/generation/grammar.ts` + `data/grammars/primitives.ts` — weight the `base` parameter roll per culture rather than rolling uniformly over a shared vocabulary. 2GN.118 ruled (2026-08-13) that `cylindrical` and `hollow-enclosed` both roll the full `['flat','rounded','pointed','pedestal']` union, with the extractor's primitive-type branch in `classification.ts` kept as a marked seam rather than collapsed, precisely so per-primitive divergence can return as **weights** once something rules what drives them. The uniform roll is the placeholder: a pedestalled cylinder is now reachable but exactly as likely as a flat one, in every culture, which is the same absolute-table defect as 2GN.86/87/108/120 in a different guise. `aesthetics.formConservatism` (`types/world.ts`) is already specified as narrowing grammar branch variance and is unread by `expandGrammar` today; `society.stratification` is the plausible driver for pedestal frequency, a display foot being a stratification signal. Rule the input set and the weighting shape, then thread it through `expandGrammar`'s determinism-critical draw sequence. ⚠️ moves `base-pedestal-display` and `base-pointed-amphora` fire rates, so `EXPECTED_FIRE_RATES` needs re-recording with the drift annotated", "status": "blocked", "dependsOn": ["2GN.118", "3WS.4", "3WS.9"], "milestone": "M3", "notes": "Filed 2026-08-13 from the 2GN.118 spike session, case (a) `base`. The spike measured that `cylindrical` rolled `['flat','rounded','pointed']` and `hollow-enclosed` rolled `['flat','rounded','pedestal']`, making a pedestalled cylinder and a pointed vessel unreachable by primitive type rather than by design — and, because `dominantContainer` (`engine/generation/classification.ts`) always prefers `hollow-enclosed` over `cylindrical`, `base-pointed-amphora` could only ever fire on cylinder-dominant artefacts (sockets, ferrules), never on anything amphora-shaped. Both exclusions were ruled authoring artefacts of writing the BNF primitive-by-primitive, not morphological modelling, and the vocabularies were unioned. `ExtractedFeatures.baseType` (`types/artefact.ts`) already typed the full union plus `none`, which is the type layer conceding the two lists are one property. Jason ruled the extractor's primitive-type branch stays in place as a marked seam rather than collapsing to a single `bandProp` call, on the grounds that the codebase trends toward greater granularity and per-culture divergence is wanted: the branch cannot express a frequency difference (only impossible vs equally-likely), so the divergence has to return as weights, and this task owns that. Placed in M3 rather than M2 on the 2GN.96 precedent — a generation task parked with the world-state data it reads. Depends on 3WS.9 rather than 3WS.4 alone at Jason's direction: the weighting waits for the full `createWorld` orchestrator, not just `generatePhases`.", "assignee": "Jason Warren"}, {"id": "4UI.1", "description": "`components/study/ArtefactInspector.svelte` — main artefact display shell (replaces `ItemGenerator.svelte`)", "status": "blocked", "dependsOn": ["3WS.15", "M3"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.2", "description": "`components/study/PropertyList.svelte` — ordered list of artefact properties with register-specific descriptions", "status": "blocked", "dependsOn": ["4UI.1"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.3", "description": "`components/shared/TagBadge.svelte` — tag display badge component", "status": "blocked", "dependsOn": ["4UI.1"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.4", "description": "`components/shared/ConfidenceBadge.svelte` — confidence level badg
