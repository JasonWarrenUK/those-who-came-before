s` fields (materialId/precious-material signal, in the style of 2GN.17's 13-field addition), a new `materials`/`assignments` parameter on `extractFeatures`, and fixture updates (`neutralExtractedFeatures`/`mockExtractedFeatures`), on top of the rules themselves. Dependency sweep 2026-07-25 corrected the dependency to 2GN.75 (assignments, not just the single-component `assignMaterial`) and flagged the breaking scope the original line hid. Depends on 2GN.78: that task retires `precious-metal`/`precious-stone` as classification inputs entirely, so this task's \"precious metals → elite/ceremonial\" rule must derive standing from material situation (availability × affinity × provenance × stratification) rather than a static precious-tag lookup — without 2GN.78 sequenced first, this task could restore the static reading 2GN.77 ruled against.", "assignee": "Jason Warren"}, {"id": "2GN.36", "description": "`src/lib/data/descriptions/interpretive/` — interpretive register templates with function tag variants", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 199, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.37", "description": "`src/lib/data/descriptions/technical/` — technical register templates (craft-process, manufacturing)", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 199, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.68", "description": "`engine/generation/classification.ts` — update: decorative motif and introduced-material features contribute to unified tag accumulation (`motifCulturalOrigins` from `DecorativeLayer.motifRef`→culture lookup; `preciousMaterialsInDecoration` from the layer material's **situation in the producing culture**). ⚠️ **Rescoped 2026-08-11 by 2GN.78** (doc 11 §2.9, doc 12 §2.40): this line previously read \"`preciousMaterialsInDecoration` from `DecorativeLayer.material`→precious-material lookup\", which is exactly the static catalogue read 2GN.77 ruled against and which no longer has anything to look up — `MaterialTag`'s `precious-metal`/`precious-stone` members are retired. Populate the field from availability × cultural affinity × provenance instead: Doc 11 §2.9's formula has four terms sourced from three places: `explainMaterialWeight` (2GN.74) returns `level`, `culturalAffinity` and `tradeRescued` for a material/culture pair (availability and cultural affinity); provenance comes separately from `MaterialAssignment.provenance` via `deriveMaterialProvenance`, since `tradeRescued` is a reachability boolean rather than a provenance substitute; and stratification from `PhaseCharacteristics.society.stratification`, which §2.9 makes live and nothing reads yet. The threshold over them is this task's to rule and has not been set. Blocked on 2GN.110 because the affinity term's keyspace (per-tag only, or per-material too) changes what \"this culture prizes it\" can even mean", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 199, "isMilestoneSink": false, "notes": "**Note from 2GN.84 (doc 12 §2.34, 2026-08-06):** confirmed `assignDecorativeDetails` (`engine/generation/decoration.ts`) has no production caller anywhere in `src/` — only its own tests reach it. This task needs that wired into the pipeline before `DecorativeLayer.material` is ever populated outside tests, which is the direct upstream reason `preciousMaterialsInDecoration` is hardcoded `false` in `extractFeatures`.", "assignee": "Jason Warren"}, {"id": "2GN.66", "description": "`src/lib/data/names/` — naming grammars for sites, cultures, scholars (doc 08 `data/names/`)", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 3, "transitiveUnblocks": 190, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.118", "description": "design spike — are the primitive grammar's categorical parameter value-sets rational and justified? `PRIMITIVE_PARAMETERS` (`data/grammars/primitives.ts`) reproduces doc 05 §5.3 verbatim, so this audits the spec's own vocabularies rather than any code drift. Surfaced by 2GN.97 2026-08-13 while stress-testing whether `baseType` is a genuine categorical: it is, but the value-sets around it are not obviously deliberate. Three measured instances, all of the same shape — two primitives expressing the same concept with disjoint vocabularies, so a value is unreachable by primitive type rather than by design. (a) `base`: `cylindrical` rolls `['flat','rounded','pointed']`, `hollow-enclosed` rolls `['flat','rounded','pedestal']`, making a pedestalled bowl and a pointed cylinder both unreachable — and capping `base-pedestal-display`'s population at hollow-enclosed containers. (b) `opening`: `cylindrical` rolls `['open','restricted','closed']` while `hollow-enclosed` rolls `['wide','narrow','slit','none']` — different vocabularies AND different arities for one concept, leaving `slit` (read by `container-slit-votive`) unreachable on cylinders. (c) `perforation`: `flat-broad` rolls `['none','single','multiple']`, `disc-form` rolls `['none','central','off-centre']` — disjoint, so `perforation-central-rotation` can only ever fire on discs and `perforation-single-pendant` only on flat-broads. Rule for each parameter whether the split is deliberate morphological modelling or an artefact of authoring the BNF primitive-by-primitive; where deliberate, record why; where not, rule the corrected vocabulary. Same shape as 2GN.87's reachability finding, applied to the grammar's inputs rather than a rule's condition", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 5, "transitiveUnblocks": 185, "isMilestoneSink": false, "notes": "Filed 2026-08-13 from the 2GN.97 spike session, which reached it by stress-testing whether `baseType` is a genuine categorical (it is — unlike `wallThickness`, there is no crushed continuous quantity beneath it). The audit question is one level up: whether the value-sets themselves were designed or accreted. ⚠️ Ruling here may change which values exist, so anything authoring rules against them or deriving from them waits: 2GN.10 (`allowedMaterialTags` from primitive type + properties), 2GN.21 (`physicalLabel` from these observable values), 2GN.109 (replacement edge-family rule) and 2GN.117 (re-bands `bladeLengthBand` off `elongated.length`). 2GN.97 is NOT a dependent — it surfaced the defect rather than consuming the vocabulary.", "assignee": "Jason Warren"}, {"id": "2GN.116", "description": "design spike — should component roles (grip-system, head-system and whatever else the vocabulary needs) become first-class grammar output? All three rules in `data/plausibility.ts` are explicitly proxies standing in for an absent role concept: `hasGrippableSecondComponent` merely counts components, `hasAdequateGripLength` looks for some other medium/long `bar-form` or `elongated` component anywhere on the artefact (its own comment conceding a `disc-form` elsewhere \"says nothing about grip length\"), and `hasRigidShaft` accepts any rigid `sheet-form`/`bar-form` regardless of whether it bears the load. `types/plausibility.ts` names the same hole: the model cannot express a property-level concept like \"a grippable component\". Rule whether roles are authored into the grammar, derived from the attachment graph, or left as proxies for MVP — and if authored, what the role vocabulary is and what it costs across the primitive registry", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 3, "transitiveUnblocks": 180, "isMilestoneSink": false, "notes": "Filed 2026-08-13 from the 2GN.108 spike session. Scoped deliberately narrow: 2GN.108 established that grip-to-edge span is derivable from existing structure (`attachments` graph + `position` + per-component extents) without any role vocabulary, so roles are NOT a prerequisite for oriented normalisation or for a proportional `bladeLengthBand`. What roles would serve is the remaining proxy work in 2GN.13 and 2GN.14, which is why both now depend on this. Note that the `'grip-system'`/`'head-system'` strings in `types/interpretation.ts` are JSDoc illustration, not a defined type, and doc 05's `arrangementGroup` is repetition structure (symmetric/radial/linear-array), unrelated to role — so this vocabulary would be genuinely new rather than a specified-but-unwired concept.", "assignee": "Jason Warren"}, {"id": "2GN.16", "description": "`engine/generation/plausibility.ts` — re-expansion loop: on failure, re-expand from grammar up to N attempts", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 180, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.115", "description": "design spike — what defines an artefact's working end in general, for artefacts with no edge? 2GN.108 ruled that normalisation must orient the artefact (working end at a shared pole across all artefacts sharing a dimensional axis) and that orientation is achieved by reversal rather than rejection, but ruled the general pole definition out of its own scope. For edged forms the working end is the edge; for a hafted head it is the head; for a vessel, disc, ring or pin there may be no functional pole at all. Rule whether orientation is total (every artefact oriented, which needs a pole rule for shapes that have no working end) or partial by design (only artefacts with a distinguishable functional pole are oriented, the rest left unoriented as `bladeLengthBand` already reports `'none'` for edgeless forms). ⚠️ this blocks implementation rather than 2GN.108's ruling: reversal cannot be implemented for edged forms and retrofitted to a different general convention without repeating the recalibration sweep", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 179, "isMilestoneSink": false, "notes": "Split out of 2GN.108 during the 2026-08-13 spike session. 2GN.108 established that `position` is intended as an oriented shared axis but is minted in `grammar.ts` as a depth-first traversal index (primary-before-attachments), so the invariant is unenforced — a blade can land at position 0 with its haft after it, and nothing rejects or reverses it. The three existing plausibility proxies (`hasGrippableSecondComponent`, `hasAdequateGripLength`, `hasRigidShaft`) each guess around this absence. Reversal was chosen over rejection because a mirrored artefact carries no information (it is the same artefact described backwards), so rejecting it spends re-expansion budget to enforce something probabilistically rather than by construction — but reversal only works if orientation is definable wherever it is applied, which is this spike's question.", "assignee": "Jason Warren"}, {"id": "2GN.31", "description": "`engine/generation/decoration.ts` — layering support: `DecorativeLayer` with sublayers, decoration-on-decoration", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 179, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.32", "description": "`engine/generation/decoration.ts` — recursion depth cap from `craftSpecialisation` × `aesthetics.decorativeEmphasis`", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 179, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.69", "description": "`engine/generation/grammar.ts` — deliberately model multi-part assemblages: distinguish an intentional co-deposited group (hoard, burial set) from an unattached stray component, since `\u003cobject\u003e ::= \u003ccomponent-group\u003e+` currently lets `expandGrammar` roll multiple independent groups with no signal for whether that's a designed assemblage or an accidental artefact of complexity-budget rolls", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 179, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.72", "description": "`engine/generation/classification.ts` — per-component feature provenance: record which component each collapsed `ExtractedFeatures` field was derived from (doc 12 §2.20 defers this explicitly — the collapse policies are documented but carry no references), so a feature can be traced to its source without re-implementing the dominance rules outside the engine. Prerequisite for attributing classification evidence to components rather than only to rules", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 179, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.105", "description": "`engine/generation/materials.ts` + `types/artefact.ts` + `data/materials.ts` — apply 2GN.111's ruling to the property model: give `rigidity` per-state values (`{worked, finished}`), re-author `fragility` and `hardness` to the **working** state across all 16 materials (they feed `computeLayerGrade` and nothing else, so the current finished-state authoring is wrong — glass `fragility: 7` cold while decorated hot, fired clay `6` fired while decorated wet), and document the pinned state on `formability` (working) and the state-independence of `grainFineness`, `porosity` and `combustibility`. ⚠️ re-authoring `fragility`/`hardness` shifts `meanDecorativeGrade` for glass and fired clay, so the 2GN.79 calibration guard will flag it and `EXPECTED_FIRE_RATES` needs re-recording with the drift annotated", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "Rescoped 2026-08-13 by the 2GN.111 ruling. Was filed presupposing per-state values on every axis ('at minimum worked vs finished'); the spike measured that exactly one axis needs them, so this task now audits a specific list rather than performing a general reconciliation. Surfaced 2026-08-11 during 2GN.102 (doc 12 §2.38). Adding `formability` forced the discovery that its six siblings were authored against the finished object, without the question ever being asked or stated: `glass` (`fragility: 7`) reads cold glass, though hot glass (what `formability` reads) is viscous and freely formable; `iron`'s `hardness`/`rigidity` describe cold-worked iron, not the material as forged hot; `fired-clay`'s `fragility: 6` reads the fired result, though the working state is wet clay; `leather`'s `rigidity: 2` reads cured hide, though wet-moulded cuir bouilli holds a raised form. Only `fired-clay`'s data-file comment ever named this choice, as a one-off aside rather than a stated convention. Not a 2GN.102 workaround to clear — `relief`'s leather exclusion was already corrected on its cured-state merits in that task — this is the general problem of a single finished-state number standing in for a material whose worked properties differ.", "assignee": "Jason Warren"}, {"id": "2GN.106", "description": "`data/decorations.ts` + `engine/generation/decoration.ts` — add `formability` to `MaterialDifficultyAxis`, an `AXIS_NORMALISATION` entry, and per-technique `TECHNIQUE_MATERIAL_SENSITIVITY` weights, with re-measured grade distributions and 2GN.103's regional pins re-verified", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "Filed 2026-08-11 alongside 2GN.102 (doc 12 §2.38). Must first revisit the rung-5 casting/forging conflation recorded in that entry: `formability`'s rung 5 deliberately groups cast metals (bronze/gold/silver) with hot-forged iron as one plastic-working-regime rung — a simplification that is inert while `relief`'s gate is a `\u003e= 3` threshold (rungs 3–6 pass identically) but becomes load-bearing the moment this task reads the rungs as a difficulty gradient rather than a threshold. Note the `1`–`6` range differs from the other five difficulty axes' `1`–`7`, so `AXIS_NORMALISATION`'s `mid`/`half` need their own values, not a copy of a sibling's.", "assignee": "Jason Warren"}, {"id": "2GN.107", "description": "`data/decorations.ts` — sweep every `kind: 'material'` substrate test for exclusions that are artefacts of a proxy axis rather than attested practice, the way `relief`'s leather exclusion was", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "Filed 2026-08-11 during 2GN.102 (doc 12 §2.38). `relief` excluded leather solely as collateral from `rigidity \u003e= 3`, a test aimed at linen, with no material-science basis — corrected in 2GN.102 once `formability` gave the gate something honest to key on. `overlay` uses the identical `rigidity \u003e= 3` test `relief` used to carry; if `formability` is the correct gate for one, `overlay` is the first candidate for the same scrutiny. `studs`/`gilding` already carry a named leather exception and are not suspect on the same grounds.", "assignee": "Jason Warren"}, {"id": "2GN.114", "description": "`tests/fixtures/culture.ts` — extend `mockCulturalProfile`/`mockPhaseCharacteristics` with a high-craft/elite preset (`craftSpecialisation`, `decorativeEmphasis`, `motifComplexity` pushed toward 1.0), so elite/ceremonial-grade artefacts are reachable through ordinary sampling and Explorer calibration runs rather than only via hand-built overrides", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "Filed from a real-world-find coverage spike (2026-08-13): ran the full M2 chain (expandGrammar → normaliseArtefact → expandDecoration → assignMaterials → gradeDecorativeLayers → extractFeatures → classifyArtefact) against 18 common real-world archaeological find types across 3000 sampled artefacts (6 mock regions × 500). Coverage (18/18) and frequency ordering (dominant \u003e common \u003e occasional \u003e rare, unranked) both held with no tuning aimed at the outcome. The one gap: `meanDecorativeGrade` capped at ~0.494 across every region under the flat-neutral-0.5 `mockPhaseCharacteristics`/`mockCulturalProfile` fixtures, making elite/ceremonial signatures (gold-lunula-style ornament, ceremonial mace-head) invisible to any default-fixture test or Explorer run — confirmed reachable (70/1000 and 392/1000 respectively) only after hand-pushing `craftSpecialisation`/`decorativeEmphasis`/`motifComplexity` to 1.0 for the spike. Not a pipeline defect; a fixture coverage gap with no reusable preset today.", "assignee": "Jason Warren"}, {"id": "2GN.119", "description": "design spike — should classification conditions read *relations between components* rather than isolated component properties? Measured 2026-08-13 over all 43 shipped rules during 2GN.97: **10 of the 24 unmigrated rules condition on exactly one property** (`f.x === 'value'` and nothing else) — `base-pedestal-display`, `base-pointed-amphora`, the three `perforation-*` rules, both `ring-*` rules, both `sheet-*` rules and `size-small-personal`. A further 7 read two properties that both describe the *same* component (the container rules pair `hasContainer`, a presence flag, with a feature extracted off the dominant container). Exactly one rule is genuinely relational (`motif-multiple-origins`, comparing origins across the artefact's decoration). A base is a relationship between the base and what it supports: a pedestal under a statue and a pedestal under a hat-stand carry opposite readings, identical `baseType`, and no amount of culture-relativity separates them because the difference is not cultural. The rule reads one term of a two-term relation and discards the term carrying the meaning — doc 02 Simulation Honesty. ⚠️ This is orthogonal to doc 11 §2.9's absolute/relative cut: `perforation-central-rotation` awards `tool` (an AbsoluteTag) and is under-conditioned identically, so the defect is a property of how conditions are written, not of which vocabulary they award from. `NormalisedArtefact.attachments` and `NormalisedComponent.position` are populated and unread by every rule — the same unused-graph finding as 2GN.108. Rule whether conditions gain access to component relations, what that does to `ClassificationRule.condition`'s signature (already widened once by 2GN.80), and which rules are rewritten versus left as affordance readings", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "Filed 2026-08-13 from the 2GN.97 spike session. Scope is **all 43 rules**, not the 24 unmigrated ones: the measurement that produced it covered the 24, but the defect cuts across the absolute/relative boundary, so scoping to relative-award rules would audit the wrong set. Supersedes the framing 2GN.97 inherited — those rules are not unmigrated-but-fine awaiting a baseline, a class of them is under-conditioned, and no baseline of any kind fixes an under-conditioned rule. Absorbs the ambiguity originally filed as a competing-readings question (a central perforation reads spindle-whorl or pendant depending on the disc's size, mass and what it attaches to — the ambiguity IS the missing relational term). ⚠️ Interacts with 2GN.118: that audits which parameter *values* exist, this audits what a condition may *read*. Independent questions on the same surface; neither blocks the other.", "assignee": "Jason Warren"}, {"id": "2GN.120", "description": "`engine/generation/grammar.ts` — derive `wallThickness` as a modelled quantity rather than a free three-value roll. Today `PRIMITIVE_PARAMETERS` rolls `wall: ['thin','medium','thick']` directly, with no continuous value beneath and no input from craft process, material or vessel role. Three consequences ruled in 2GN.97 (2026-08-13): (a) thickness is plausibly a *derivative of the crafting process* and is currently uninfluenced by `craftSpecialisation`, the component's assigned material or what the vessel is for; (b) three rungs is the entire gradation available, too coarse for the distinctions the classification rules try to draw on it; (c) **cross-culture comparison is impossible by construction** — one culture's `thick` may be physically thinner than another's `thin`, and since the band is cut from a global table before anything culture-relative is consulted, no baseline can recover the difference. Fourth instance of the band-computed-from-an-absolute-table family after 2GN.86 (mass), 2GN.87 (blade) and 2GN.108 (axis). Deliverable: a derived thickness quantity with its inputs ruled, and bands cut per-culture rather than globally", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "Filed 2026-08-13 by the 2GN.97 ruling, which found `vessel-thin-walled-fine-ware` and `vessel-thick-walled-utilitarian` unrelativisable: no baseline of any kind — prevalence, stratification or weight-scaling — can relativise a three-value label rolled from a global table, because there is no quantity for a culture to have opinions about. Prevalence in particular cannot work here (unlike `baseType`, where it can): band frequency says nothing about actual thickness, so a culture whose walls are all 3mm and one whose walls are all 30mm both read '100% thin' or '100% thick' depending only on where the global cut falls. ⚠️ The two wall rules stay as they are until this lands — they were left absolute rather than migrated or deleted, recorded as blocked-with-reason. ⚠️ Overlaps 2GN.118, which audits whether the `wall` vocabulary is justified at all; if that spike rules the three-value set out, this task's shape changes with it.", "assignee": "Jason Warren"}, {"id": "2GN.67", "description": "`engine/generation/grammar.ts` — arrangement detection + pattern assignment: annotate `NormalisedComponent.arrangementGroup` (pattern, index, totalInGroup) at flatten time, descoped out of 2GN.8 since the grammar never assigns an arrangement pattern (2GN.3 rolls repetition incidentally, 2GN.6's `checkAccumulation` only validates admissibility, never labels one), so `arrangementGroup.pattern` has no faithful source at flatten time and fabricating one would invent data; detection reuses `tallyArrangements`' same-primitiveType-within-one-top-level-group boundary (already the detection contract behind 2GN.6, cheap to apply again here), leaving pattern *assignment* as the open question this task owns — may mean threading a choice through `expandGrammar`'s determinism-critical draw sequence; nothing consumes the field yet, so this task is currently childless in the graph", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.76", "description": "`engine/generation/decoration.ts` — motif salience fluctuates across a culture's lifespan: native and borrowed motifs are not equally prominent at every point in the culture's timeline; motif selection weights vary by phase", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "Added 2026-07-25 during the 2GN.33 design interview: `assignDecorativeDetails` weights native motifs at 1 and borrowed motifs by exchange intensity, with no temporal variation — this task adds the phase-driven salience dimension.", "assignee": ""}, {"id": "2GN.92", "description": "Doc 05 §13.1 + doc 12 propagation entry — record the `VariantCondition` shape change and the selection-order contract (condition filters the candidate set, then emphasis selects within it)", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "Docs task pairing 2GN.91's type change. Doc 05 §13.1 currently publishes `DescriptionTemplate`/`DescriptionVariant` without a condition field; update the quoted interface and prose to match. Doc 12 gets a numbered propagation entry (next after §2.29) recording the change and its origin, matching the convention §2.28/§2.29 set for the `AbsoluteTag`/`RelativeTag` split.", "assignee": "Jason Warren"}, {"id": "2GN.93", "description": "`engine/generation/description.ts` — variant selection honours `condition`: filter candidates by the component's assigned material (via the `componentId → MaterialAssignment → MaterialDefinition` join) before emphasis-based selection", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 178, "isMilestoneSink": true, "notes": "Nothing currently does the material join at description time — `NormalisedComponent` carries only `allowedMaterialTags` (a constraint), the actual assignment lives on `ClassifiedArtefact.materials` as a side-table (`MaterialAssignment[]`, joined by `componentId`). ⚠️ Overlaps 2GN.38, which already owns `generateDescription`'s variant selection — resolve at pickup whether this is a distinct task or 2GN.38's description should instead be amended to state selection honours `condition`. Flagged unresolved at authoring time (2026-08-05); do not let both exist as separately-tracked selection logic.", "a <script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const DATA = JSON.parse(document.getElementById("roadmap-data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
	c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

document.getElementById("meta").textContent =
	`generated ${DATA.generated} · source .claude/roadmaps.json`;

/* Validation banner (empty when clean) */
if (DATA.validation && DATA.validation.length) {
	document.getElementById("validation").innerHTML =
		`<div class="validation"><strong>${DATA.validation.length} validation ` +
		`discrepancy(ies)</strong> — the numbers below reflect the file as-is.` +
		`<ul>${DATA.validation.map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>`;
}

/* Section 1 — Overview */
const st = DATA.stats;
document.getElementById("hero").innerHTML =
	`${st.byStatus.done}/${st.total} tasks<small>${st.donePct}% complete</small>`;

const health = m => {
	const s = m.byStatus;
	if (m.donePct === 100) return "done";
	if (s.todo > 0) return "todo";
	if (s.blocked > 0) return "blocked";
	if (s.paused > 0) return "paused";
	if (s.deferred > 0) return "deferred";
	return "done";
};
document.getElementById("milestone-cards").innerHTML = st.milestones.map(m => `
	<div class="card mini">
		<h3>${esc(m.id)}: ${esc(m.name)}</h3>
		<span class="count">${m.done}/${m.total} done · ${m.donePct}%</span>
		<div class="progress-bar"><div class="progress-fill"
			style="width:${m.donePct}%;background:var(--color-${health(m)})"></div></div>
	</div>`).join("");

/* Section 2 — Milestones. Groups lead with actionable work. */
const GROUPS = [
	["todo",        "○ To Do",        "todo"],
	["blocked",     "✗ Blocked",      "blocked"],
	["paused",      "⏸ Paused",       "paused"],
	["deferred",    "⤓ Deferred",     "deferred"],
	["done",        "✓ Done",         "done"],
	["out_of_scope","⊘ Out of Scope", "out-of-scope"],
];
const readyIds = new Set(DATA.ready.candidates.map(c => c.id));
const tasksByMilestone = {};
for (const t of DATA.tasks) (tasksByMilestone[t.milestone] ??= []).push(t);

document.getElementById("milestone-details").innerHTML = st.milestones.map((m, i) => {
	const tasks = tasksByMilestone[m.id] || [];
	const groups = GROUPS.map(([status, label, varName]) => {
		const members = tasks.filter(t => t.status === status);
		if (!members.length) return "";
		const items = members.map(t => {
			const dep = (t.dependsOn && t.dependsOn.length)
				? `<span class="depnote">depends on ${esc(t.dependsOn.join(", "))}</span>` : "";
			const who = t.assignee ? `<span class="pill">${esc(t.assignee)}</span>` : "";
			return `<li class="${status === "out_of_scope" ? "oos" : ""}"
				style="--g-colour:var(--color-${varName})">
				<span class="tid">${esc(t.id)}</span>${esc(t.description)} ${dep}${who}</li>`;
		}).join("");
		return `<div class="group" style="--g-colour:var(--color-${varName})">
			<h4 style="color:var(--color-${varName})">${label}</h4><ul>${items}</ul></div>`;
	}).join("");
	const open = tasks.some(t => readyIds.has(t.id)) || i === 0 ? " open" : "";
	return `<details class="milestone"${open}>
		<summary><span class="mid">${esc(m.id)}</span>${esc(m.name)}
			<span class="count">${m.done}/${m.total}</span></summary>
		<div class="body">${groups || "<p class='depnote'>No tasks.</p>"}</div>
	</details>`;
}).join("");

/* Section 3 — Dependency graph */
/* ELK lays out this dense a graph with far fewer crossings than the default
   dagre engine; if its module fails to load, dagre still renders. */
let layout = "dagre";
try {
	const elkLayouts = (await import("https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs")).default;
	mermaid.registerLayoutLoaders(elkLayouts);
	layout = "elk";
} catch { /* CDN unreachable — fall back */ }
mermaid.initialize({
	startOnLoad: false,
	theme: "base",
	layout,
	themeVariables: {
		fontSize: "16px",
		fontFamily: '"IBM Plex Mono", monospace',
	},
});
/* Mermaid 11's classDef parser rejects var(--x), so the semantic variables
   are resolved to concrete colours before rendering, and the graph re-renders
   when the colour scheme flips so it keeps tracking the page theme. A render
   failure is contained to the diagram shell — the sections after it must
   still populate. */
const wrap = document.getElementById("wrap");
const shell = document.getElementById("shell");
const diagram = document.getElementById("diagram");
let svgEl = null;
let scale = 1, tx = 0, ty = 0;
const apply = () => { if (svgEl) svgEl.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
const renderGraph = async () => {
	const rootStyle = getComputedStyle(document.documentElement);
	const src = DATA.mermaid.replace(/var\((--[\w-]+)\)/g,
		(_, name) => rootStyle.getPropertyValue(name).trim() || "#888888");
	try {
		const { svg } = await mermaid.render("roadmap-graph", src);
		diagram.innerHTML = svg;
	} catch (err) {
		document.getElementById("droadmap-graph")?.remove();
		diagram.innerHTML = `<p class="depnote">Dependency graph failed to render: ${esc(String(err))}</p>`;
		return;
	}
	svgEl = wrap.querySelector("svg");
	svgEl.addEventListener("dblclick", () => shell.classList.toggle("expanded"));
	apply();
};
await renderGraph();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderGraph);

/* Zoom/pan: buttons, ctrl+wheel, drag; expand toggles a fixed overlay */
const zoom = f => { scale = Math.min(4, Math.max(0.25, scale * f)); apply(); };
shell.querySelector(".diagram-toolbar").addEventListener("click", e => {
	const act = e.target.dataset.act;
	if (act === "in") zoom(1.25);
	else if (act === "out") zoom(0.8);
	else if (act === "reset") { scale = 1; tx = ty = 0; apply(); }
	else if (act === "expand") shell.classList.toggle("expanded");
});
wrap.addEventListener("wheel", e => {
	if (!e.ctrlKey && !e.metaKey) return;
	e.preventDefault();
	zoom(e.deltaY < 0 ? 1.1 : 0.9);
}, { passive: false });
let drag = null;
wrap.addEventListener("pointerdown", e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; wrap.setPointerCapture(e.pointerId); });
wrap.addEventListener("pointermove", e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
wrap.addEventListener("pointerup", () => { drag = null; });

/* Section 4 — Next Up (pre-vetted by roadmap.py ready) */
document.getElementById("ready").innerHTML = DATA.ready.candidates.length
	? DATA.ready.candidates.map(c => `
		<li style="--g-colour:var(--color-todo)">
			<span class="tid">${esc(c.id)}</span>${esc(c.description)}
			<span class="pill">${esc(c.milestone)}: ${esc(c.milestoneName)}</span>
			${c.assignee ? `<span class="pill">${esc(c.assignee)}</span>` : ""}
			<span class="signal">unblocks ${c.transitiveUnblocks}${c.isMilestoneSink ? " · completes milestone" : ""}</span>
		</li>`).join("")
	: "<li>No unblocked tasks — clear a blocker or a gate.</li>";

/* Nav highlight */
const links = [...document.querySelectorAll("nav a")];
const highlight = new IntersectionObserver(entries => {
	for (const en of entries) if (en.isIntersecting) {
		links.forEach(a => a.classList.toggle("active", a.hash === "#" + en.target.id));
	}
}, { rootMargin: "-30% 0px -60% 0px" });
links.forEach(a => highlight.observe(document.querySelector(a.hash)));
</script>
