faced 2GN.118 (are the primitive value-sets rational) while stress-testing `baseType`.", "assignee": ""}, {"id": "2GN.83", "description": "recalibrate `expandDecoration`'s fill constants per the 2GN.80 ruling", "status": "done", "dependsOn": ["2GN.80", "2GN.95"], "milestone": "M2", "notes": "Landed doc-only (2026-08-06, doc 12 §2.32) — the re-scope anticipated on pickup. No constant moved: recalibration presupposes a calibration target, and relativisation removed the old one (fire rate) without supplying a new one — a uniform volume change moves the sampled baseline and the measured artefacts together and largely self-cancels. The only stated target anywhere in the docs, doc 05 §8.3's four-corner craft/emphasis table, was measured directly and found unsound as a target, for two independent reasons: (1) its numbers cap recursion depth, which has no producer until 2GN.31 (`expandDecoration` emits flat layers, `sublayers: []` always) — read as the nearest measurable analogue, layers-per-component, today's output is 0.41/1.64/1.72/3.14 against the table's 0–1/0–1/~1/up-to-3; (2) the two middle corners are not jointly reachable by any function of `(craftSpecialisation, decorativeEmphasis)` — a joint sweep over `CRAFT_WEIGHT × BASE_FILL_PROBABILITY × SLOT_DECAY × MAX_SLOTS_PER_CATEGORY` floors residual error at ~0.83 and never approaches zero, because the `hi/lo` corner is dominated by `partCount` (~6 components at high craft vs ~2 at low), set upstream by `deriveComplexityBudget` in `grammar.ts` and multiplied against inside `expandDecoration`, not cancellable from within the module. §8.3's own wording confirms the diagnosis — it separates the middle corners by kind (\"technically refined\" vs \"simple techniques\"), which a volume scalar cannot express. One concrete implementation defect surfaced and is recorded, not fixed: `craftSpecialisation` enters decorative volume twice (once via the blend, once via `partCount`), a measured 3.2× gap (3.61 vs 11.50 mean layers) at identical intensity 0.55 — the fix depends on how doc 11 §1.5 rules. New open question raised at doc 11 §1.5 with four named candidate answers (volume is per-artefact; volume is per-component and §8.3 is wrong; split volume from refinement; defer to 2GN.31) and no recommendation between them. `appliedElementPresent` saturation (89–100% across measured cells) recorded as a separate, already-diagnosed finding (`classification.ts:403` already calls it structural) rather than pursued here. Split to **2GN.98**: rule doc 11 §1.5, then recalibrate against whatever it decides.", "assignee": "Jason Warren"}, {"id": "2GN.98", "description": "design spike — rule doc 11 §1.5's decorative-volume question, then recalibrate `expandDecoration`'s fill constants against it", "status": "done", "dependsOn": ["2GN.83"], "milestone": "M2", "notes": "Ruled 2026-08-06 (doc 11 §2.10, doc 12 §2.33): `decorationVolume` reads `aesthetics.decorativeEmphasis` alone; a new `DecorativeLayer.grade` field reads `society.craftSpecialisation` scaled by a new authored `TECHNIQUE_DIFFICULTY` rating (`data/decorations.ts`, 16 values reviewed per-item). Two cheaper shapes were tried and rejected first: biasing `computeTechniqueWeight`'s selection toward low-difficulty techniques at low craft (real and directional, ~30% vs ~15-19% low-difficulty share, but capped — the function's other three factors dominate selection); `grade = craftSpecialisation` alone (cleanly orthogonal to volume but degenerate as a sampled feature — every layer on every artefact from one culture-phase got the identical value, so a percentile ladder over it never varies within a cell). The shipped formula (`craft * (1 - 0.5*difficulty) + 0.5*difficulty*craft²`) produces genuine within-cell spread instead, making `meanDecorativeGrade` a legitimate `BaselineFeature`. Doc 05 §8.3's four corners now land at 0.41-0.46/0.46-0.54/2.7-3.3/2.8-3.3 layers/component against the stated 0-1/0-1/~1/up-to-3 — a substantial improvement on the pre-2GN.98 blend's 0.42/1.65/1.65/3.16, where the two middle corners were indistinguishable. `BASE_FILL_PROBABILITY`/`SLOT_DECAY`/`MAX_SLOTS_PER_CATEGORY` left unchanged; the corners land acceptably without retuning them. The recorded `craftSpecialisation` double-count (2GN.83) is resolved by re-scoping, not patching: craft now has exactly two decorative-adjacent effects (`partCount`, unchanged; `grade`, new) rather than one effect counted twice. `appliedElementPresent` saturation confirmed unaffected (86.7% vs the prior 89.1%, within noise) — structural, per `MAX_SLOTS_PER_CATEGORY`, as diagnosed at 2GN.79/2GN.83. New classification rule (R44, `data/classification.ts`) reads `meanDecorativeGrade` at p90 (not p75 — measured 26.6%/12.3%, and p90 matches the rule's own 'exceptional' framing, same reasoning 2GN.82 used for the exceptional-lavishness and technique-breadth rules). `EXPECTED_THRESHOLDS`/`EXPECTED_FIRE_RATES`/`EXPECTED_GATED_RATES` re-measured and re-recorded in `calibration.test.ts` (R1-R28/R37-R39 bit-identical, the inertness checkpoint; R32 dropped 98.0%→89.2%, still exempt from `SATURATION_CEILING` by design); `statistics.regression.test.ts`'s p75 pin moved 10→12 and reframed against this task's own measurement rather than 2GN.34's superseded figure. `CLASSIFICATION_RULES.length` 43→44, relative/absolute split 34/43→35/44. Four new tests in `decoration.test.ts` (grade direction, gap-narrowing at high craft, [0,1] bounds, artefact-level monotonicity); textile-isolation and category-coverage tests verified unaffected. `deno task check` 0 errors, `deno test` 521/521 passing. Full detail: doc 12 §2.33.", "assignee": "Jason Warren"}, {"id": "2GN.84", "description": "recalibrate `SCARCITY_WEIGHT` and material weighting per the 2GN.80 / 2GN.77 rulings", "status": "done", "dependsOn": ["2GN.80", "2GN.77", "2GN.95"], "milestone": "M2", "notes": "Inverted 2026-08-06 (doc 12 §2.34): no calibration target existed (doc 05 §7 is qualitative only; §10.2 explicitly disclaims a quota reading), matching the trap 2GN.83 hit and flagged in this task's own notes. Delivered instead: `src/lib/data/materials.calibration.test.ts` (new) — a hierarchical per-region tag-share/intra-tag-split/provenance-mix/cross-region-spread guard derived from `MaterialDefinition.tags`, installing the missing target rather than recalibrating against an absent one, the same move 2GN.82/2GN.98 made for classification/decoration. `SCARCITY_WEIGHT`'s four values are UNCHANGED and now pinned as the measured baseline.\n\nTwo real defects found and fixed along the way: (1) `materialAccessGate` (`engine/generation/decoration.ts`) checked a technique's material *substrate* but not its *introduced* material — `wire-wrapping` (substrate: grippable form; introduces: metal) was never gated on metal availability, so a metal-free region (`forestInterior`) produced 26.3% wire-wrapping share (vs 5.8-6.1% elsewhere), more metal wirework than anywhere with metal. Fixed by extending the gate to also check `INTRODUCED_MATERIAL_TAGS` via `isAvailable` (availability only, not affinity). (2) `scarcityWeight`'s unmodelled-material lenience returned neutral `1`, ranking an unmodelled material above an explicitly `available` one (`0.6`) — same class of defect as doc 12 §2.25's silver/jade over-representation. Fixed to return the `available` rung instead.\n\nA full 16-entry catalogue audit (`data/materials.ts`) found and fixed one tag miss (`jade`: `['precious-stone']` → `['stone', 'precious-stone']`, matching gold/silver's dual-tag pattern) and one inert-material defect (`glass`: all three `decorability` flags were false; corrected to `engravable: true, paintable: true`, grounded in attested wheel-cut/diamond-point engraving and enamelled-glass practice; `glazeable` stays false as a ceramic-only process).\n\n`deno task check` 0 errors, `deno test` 527/527 passing. Full detail: doc 12 §2.34.\n\nExplicitly split out, not pursued here: `culturalAffinityWeight`'s max-across-tags semantics (Khaltiris authors `precious-metal: 1.4` on gold, silently dead since `metal: 1.7` wins the max — folded into 2GN.78's scope); material-dependent technique difficulty (new task 2GN.99); leatherworking/craft-domain taxonomy (new task 2GN.100); `assignDecorativeDetails` has no production caller (noted against 2GN.68).", "assignee": "Jason Warren"}, {"id": "2GN.99", "description": "recalibrate `computeLayerGrade` to read technique difficulty per-material, not technique alone", "status": "done", "dependsOn": ["2GN.98", "2GN.101"], "milestone": "M2", "notes": "Ruled and shipped 2026-08-07 (doc 12 §2.35). Blocked on a prerequisite that had to be built first: `physicalProperties` could not express material difficulty at all, so **2GN.101** rebuilt it (six orthogonal axes plus keyed `reactivity`) before this task could proceed.\n\n**Ships as an unwired post-pass, and that is the honest scope.** `computeLayerGrade` is called inside `expandDecoration`'s slot loop, where no component has an assigned material — assignments live in a parallel `MaterialAssignment[]` from `assignMaterials`, which no production caller runs first. Threading them in would force all six call sites to reorder, and `assignMaterials` consumes PRNG draws, so it would perturb the decoration draw sequence and move every recorded fire rate for reasons unrelated to grade. New `gradeDecorativeLayers` instead re-grades layers as a separate PRNG-free pass, mirroring `assignDecorativeDetails`' position. `expandDecoration` untouched; its grade is now documented as *provisional*. **Nothing in the sampled path changed at ship time, so no calibration pin moved then** — a stronger inertness checkpoint than 2GN.82/2GN.98's partial ones. That held only until the two remaining ungraded samplers (calibration.test.ts's measureFireRates, the Explorer's ruleCalibration.ts) were wired through the material-aware pass in a later review round: R44's pooled fire rate moved 4.0% → 10.4% once measured on the same scale as the baseline it is compared against (roadmap 2GN.103, doc 12 §2.36).\n\nFormula modulates *difficulty* (`TECHNIQUE_DIFFICULTY` baseline + weighted axis shifts, clamped) rather than the resulting grade: it keeps the [0,1] bound without clamping output, preserves the \"harder techniques degrade faster as craft falls\" curve, and makes the physical claim correctly — a difficult material makes a technique behave like a harder technique. New `TECHNIQUE_MATERIAL_SENSITIVITY` (16 techniques × up to 6 axes) authored technique-by-technique.\n\n**Weights scaled ×2.5 after measurement.** At the originally-authored ±0.15 band, engraving spanned only ~0.044 across all 16 materials against ~0.3 between easiest and hardest technique — material was a rounding error beside technique, with partially-cancelling weights collapsing the signal, and too little spread to keep `meanDecorativeGrade` a viable sampled feature (the exact degeneracy 2GN.98 rejected). Scaling preserved every relative judgement; only magnitude moved. Post-scaling spread: 0.10 (`overlay`/`inlay`) down to 0.02 (`scoring`), `tassels` zero by design.\n\nScaling exposed a clamping artefact — 22 of 256 pairs pushed difficulty below zero, claiming work was *perfectly* easy (craft irrelevant), and tying 7 techniques at the ceiling. `MINIMUM_DIFFICULTY = 0.05` fixes it; nothing pins at the ceiling now. Pinned by a test.\n\nKnown limitation, recorded not hidden: `wire-wrapping`/`wrapping`/`beading` score near-inert because their real difficulty comes from the *introduced* material (wire, cord, beads) and this model reads the *substrate*; `tassels` is flat zero because it introduces no material at all in the catalogue. Both split to successors. `deno task check` 0 errors, `deno test` 540/540.\n\n**Follow-on defect fixed in the same PR #53 review round, 2026-08-09:** the `oxidisation: -1` not-applicable sentinel reached `effectiveDifficulty`'s weighting unguarded, normalising to ≈-1.29 (outside the documented [-1,+1] band) and landing every inert material's `patina` grade below gold's — inverting the gate/difficulty distinction the sentinel exists to express. Fixed by skipping the axis when the sentinel is present, falling back to the bare technique baseline. Investigating its blast radius surfaced a wider, deliberately-unfixed-here defect: recorded against **2GN.30** (see that task's own notes).", "assignee": "Jason Warren"}, {"id": "2GN.100", "description": "add a distinct `leatherWorking` craft domain, separating hide-work from weaving", "status": "done", "dependsOn": [], "milestone": "M2", "notes": "Shipped 2026-08-07 (doc 12 §2.35). `leather` moves off `craftDomain: 'textiles'`, which it had been sharing with `linen`, conflating tanning with weaving under one technology axis. New `technology.leatherWorking` widens `CraftDomain` automatically (it is `keyof PhaseCharacteristics['technology']`).\n\nThe four explorer presets get independently argued values rather than clones of their `textiles` — cloning would have made the axis a no-op alias and shipped nothing. Tarpan 0.75 (its own text: \"the herd supplies bone, antler and hide\", leather `abundant` against linen `scarce`, mobile pastoralists tan continuously), Khaltiris 0.60 (militarised, `craftSpecialisation` 0.85, needs tanned hide at scale for armour backing and harness), Thalassar 0.45 (flax-abundant maritime palace culture, hide is workaday), Xoconahtl 0.30 (the only preset where leather is `scarce` below linen `available`; humid jungle is hostile to tanning).\n\nMeasured effect: Tarpan now weights leather at 6.4× its linen; Xoconahtl inverts that in linen's favour. Under the shared axis the two moved in lockstep.\n\n**Free of calibration consequence by construction:** the test fixture takes `0.5`, which its own \"every attribute neutral\" contract demands, and `materials.calibration.test.ts` runs on `mockPhaseCharacteristics()` with no overrides — so `phaseTechnologyWeight('leather')` is identical and all six leather pins hold unchanged.\n\n`TECHNIQUE_CRAFT_AXIS` deliberately unchanged, so no technique gates on `leatherWorking` on day one. `studs` stays on `metallurgy` (the substrate is what you attach *to*; the stud is metal and the skill is fastening). `wrapping` is the genuinely mixed case — it introduces `['fiber','leather']` — but pointing it at either pure axis is wrong half the time, and re-pointing would silently gut two tests that drive `technology.textiles` to 0 and 1; the correct fix is material-aware axis resolution, sharing 2GN.99's blocker. The axis earns its keep through `phaseTechnologyWeight`, which is where the conflation actually bit. Also updated: the two untyped axis-list duplicates (`materials.test.ts`'s `VALID_CRAFT_DOMAINS`, `grammars/core.test.ts`'s `PHASE_PATHS`) that fail only at runtime, and doc 05 §3.2's hand-copied interface.", "assignee": "Jason Warren"}, {"id": "2GN.101", "description": "rebuild `MaterialDefinition.physicalProperties` as orthogonal authored axes", "status": "done", "dependsOn": ["2GN.84"], "milestone": "M2", "notes": "Forced out of 2GN.99 on 2026-08-07 (doc 12 §2.35): that task assumed `physicalProperties` could say something useful about how hard a material is to work, and it could not. `workable: boolean` conflated three separate facts — brittleness (obsidian/flint/glass shatter), pliability (linen/leather deform rather than cut) and grain coarseness (granite cannot hold a fine line however carefully worked). `hardness: 'soft'|'medium'|'hard'` was not merely coarse but actively misused: `relief` and `overlay` both carried substrate comments conceding hardness was \"standing in as the nearest proxy\" for a fracture property the type lacked.\n\nSix authored axes replace the pair — `hardness` (1-10, pegged to the real Mohs scale so values stay independently checkable), `fragility`, `rigidity`, `grainFineness`, `porosity`, `combustibility` (all 1-7) — plus `reactivity: { oxidisation }`, keyed by reaction type so future chemistry is additive. All 16 materials scored against every axis, item-by-item, each argued from real materials practice.\n\nTwo axes were discovered mid-review by techniques that had nothing to key on: `patina` is a chemical process (hence `reactivity`, and hence its substrate was `{kind:'none'}` with the live generator patinating stone and glass), and `painting`/`glaze` both wanted absorbency (hence `porosity`), with `combustibility` following from glaze being a firing process. `oxidisation` carries a `-1` not-applicable sentinel feeding a substrate GATE rather than a difficulty penalty — glass has no oxidation chemistry at all, gold has it and is merely resistant (`0`), and keeping those distinct matters.\n\nAxis independence tested, not assumed: obsidian vs granite (same hardness/rigidity, granite less fragile, yet obsidian takes a far finer edge — only `grainFineness` explains it) and gold vs oak. Both pinned as tests.\n\nFour substrate corrections fell out: `patina` gains the oxidation gate; `glaze` a combustibility ceiling; `relief`/`overlay` retire the self-admitted hardness proxy (relief needing BOTH rigidity and fragility, since fragility alone admitted linen and leather); and **`gilding`'s gate was factually wrong** — it required metal, but real gilding is overwhelmingly on wood and gesso, with gilded leather and ceramic well attested. Doc 05 §8.2 carried the same error in prose (\"you don't gild wood\") and is corrected. `studs` changed verdict on gold deliberately (soft but rigid; real goldwork takes rivets).\n\n`deno task check` 0 errors, `deno test` 540/540. Both calibration guards held green throughout — the property model did not move material selection. Full detail: doc 12 §2.35.", "assignee": "Jason Warren"}, {"id": "2GN.85", "description": "propagate the 2GN.80 ruling into the tag vocabulary's documented status semantics", "status": "done", "dependsOn": ["2GN.80"], "milestone": "M2", "notes": "Landed doc-only (2026-08-04, doc 12 §2.29) — the re-scope anticipated on pickup. No code changed: `deno task check` was already 0 errors/549 files before this task started, since the 2GN.80 ruling PR (#48) shipped `AbsoluteTag`/`RelativeTag`/`ArtefactTag` completely, with no `FunctionTag`/`ContextTag` identifier surviving anywhere in `src/`, `scripts/` or `tests/`. Delivered: doc 05 §9.2's code block rewritten from the retired declarations to the shipped vocabulary (closing §2.28's own \"pending\" line), four stale type references elsewhere in doc 05 corrected to match, constraint notes recorded at the three unbuilt consumer sites (doc 05 §13.1 for description generation/2GN.38+, doc 04 §3.2 for the lens/M6, doc 06 §6 for NPC interpretation/M10), and two small corrections in doc 06 (a stale §7 cross-reference corrected to §3.3; the FOR/USED gloss reworded to past tense). Full detail in doc 12 §2.29.", "assignee": "Jason Warren"}, {"id": "2GN.86", "description": "`engine/generation/grammar.ts` — mass proxy sums component footprints; mass bands rebalanced to measured percentiles", "status": "done", "dependsOn": ["2GN.79"], "milestone": "M2", "notes": "Surfaced 2026-08-01 auditing all 43 classification rules at the user's request (the 2GN.79 session had cleared 41 of them in prose without per-rule sign-off). Three rules read `massBand` and all three were misbehaving: R27 (`very-heavy` → communal) fired on 0 of 7200 artefacts, and R25/R26 (heavy edge → labour tool; heavy container → storage) fired on 55.8% of edged and 61.1% of container artefacts while their JSDocs claimed contrasts (\"labour, **not** a blade weapon\"; \"storage jar **rather than** tableware\") that only hold for a minority.\n\n**Root cause was the proxy, not the band boundaries.** `deriveDimensions` computed `primaryExtent * secondaryExtent * (1 + 0.1 * (parts - 1))`, and both extents are *maxima* across components. Each component draws its size from a three-value ordinal table (4/14/40, 5/15/45, 3/8/18), so with 2–13 components at least one almost always rolled `large` and both axes pinned to 45cm: **57.4% of a 7200-artefact sample landed on exactly 45×45=2025**, one value holding the majority of output. No choice of boundary can separate a distribution like that — any cut either includes the spike (that band ≥57%) or excludes it (everything below sums to ≤43%). Compounding it, the proxy's reachable maximum was 4658 against a `very-heavy` threshold of 5000, making that band unreachable by arithmetic rather than merely rare. Same saturation-by-maximum failure as `appliedElementPresent` in 2GN.79, in a different guise.\n\nFixed by summing each component's own major×minor footprint instead: a many-part object is genuinely more massive than a one-part object sharing its largest axis, which a maximum can never express. Distribution went from 21 distinct products (top value 57.4%) to 1810 (top value 1.8%), range 9–4658 → 16–12183. Bands then pinned to measured p15/p45/p80/p95 (233/2033/2892/5007), deliberately tapering rather than equal-sized — most excavated finds are portable, and equal quintiles would have claimed a quarter of all finds are too heavy for one person to lift. Resulting spread: negligible 15.3% · light 29.2% · moderate 35.2% · heavy 15.6% · very-heavy 4.8%.\n\nDownstream: R27 0% → 5.0% (alive for the first time), R25 55.8% → 19.5% of edged, R26 61.1% → 24.8% of containers, R37 1.1% → 1.9% and R39 8.5% → 10.6% (their gated presence flags require `massBand` at most `light`, so more artefacts now qualify as wearable). `portability` also reads mass, so `major-effort` and `team-lift` became reachable. Every other rule unchanged to the decimal. The 2GN.79 calibration guard caught the drift and named both moved rules with their sizes — five recorded rates re-recorded and annotated. Two new grammar tests pin the invariants: mass grows with part count (the old proxy rated one and six large components equal), and no single band may hold a majority of output.", "assignee": "Jason Warren"}, {"id": "2GN.87", "description": "`src/lib/data/classification.ts` — R4's edge-family safety net catches nothing; decide whether to fix the grammar, the condition, or delete the rule", "status": "done", "dependsOn": ["2GN.79"], "milestone": "M2", "notes": "Surfaced 2026-08-01 during the 43-rule audit. R4 (`hasEdge && primaryAxisLength === 'short' && bladeLengthBand !== 'short'` → tool 0.4, everyday 0.2) fired on 0 of 7200 artefacts. Its own JSDoc states it exists \"so no edged artefact leaves the edge family with zero function signal\" — a deliberate safety net that has never caught anything.\n\nMeasured cause: only 50 of 7200 artefacts are edged with a short primary axis, and **all 50 carry `bladeLengthBand: 'short'`**, so R2 (dagger) or R3 (utility knife) always claims them first. The edged axis distribution is long 2214 / medium 444 / short 50, and no short-axis edged artefact has ever had a non-short blade band. Either the grammar cannot produce that combination — worth knowing as a generation gap — or the condition describes a shape that should not exist and the rule is dead code.\n\nDeliverable: determine whether the combination is reachable, then either fix the grammar, correct the condition, or delete R4 and record why. ⚠️ deleting shifts rule indices, so the pinned-index blocks in `classification.test.ts` and `EXPECTED_FIRE_RATES` in `calibration.test.ts` both need updating. Sibling R27 had the same shape (unreachable condition) and was resolved by 2GN.86's mass rebalance; R4 has no equivalent upstream fix identified.", "assignee": "Jason Warren"}, {"id": "2GN.88", "description": "calibration constants audited and justified; `SATURATION_CEILING` moved to the data layer", "status": "done", "dependsOn": ["2GN.79", "2GN.81"], "milestone": "M2", "notes": "Completing the 2GN.79 oversight audit: the retunes and fixtures had per-decision sign-off, but nine supporting constants were chosen without it. Each was measured or removed.\n\n`TOLERANCE_POINTS` 10 → 6. Re-running the whole calibration sweep under five different seed salts moves the worst-case rule by 3.8pp at n=1800, so 10 left only 6.2pp of genuine headroom — a rule could shift 9pp of real behaviour and pass. 6 keeps ~1.6× headroom over noise. Verified by inducing a subtler regression than the mass rebalance (R31 `\u003e= 4` → `\u003e= 3`, a 14.4pp drift), which the tightened band catches and names.\n\n`SAMPLES_PER_CELL` kept at 100, now justified rather than assumed: measured noise floor by cell size is 25→5.4pp, 50→5.1pp, 100→3.8pp, 200→3.3pp, 400→3.5pp, so 100 sits at the knee — 200 buys 0.5pp for double the runtime and 400 buys nothing.\n\n`SATURATION_CEILING` was **defined twice** (exported from the Explorer panel, re-declared as a local const in the guard) with nothing keeping them in sync — a defect introduced by 2GN.79/2GN.81. Now a single export in `src/lib/data/classification.ts`, since it is a fact about the rule set rather than about either consumer, and `routes/` may depend on `lib/` but not the reverse. Value kept at 60.\n\n`DORMANCY_FLOOR` removed along with the `rare` verdict. Measured across all four Explorer culture presets it flagged 4 rules on Tarpan (R27/R30/R31/R40), 1 each on Thalassar and Khaltiris, none on Xoconahtl — and on Tarpan those are the decoration rules, rare because it is a low-decoration culture, i.e. behaving correctly. The verdict reported a property of the selected culture rather than anything actionable, and the fire-rate column already says \"uncommon here\" more precisely. Three verdicts remain, each mapping to an action: `dormant` (investigate — a rule can be unreachable, as R4 is and R27 was), `saturated` (check intent against behaviour), `discriminating`.\n\nR31's weights (`elite 0.4, ornament 0.3`) reviewed and kept: they were authored for a rule meaning \"deliberate embellishment\", and the retuned condition finally delivers that meaning at a selectivity matching R30's (25.2% vs 25.3%). Any further weight change belongs to 2GN.82's systematic pass rather than one rule in isolation.\n\n`mockRegionalWorld`/`mockFullGeologicalContext`/`sampleWorld` lost their `coastalPort` default: which world you generate against changes material distribution substantially, so it is now always a stated choice. The CLI keeps a `DEFAULT_SAMPLE_REGION` so samplers run bare, and every sampler now prints its world in a header — an omitted `--world` was previously invisible in output.", "assignee": "Jason Warren"}, {"id": "2GN.91", "description": "`src/lib/types/description.ts` — add `condition?: VariantCondition` to `DescriptionVariant`; define `VariantCondition` (parameter-value gate + craftDomain/materialId/materialTag material gate)", "status": "done", "dependsOn": ["2GN.35"], "milestone": "M2", "notes": "Surfaced 2026-08-05 during 2GN.36/2GN.37 planning; widened 2026-08-05 during 2GN.36 authoring. `DescriptionVariant` addresses variants by `property` id + `register` + `emphasis` only — a variant fires for every value of its parameter, since the value itself only reaches the text via a `#slot#`. Two condition gaps surfaced against this:\n\n1. **Within-parameter value gating.** `elongated.crossSection`'s 'round' and 'rectangular' values don't support the same interpretive reading (a round cross-section is held differently to a rectangular one) — one template stretched across every value of a parameter reads as either shallow or false for some values.\n\n2. **Cross-property/material gating.** A geometric reading can depend on the component's *material*, not just its own parameter — 'taper suits a forceful strike' is false if the material is brittle. This was originally scoped as technical-only (craft process is materially determined at the root: grinding bronze, knapping obsidian, paring oak and throwing clay are different processes), but interpretive claims need the same gate for the same reason — a functional reading is a claim about geometry *given* material, not geometry alone. Originally proposed as a technical-only mechanism; interpretive authoring showed the same condition is required there, so both registers share this one field rather than duplicating the concept.\n\n`VariantCondition` fields are optional and any-of within, AND across fields (`{craftDomain: ['stoneWorking'], materialId: ['obsidian']}` requires both). No predicate functions (unlike `DECORATIVE_TECHNIQUES.substrate.test` in `data/decorations.ts`) — description data may cross the save boundary, so the condition must stay serialisable. Component *shape* deliberately has no field: the `property` id already carries it (`elongated.edge` only fires on an elongated component). Sibling-parameter conditions (e.g. edge=double AND crossSection=diamond on the same component) are deliberately out of scope — cheap to add later as a non-breaking extension, and premature inclusion risks the 2GN.87 failure mode (a plausible-looking conjunction that matches zero generated artefacts, silently). Guarded instead by the firing-frequency test added in 2GN.36/2GN.37's own test suites.", "assignee": "Jason Warren"}, {"id": "2GN.92", "description": "Doc 05 §13.1 + doc 12 propagation entry — record the `VariantCondition` shape change and the selection-order contract (condition filters the candidate set, then emphasis selects within it)", "status": "todo", "dependsOn": ["2GN.91"], "milestone": "M2", "notes": "Docs task pairing 2GN.91's type change. Doc 05 §13.1 currently publishes `DescriptionTemplate`/`DescriptionVariant` without a condition field; update the quoted interface and prose to match. Doc 12 gets a numbered propagation entry (next after §2.29) recording the change and its origin, matching the convention §2.28/§2.29 set for the `AbsoluteTag`/`RelativeTag` split.", "assignee": "Jason Warren"}, {"id": "2GN.93", "description": "`engine/generation/description.ts` — variant selection honours `condition`: filter candidates by the component's assigned material (via the `componentId → MaterialAssignment → MaterialDefinition` join) before emphasis-based selection", "status": "todo", "dependsOn": ["2GN.91", "2GN.111"], "milestone": "M2", "notes": "Nothing currently does the material join at description time — `NormalisedComponent` carries only `allowedMaterialTags` (a constraint), the actual assignment lives on `ClassifiedArtefact.materials` as a side-table (`MaterialAssignment[]`, joined by `componentId`). ⚠️ Overlaps 2GN.38, which already owns `generateDescription`'s variant selection — resolve at pickup whether this is a distinct task or 2GN.38's description should instead be amended to state selection honours `condition`. Flagged unresolved at authoring time (2026-08-05); do not let both exist as separately-tracked selection logic.", "assignee": "Jason Warren"}, {"id": "2GN.102", "description": "add a formability axis to MaterialDefinition.physicalProperties distinguishing materials worked by subtraction (knapping) from those with a formable/plastic working state (cast, thrown, blown, modelled)", "status": "done", "dependsOn": ["2GN.101"], "milestone": "M2", "notes": "Surfaced 2026-08-07 during PR #53 review fixes (roadmap 2GN.101 follow-on). relief substrate test needed to distinguish fired-clay/glass (both fragile once finished, but modelled/cast before hardening) from obsidian/flint (worked only by conchoidal-fracture subtraction, never formable). No existing axis expresses this: fragility describes the finished object, not the working process, and gating relief on it wrongly excluded fired-clay and glass. grainFineness cannot substitute either — its top rung (\"amorphous or glassy\") describes obsidian and glass identically, so it cannot separate them. Same shape as the reactivity axis 2GN.101 itself added for patina: a technique (relief) had nothing legitimate to key on, so a new orthogonal axis is the honest fix rather than another proxy. Until this lands, relief gates on rigidity alone (src/lib/data/decorations.ts), which is documented there as a known limitation: obsidian and flint pass relief's substrate test when they should not, because there is currently no axis to exclude them correctly. Sixteen materials need individually-argued values against the new axis, following 2GN.101's own per-item authoring pattern.", "assignee": "Jason Warren"}, {"id": "2GN.103", "description": "reconcile calibration.test.ts's measureFireRates and the Explorer's ruleCalibration.ts calibrateRules with sampleBaselines' material-aware grading, and discharge 2GN.99's forward hazard with a per-region meanDecorativeGrade pin", "status": "done", "dependsOn": ["2GN.99"], "milestone": "M2", "notes": "Surfaced 2026-08-07: a fix to sampleBaselines (src/lib/engine/generation/baselines.ts) threaded assignMaterials and gradeDecorativeLayers in before extractFeatures, so R44's meanDecorativeGrade baseline is sampled from the material-aware grade rather than expandDecoration's provisional technique-only value. That fix re-pinned R44's EXPECTED_FIRE_RATES entry from 12.3% to 4.0%, but touched only the baseline side — the two other places that call extractFeatures against generated layers (calibration.test.ts's measureFireRates, which sets EXPECTED_FIRE_RATES including the R44 figure this same fix moved, and ruleCalibration.ts's calibrateRules, the Explorer panel) still fed expandDecoration's ungraded layers straight in. Both were comparing a material-aware baseline against ungraded measured artefacts, so the 4.0% pin was itself measured on the wrong side of the asymmetry it was supposed to fix.\n\nWired both sites to match sampleBaselines' ordering (assignMaterials with its own `${seed}-materials` PRNG stream, then gradeDecorativeLayers, before extractFeatures). Since gradeDecorativeLayers is PRNG-free and assignMaterials draws from an independently-seeded stream, this cannot perturb any non-grade feature — verified directly: R1–R39, R42 came back bit-identical, R44 moved from 4.0% to 10.4% (landing at its p90 rung, as expected once both sides read the same scale). R40/R41/R43 showed a small pre-existing 0.2pp drift, traced to two unrelated substrate-gate fixes (78d7793) that landed between R44's last full recording (8a80823) and this task and were never re-measured against the full EXPECTED_FIRE_RATES array — within TOLERANCE_POINTS, left unpinned, and out of this task's scope.\n\nDischarged doc 12 §2.35's forward hazard against 2GN.99 (\"the moment grading enters the sampled path, meanDecorativeGrade becomes geology-sensitive, and EXPECTED_THRESHOLDS' pooling... becomes a claim nobody has measured\"): measured R44's fire rate per region directly rather than assuming the pooled figure was safe — a real 8.0%–13.7% spread across the six regional worlds, not sampling noise. Added EXPECTED_MEAN_GRADE_BY_REGION, a per-region pin (not pooled, unlike EXPECTED_THRESHOLDS' decorativeLayerCount/decorativeComplexity, which are region-invariant by construction) and a dedicated test asserting each region's rate individually. `deno task check` 552 files, 0 errors; `deno task test` 548/548 passing. Full detail: doc 12 §2.36.", "assignee": "Jason Warren"}, {"id": "2GN.105", "description": "`engine/generation/materials.ts` + `types/artefact.ts` + `data/materials.ts` — apply 2GN.111's ruling to the property model: give `rigidity` per-state values (`{worked, finished}`), re-author `fragility` and `hardness` to the **working** state across all 16 materials (they feed `computeLayerGrade` and nothing else, so the current finished-state authoring is wrong — glass `fragility: 7` cold while decorated hot, fired clay `6` fired while decorated wet), and document the pinned state on `formability` (working) and the state-independence of `grainFineness`, `porosity` and `combustibility`. ⚠️ re-authoring `fragility`/`hardness` shifts `meanDecorativeGrade` for glass and fired clay, so the 2GN.79 calibration guard will flag it and `EXPECTED_FIRE_RATES` needs re-recording with the drift annotated", "status": "todo", "dependsOn": ["2GN.111"], "milestone": "M2", "notes": "Rescoped 2026-08-13 by the 2GN.111 ruling. Was filed presupposing per-state values on every axis ('at minimum worked vs finished'); the spike measured that exactly one axis needs them, so this task now audits a specific list rather than performing a general reconciliation. Surfaced 2026-08-11 during 2GN.102 (doc 12 §2.38). Adding `formability` forced the discovery that its six siblings were authored against the finished object, without the question ever being asked or stated: `glass` (`fragility: 7`) reads cold glass, though hot glass (what `formability` reads) is viscous and freely formable; `iron`'s `hardness`/`rigidity` describe cold-worked iron, not the material as forged hot; `fired-clay`'s `fragility: 6` reads the fired result, though the working state is wet clay; `leather`'s `rigidity: 2` reads cured hide, though wet-moulded cuir bouilli holds a raised form. Only `fired-clay`'s data-file comment ever named this choice, as a one-off aside rather than a stated convention. Not a 2GN.102 workaround to clear — `relief`'s leather exclusion was already corrected on its cured-state merits in that task — this is the general problem of a single finished-state number standing in for a material whose worked properties differ.", "assignee": "Jason Warren"}, {"id": "2GN.106", "description": "`data/decorations.ts` + `engine/generation/decoration.ts` — add `formability` to `MaterialDifficultyAxis`, an `AXIS_NORMALISATION` entry, and per-technique `TECHNIQUE_MATERIAL_SENSITIVITY` weights, with re-measured grade distributions and 2GN.103's regional pins re-verified", "status": "todo", "dependsOn": ["2GN.102", "2GN.111"], "milestone": "M2", "notes": "Filed 2026-08-11 alongside 2GN.102 (doc 12 §2.38). Must first revisit the rung-5 casting/forging conflation recorded in that entry: `formability`'s rung 5 deliberately groups cast metals (bronze/gold/silver) with hot-forged iron as one plastic-working-regime rung — a simplification that is inert while `relief`'s gate is a `\u003e= 3` threshold (rungs 3–6 pass identically) but becomes load-bearing the moment this task reads the rungs as a difficulty gradient rather than a threshold. Note the `1`–`6` range differs from the other five difficulty axes' `1`–`7`, so `AXIS_NORMALISATION`'s `mid`/`half` need their own values, not a copy of a sibling's.", "assignee": "Jason Warren"}, {"id": "2GN.107", "description": "`data/decorations.ts` — sweep every `kind: 'material'` substrate test for exclusions that are artefacts of a proxy axis rather than attested practice, the way `relief`'s leather exclusion was", "status": "todo", "dependsOn": ["2GN.102", "2GN.111"], "milestone": "M2", "notes": "Filed 2026-08-11 during 2GN.102 (doc 12 §2.38). `relief` excluded leather solely as collateral from `rigidity \u003e= 3`, a test aimed at linen, with no material-science basis — corrected in 2GN.102 once `formability` gave the gate something honest to key on. `overlay` uses the identical `rigidity \u003e= 3` test `relief` used to carry; if `formability` is the correct gate for one, `overlay` is the first candidate for the same scrutiny. `studs`/`gilding` already carry a named leather exception and are not suspect on the same grounds.", "assignee": "Jason Warren"}, {"id": "2GN.108", "description": "design spike — should the artefact vocabulary express a short-bodied edged tool that is not a formed blade (scraper, chisel, small adze)? Today it cannot: `primaryAxisLength` bands `dimensions.primaryExtent`, a `Math.max` over every component's major axis drawn from the same `SHORT_MEDIUM_LONG_CM` table `bladeLengthBand` reads, so a non-short blade always lifts the artefact's axis above `short` and the blade band can never exceed the axis band. Measured over 8000 artefacts (2GN.87): only 6 of 12 `(axis, blade)` pairs occur, in a strict triangle, and `axis === 'short'` carried `blade === 'short'` in all 84 cases. These are among the commonest real assemblage finds, so the absence is a genuine content gap — but 2GN.87 ruled that the deleted R4 never encoded a decision to model them (it was authored in PR #37 review to plug a truth-table cell, with the scraper/chisel reading attached afterwards), so the question is open rather than inherited. If ruled yes, this spike also rules the mechanism: a shorter `elongated.length` rung below `short` / decoupling `bladeLengthBand` from the shared cm table so it bands the component's own proportion rather than absolute size / changing `deriveDimensions` so `primaryExtent` is not a plain `Math.max` (the 2GN.86 fix applied to a second symptom of the same cause). Each shifts fire rates set-wide and needs a recalibration sweep costed before it is chosen. A spike, not an implementation task — same shape as 2GN.80/2GN.77", "status": "done", "dependsOn": ["2GN.87"], "milestone": "M2", "notes": "Ruled 2026-08-13 — see docs/spikes/2GN.108-short-bodied-edged-tools.md (full spike), doc 11 §2.11 (locked decision) and doc 12 §2.43 (propagation). **The form is ruled in, on tag-space variety grounds rather than archaeological completeness**: short-bodied edged tools occupy the working/craft/domestic region, so their absence removes one region of the tag space rather than thinning the corpus evenly, leaving edged artefacts skewed to blade-family readings — which propagates into culture tag profiles and surfaces as repetition in the lens, the core mechanic. §2.9's culture-relative baselines cannot compensate, since they sample the same narrowed distribution. **All three candidate mechanisms were rejected as symptom-level.** The real defect is that `bladeLengthBand` bands the wrong quantity: absolute length cannot separate a scraper (edge-dominant, short) from a dagger (edge-dominant, long) from a hafted adze (long body, short edge) — the distinction is the grip-to-edge proportion. Re-based accordingly. **Grip-to-edge needs no role vocabulary**: `attachments` is a populated typed graph and `position` plus per-component extents already exist, so the span is a traversal the three plausibility proxies never used. **Root cause: `position` is documented as an oriented axis but minted as a depth-first traversal index**, so a blade can land at position 0 with its haft after it. Normalisation must orient, by **reversal** rather than rejection — a mirrored artefact carries no information, so rejecting it spends re-expansion budget enforcing probabilistically what construction can guarantee. Deferred: the general working-end definition (2GN.115), which blocks implementation rather than this ruling. Filed: 2GN.115, 2GN.116 (component roles, now blocking 2GN.13/2GN.14), 2GN.117 (implementation). ⚠️ 2GN.109 is live — it was contingent, void only if the form had been ruled out. Recalibration is set-wide and shared with 2GN.67, 2GN.69 and 2GN.109; sequence the sweep once.", "assignee": "Jason Warren"}, {"id": "2GN.109", "description": "`src/lib/data/classification.ts` — replacement edge-family rule for the short-bodied non-blade edge, framed morphologically rather than as a truth-table cell. The deleted R4 (roadmap 2GN.87) failed because its condition described a combination of feature *bands* rather than a shape: whatever signal this rule reads must be one the generator can actually vary independently. **Void if 2GN.108 rules the form out of MVP scope** — file the closure rather than authoring a rule for a form the game does not produce. Adding it shifts `CLASSIFICATION_RULES` indices again, so the pinned-index blocks in `classification.test.ts`, `EXPECTED_FIRE_RATES`/`MIGRATED_RULE_INDICES`/`UNIVERSAL_BY_DESIGN` in `calibration.test.ts` and the Explorer panel's label lookups all need updating together", "status": "blocked", "dependsOn": ["2GN.108", "2GN.118"], "milestone": "M2", "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.110", "description": "design spike — should `CulturalProfile.materialAffinities` support per-material entries alongside per-tag ones? Surfaced by 2GN.78 (doc 11 §2.9, doc 12 §2.40) as an accepted expressive loss: the map is keyed by `MaterialTag`, so with the `precious-*` members retired a culture can say \"we prize metal\" but no longer \"we prize gold specifically\". Thalassar's authored `precious-metal: 1.2` was the one live instance across the four Explorer presets and was dropped rather than re-expressed as `metal: 1.2`, which would newly favour bronze and iron that culture was never authored to prefer. Rule whether that granularity is worth carrying — and if so whether it belongs in `materialAffinities` as a second keyspace, or is better derived from the material's situation the way 2GN.77 ruled preciousness itself must be. Note the tension: a per-material affinity entry is a culture-authored judgement about one material, which is legitimate (it is *that culture's* opinion, not Earth's) but sits close enough to the retired tags that the boundary wants stating explicitly", "status": "done", "dependsOn": ["2GN.78"], "milestone": "M2", "notes": "Ruled 2026-08-13 — see docs/spikes/2GN.110-per-material-affinities.md, doc 11 §2.13 and doc 12 §2.45. **Yes: `materialAffinities` is re-keyed by `MaterialSelector`**, the same tagged union 2GN.112 built for `MaterialFlow`, and for the identical reason — `bone`, `glass` and `leather` each name both a `MaterialTag` and a `MaterialName`, so a bare union cannot distinguish them and precedence would make 3 of 16 materials unselectable by one of their readings. Only half the flow pattern transfers: `includes`/`excludes` exists because membership needs subtraction, and affinities are weights with nothing to subtract. **Resolution is most-specific-wins**: a class entry sets a default, a specific entry is an exception to it — `{tag:'metal'}: 1.5` with `{id:'gold'}: 0.8` reads 'all metals are 1.5, except gold, which is 0.8'. A specific entry with no class entry is well-formed and is what recovers Thalassar's dropped intent exactly (`{id:'gold'}: 1.2, {id:'silver'}: 1.2`, no `metal` entry). **This closes the unruled `max` reduction** flagged in `culturalAffinityWeight`'s JSDoc: per-material entries make the multi-value case arrive via the selector rather than via a multi-tag material, and 2GN.84 already measured max discarding authored values whenever the class tag scored higher (3 of 5 dead), so a specific entry could only ever raise a material, never lower it. Product-of-deviations rejected: 1.5 × 0.8 = 1.2, so a below-neutral authored value yields an above-neutral weight. `materials.ts`'s `culturalAffinityWeight` and `decoration.ts`'s `bestMaterialAffinity` move together. ⚠️ `effectiveOptionWeight` (`grammar.ts`) does NOT participate and this is not an inconsistency to reconcile: it weights grammar options by tag-keyed `culturalModifiers` at stage 4, before materials are assigned at stage 6, so it never sees a material; its `?? 0` default differs deliberately. ⚠️ **The tag-versus-tag tie stays explicitly unruled** — no shipped material carries two class tags, and authoring a rule for a shape that does not exist is the defect 2GN.87 punished. Boundary the brief asked for: a per-material affinity is legitimate because it lives in `CulturalProfile` (that culture's opinion), where the retired `precious-*` tags lived in `MaterialDefinition` (Earth's judgement, applied universally) — the test is where the statement lives, not how specific it is.", "assignee": "Jason Warren"}, {"id": "2GN.111", "description": "design spike — should `MaterialDefinition.physicalProperties` carry per-state values at all, and if so which states? 2GN.102 established a working-state convention for `formability` alone and named the inconsistency in `types/artefact.ts`'s preamble without resolving it (doc 12 §2.38); 2GN.105 was then filed presupposing the answer (\"at minimum worked vs finished\"). Rule the shape before the re-audit: whether a per-state model is warranted or the six pre-2GN.102 axes should instead be pinned to one documented state, how many states (`worked`/`finished`, or a third for `raw`), whether every axis needs every state or only those where the states genuinely differ, and what that does to the authoring burden across 16 materials × 7 axes. `glass`, `iron`, `fired-clay` and `leather` are the known-affected entries. 2GN.105 re-pointed to depend on this rather than on 2GN.102 directly, so the audit follows the ruling instead of assuming it", "status": "done", "dependsOn": ["2GN.102"], "milestone": "M2", "notes": "Ruled 2026-08-13 — see docs/spikes/2GN.111-per-state-physical-properties.md, doc 11 §2.14 and doc 12 §2.46. **Per-state on `rigidity` alone** (`{worked, finished}`); every other axis stays scalar with a documented state. Two states, not three. **The consumers are the fault line, not the physics**: three axes vary strongly by state and one marginally, but what decides the shape is which state each reader needs. `relief` (`formability \u003e= 3`) and wire-drawing (`formability \u003e= 5`) ask working-state questions; the three `rigidity \u003e= 3` gates on inlay/wrapping ask a finished-state one; `computeLayerGrade` reads its six difficulty axes in the working state, since difficulty is incurred while working. Bronze is the deciding case — whether it can be forged into a raised form and whether the finished object holds wire wrapped round it are both true and are different numbers, so no single convention serves both. Only `rigidity` is asked in both states by different consumers. Pinning: `formability` working (already correct), `fragility` working, `hardness` working, `grainFineness`/`porosity`/`combustibility` state-independent. Blanket per-state rejected — 16×7×3 = 336 values to capture variation in four axes, and a uniform shape invites false precision (an author given three boxes fills all three). `raw` rejected: no consumer asks about an unworked material. ⚠️ **`fragility` and `hardness` are a live defect**: both feed `computeLayerGrade` and nothing else, so working state is the only correct reading, yet both are authored finished-state — glass carries `fragility: 7` (cold) while decorated hot, fired clay `6` (fired) while decorated wet, both inflating difficulty. The correction is independent of the shape change and ⚠️ **shifts `meanDecorativeGrade`** for those materials, so the 2GN.79 guard will flag it — sequence with the other recalibration-bearing work. Rescoped 2GN.105.", "assignee": "Jason Warren"}, {"id": "2GN.112", "description": "design spike — **RULED 2026-08-12 (PR #57 review), implemented same branch.** Should `MaterialFlow.specificMaterials` narrow a flow or widen it? Neither: the field is gone, and `MaterialFlow` now selects via `includes: MaterialSelector[]` plus optional `excludes`, where `MaterialSelector` is `{ tag: MaterialTag } | { id: MaterialName }`. A flow supplies a material when some `includes` selector names it and no `excludes` selector does — union then subtract, no precedence, no ordering. **Why the shape changed rather than the operator:** the old `materialTag` + `specificMaterials` pair had two fields feeding one selector with the combining rule unstated; `flowSuppliesMaterial` ORed them while the type's own JSDoc claimed the id list narrowed the tag, so the list could only widen and 2GN.78's three re-keyed flows silently reached the whole class. Making it narrow would have expressed 'no metals except gold' but not 'all metals except gold' (only by enumerating the complement, which freezes against a growing catalogue); a single explicit material list had the same gap and also lost the open-over-the-catalogue property of a class tag. Selector arms are tagged because `bone`, `glass` and `leather` each name both a `MaterialTag` and a material id. **Scope addition:** `MaterialName` (`types/tags.ts`) now types every material id — `MaterialDefinition.id`, `RegionalAvailability.materialId`, `GeologicalContext.materialAvailability`'s key, `MaterialAssignment.materialId` and the selector's `id` arm — declared rather than derived from `MATERIALS` (the import would cycle) and pinned to the catalogue by a two-directional test. Doc 05 §3.4 and doc 12 §2.41 record it", "status": "done", "dependsOn": ["2GN.78"], "milestone": "M2", "notes": "⚠️ breaking: `MaterialFlow` loses `materialTag` and `specificMaterials`; `MaterialDefinition.id`, `MaterialAssignment.materialId`, `RegionalAvailability.materialId` and `GeologicalContext.materialAvailability`'s key narrow from `string` to `MaterialName`. **One measured behaviour change:** across all four Explorer presets × 16 materials against `origin/main`, Thalassar loses jade — its `trade-only` jade had been arriving through the obsidian flow's `stone` tag arm under the OR, which nobody authored. Every other pair is byte-identical; all 30 calibration pins hold with nothing re-recorded; 578 tests pass. Two deliberate `as MaterialName` casts remain in `decoration.test.ts`, exercising the runtime unknown-id guard that the type now makes unreachable through normal call sites — still worth keeping against a persisted save or a future catalogue edit. Follow-on left open: whether `excludes` should ever carry a `{ tag }` arm in authored data (it is typed for it, for disambiguation rather than expressiveness, and no shipped flow uses one).", "assignee": "Jason Warren"}, {"id": "2GN.113", "description": "**RULED 2026-08-12 (PR #57 review), implemented same branch.** Give `ClassificationRule` a stable `id` so a rule has an identity independent of its position. Every rule carries a kebab-case slug naming what it reads and concludes (`edge-short-sharp-dagger`), unique across the array and pinned by test; `ruleById`/`requireRuleById` resolve one, and `ruleDisplayLabel` renders the positional `R{n}` the Explorer and samplers still show. **Why:** a rule's only identity was its index, so 2GN.87's deletion of R4 shifted every later rule up one and silently invalidated every `R{n}` reference in comments, docs and tests at once. Nothing failed; the staleness was found by eye, across four follow-up commits (49319ec, f12f535, 15f8c8f, f7dd239), and this review pass still found more (a `R32`/`R29` pair in `classification.ts` and an `R11` in `types/tags.ts` describing rules two indices away). An id-based reference cannot go quietly stale: `requireRuleById` throws naming the missing id, verified by deleting a rule and watching the suite fail. **Scope:** `R{n}` survives as a display label only. Dated measurement records (`calibration.test.ts`'s fire-rate tables, doc 12, the spikes) keep their original numbering, since they describe the 44-rule set as measured; only live cross-references were migrated.", "status": "done", "dependsOn": ["2GN.87"], "milestone": "M2", "notes": "Delivered: `id` on `ClassificationRule` (`types/tags.ts`) with the rationale inline; 43 authored slugs in `data/classification.ts`, each verified against its own condition rather than assigned by position; `RULES_BY_ID` built at module load, throwing on a duplicate id; `ruleById`, `requireRuleById` and `ruleDisplayLabel` exported. `classification.test.ts`'s 43 index constants now call `requireRuleById`, and its 37 weight-signature identity guards are deleted as redundant (the lookup is the guard). Three id-contract tests added: uniqueness plus kebab-case shape, round-trip over every shipped rule plus rejection of the retired `edge-short-body-non-short-blade`, and display-label positionality (`R1`/`R43`, `undefined` for an unshipped rule). Explorer `tagInspector.ts` and `ruleCalibration.ts` carry `ruleId` alongside `label`; `scripts/dev/sample-classification.ts` reads `ruleDisplayLabel`. Doc 05 §9.2's `ClassificationRule` block documents the field per that doc's dated-note convention. Fixture rules in `engine/generation/classification.test.ts` synthesise `fixture-rule-N` ids. Three already-stale live references corrected in passing. Guard verified by deleting a rule: the suite fails with `no rule with id 'edge-multiple-composite'` rather than silently repointing. `deno test`: 581 passed, 0 failed.", "assignee": "claude"}, {"id": "2GN.114", "description": "`tests/fixtures/culture.ts` — extend `mockCulturalProfile`/`mockPhaseCharacteristics` with a high-craft/elite preset (`craftSpecialisation`, `decorativeEmphasis`, `motifComplexity` pushed toward 1.0), so elite/ceremonial-grade artefacts are reachable through ordinary sampling and Explorer calibration runs rather than only via hand-built overrides", "status": "todo", "dependsOn": ["2GN.110"], "milestone": "M2", "notes": "Filed from a real-world-find coverage spike (2026-08-13): ran the full M2 chain (expandGrammar → normaliseArtefact → expandDecoration → assignMaterials → gradeDecorativeLayers → extractFeatures → classifyArtefact) against 18 common real-world archaeological find types across 3000 sampled artefacts (6 mock regions × 500). Coverage (18/18) and frequency ordering (dominant \u003e common \u003e occasional \u003e rare, unranked) both held with no tuning aimed at the outcome. The one gap: `meanDecorativeGrade` capped at ~0.494 across every region under the flat-neutral-0.5 `mockPhaseCharacteristics`/`mockCulturalProfile` fixtures, making elite/ceremonial signatures (gold-lunula-style ornament, ceremonial mace-head) invisible to any default-fixture test or Explorer run — confirmed reachable (70/1000 and 392/1000 respectively) only after hand-pushing `craftSpecialisation`/`decorativeEmphasis`/`motifComplexity` to 1.0 for the spike. Not a pipeline defect; a fixture coverage gap with no reusable preset today.", "assignee": "Jason Warren"}, {"id": "2GN.115", "description": "design spike — what defines an artefact's working end in general, for artefacts with no edge? 2GN.108 ruled that normalisation must orient the artefact (working end at a shared pole across all artefacts sharing a dimensional axis) and that orientation is achieved by reversal rather than rejection, but ruled the general pole definition out of its own scope. For edged forms the working end is the edge; for a hafted head it is the head; for a vessel, disc, ring or pin there may be no functional pole at all. Rule whether orientation is total (every artefact oriented, which needs a pole rule for shapes that have no working end) or partial by design (only artefacts with a distinguishable functional pole are oriented, the rest left unoriented as `bladeLengthBand` already reports `'none'` for edgeless forms). ⚠️ this blocks implementation rather than 2GN.108's ruling: reversal cannot be implemented for edged forms and retrofitted to a different general convention without repeating the recalibration sweep", "status": "todo", "dependsOn": ["2GN.108"], "milestone": "M2", "notes": "Split out of 2GN.108 during the 2026-08-13 spike session. 2GN.108 established that `position` is intended as an oriented shared axis but is minted in `grammar.ts` as a depth-first traversal index (primary-before-attachments), so the invariant is unenforced — a blade can land at position 0 with its haft after it, and nothing rejects or reverses it. The three existing plausibility proxies (`hasGrippableSecondComponent`, `hasAdequateGripLength`, `hasRigidShaft`) each guess around this absence. Reversal was chosen over rejection because a mirrored artefact carries no information (it is the same artefact described backwards), so rejecting it spends re-expansion budget to enforce something probabilistically rather than by construction — but reversal only works if orientation is definable wherever it is applied, which is this spike's question.", "assignee": "Jason Warren"}, {"id": "2GN.116", "description": "design spike — should component roles (grip-system, head-system and whatever else the vocabulary needs) become first-class grammar output? All three rules in `data/plausibility.ts` are explicitly proxies standing in for an absent role concept: `hasGrippableSecondComponent` merely counts components, `hasAdequateGripLength` looks for some other medium/long `bar-form` or `elongated` component anywhere on the artefact (its own comment conceding a `disc-form` elsewhere \"says nothing about grip length\"), and `hasRigidShaft` accepts any rigid `sheet-form`/`bar-form` regardless of whether it bears the load. `types/plausibility.ts` names the same hole: the model cannot express a property-level concept like \"a grippable component\". Rule whether roles are authored into the grammar, derived from the attachment graph, or left as proxies for MVP — and if authored, what the role vocabulary is and what it costs across the primitive registry", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-13 from the 2GN.108 spike session. Scoped deliberately narrow: 2GN.108 established that grip-to-edge span is derivable from existing structure (`attachments` graph + `position` + per-component extents) without any role vocabulary, so roles are NOT a prerequisite for oriented normalisation or for a proportional `bladeLengthBand`. What roles would serve is the remaining proxy work in 2GN.13 and 2GN.14, which is why both now depend on this. Note that the `'grip-system'`/`'head-system'` strings in `types/interpretation.ts` are JSDoc illustration, not a defined type, and doc 05's `arrangementGroup` is repetition structure (symmetric/radial/linear-array), unrelated to role — so this vocabulary would be genuinely new rather than a specified-but-unwired concept.", "assignee": "Jason Warren"}, {"id": "2GN.117", "description": "`engine/generation/grammar.ts` + `engine/generation/classification.ts` — implement oriented normalisation and re-express `bladeLengthBand` as grip-to-edge proportion rather than absolute cm, with the full recalibration sweep", "status": "blocked", "dependsOn": ["2GN.115", "2GN.118"], "milestone": "M2", "notes": "Placeholder filed 2026-08-13 alongside the 2GN.108 ruling, so the implementation the spike unlocks exists in the graph rather than only in the spike doc. Depends on 2GN.115 alone: the 2GN.108 edge is reached transitively through it, so drawing it directly would be redundant. Carries two changes that must land together: normalisation orients the artefact by reversal (canonical working-end pole) instead of emitting a raw depth-first `position`, and `bladeLengthBand` bands the grip-to-edge span traversed over the `attachments` graph instead of reading absolute cm off `SHORT_MEDIUM_LONG_CM`. ⚠️ shifts fire rates set-wide — the 2GN.79 calibration guard will flag every moved rule, and `EXPECTED_FIRE_RATES` needs re-recording with the drift annotated. Downstream of 2GN.108 alongside 2GN.67, 2GN.69 and 2GN.109, so sequence the sweep once rather than per-task.", "assignee": "Jason Warren"}, {"id": "2GN.118", "description": "design spike — are the primitive grammar's categorical parameter value-sets rational and justified? `PRIMITIVE_PARAMETERS` (`data/grammars/primitives.ts`) reproduces doc 05 §5.3 verbatim, so this audits the spec's own vocabularies rather than any code drift. Surfaced by 2GN.97 2026-08-13 while stress-testing whether `baseType` is a genuine categorical: it is, but the value-sets around it are not obviously deliberate. Three measured instances, all of the same shape — two primitives expressing the same concept with disjoint vocabularies, so a value is unreachable by primitive type rather than by design. (a) `base`: `cylindrical` rolls `['flat','rounded','pointed']`, `hollow-enclosed` rolls `['flat','rounded','pedestal']`, making a pedestalled bowl and a pointed cylinder both unreachable — and capping `base-pedestal-display`'s population at hollow-enclosed containers. (b) `opening`: `cylindrical` rolls `['open','restricted','closed']` while `hollow-enclosed` rolls `['wide','narrow','slit','none']` — different vocabularies AND different arities for one concept, leaving `slit` (read by `container-slit-votive`) unreachable on cylinders. (c) `perforation`: `flat-broad` rolls `['none','single','multiple']`, `disc-form` rolls `['none','central','off-centre']` — disjoint, so `perforation-central-rotation` can only ever fire on discs and `perforation-single-pendant` only on flat-broads. Rule for each parameter whether the split is deliberate morphological modelling or an artefact of authoring the BNF primitive-by-primitive; where deliberate, record why; where not, rule the corrected vocabulary. Same shape as 2GN.87's reachability finding, applied to the grammar's inputs rather than a rule's condition", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-13 from the 2GN.97 spike session, which reached it by stress-testing whether `baseType` is a genuine categorical (it is — unlike `wallThickness`, there is no crushed continuous quantity beneath it). The audit question is one level up: whether the value-sets themselves were designed or accreted. ⚠️ Ruling here may change which values exist, so anything authoring rules against them or deriving from them waits: 2GN.10 (`allowedMaterialTags` from primitive type + properties), 2GN.21 (`physicalLabel` from these observable values), 2GN.109 (replacement edge-family rule) and 2GN.117 (re-bands `bladeLengthBand` off `elongated.length`). 2GN.97 is NOT a dependent — it surfaced the defect rather than consuming the vocabulary.", "assignee": "Jason Warren"}, {"id": "2GN.119", "description": "design spike — should classification conditions read *relations between components* rather than isolated component properties? Measured 2026-08-13 over all 43 shipped rules during 2GN.97: **10 of the 24 unmigrated rules condition on exactly one property** (`f.x === 'value'` and nothing else) — `base-pedestal-display`, `base-pointed-amphora`, the three `perforation-*` rules, both `ring-*` rules, both `sheet-*` rules and `size-small-personal`. A further 7 read two properties that both describe the *same* component (the container rules pair `hasContainer`, a presence flag, with a feature extracted off the dominant container). Exactly one rule is genuinely relational (`motif-multiple-origins`, comparing origins across the artefact's decoration). A base is a relationship between the base and what it supports: a pedestal under a statue and a pedestal under a hat-stand carry opposite readings, identical `baseType`, and no amount of culture-relativity separates them because the difference is not cultural. The rule reads one term of a two-term relation and discards the term carrying the meaning — doc 02 Simulation Honesty. ⚠️ This is orthogonal to doc 11 §2.9's absolute/relative cut: `perforation-central-rotation` awards `tool` (an AbsoluteTag) and is under-conditioned identically, so the defect is a property of how conditions are written, not of which vocabulary they award from. `NormalisedArtefact.attachments` and `NormalisedComponent.position` are populated and unread by every rule — the same unused-graph finding as 2GN.108. Rule whether conditions gain access to component relations, what that does to `ClassificationRule.condition`'s signature (already widened once by 2GN.80), and which rules are rewritten versus left as affordance readings", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-13 from the 2GN.97 spike session. Scope is **all 43 rules**, not the 24 unmigrated ones: the measurement that produced it covered the 24, but the defect cuts across the absolute/relative boundary, so scoping to relative-award rules would audit the wrong set. Supersedes the framing 2GN.97 inherited — those rules are not unmigrated-but-fine awaiting a baseline, a class of them is under-conditioned, and no baseline of any kind fixes an under-conditioned rule. Absorbs the ambiguity originally filed as a competing-readings question (a central perforation reads spindle-whorl or pendant depending on the disc's size, mass and what it attaches to — the ambiguity IS the missing relational term). ⚠️ Interacts with 2GN.118: that audits which parameter *values* exist, this audits what a condition may *read*. Independent questions on the same surface; neither blocks the other.", "assignee": "Jason Warren"}, {"id": "2GN.120", "description": "`engine/generation/grammar.ts` — derive `wallThickness` as a modelled quantity rather than a free three-value roll. Today `PRIMITIVE_PARAMETERS` rolls `wall: ['thin','medium','thick']` directly, with no continuous value beneath and no input from craft process, material or vessel role. Three consequences ruled in 2GN.97 (2026-08-13): (a) thickness is plausibly a *derivative of the crafting process* and is currently uninfluenced by `craftSpecialisation`, the component's assigned material or what the vessel is for; (b) three rungs is the entire gradation available, too coarse for the distinctions the classification rules try to draw on it; (c) **cross-culture comparison is impossible by construction** — one culture's `thick` may be physically thinner than another's `thin`, and since the band is cut from a global table before anything culture-relative is consulted, no baseline can recover the difference. Fourth instance of the band-computed-from-an-absolute-table family after 2GN.86 (mass), 2GN.87 (blade) and 2GN.108 (axis). Deliverable: a derived thickness quantity with its inputs ruled, and bands cut per-culture rather than globally", "status": "todo", "dependsOn": [], "milestone": "M2", "notes": "Filed 2026-08-13 by the 2GN.97 ruling, which found `vessel-thin-walled-fine-ware` and `vessel-thick-walled-utilitarian` unrelativisable: no baseline of any kind — prevalence, stratification or weight-scaling — can relativise a three-value label rolled from a global table, because there is no quantity for a culture to have opinions about. Prevalence in particular cannot work here (unlike `baseType`, where it can): band frequency says nothing about actual thickness, so a culture whose walls are all 3mm and one whose walls are all 30mm both read '100% thin' or '100% thick' depending only on where the global cut falls. ⚠️ The two wall rules stay as they are until this lands — they were left absolute rather than migrated or deleted, recorded as blocked-with-reason. ⚠️ Overlaps 2GN.118, which audits whether the `wall` vocabulary is justified at all; if that spike rules the three-value set out, this task's shape changes with it.", "assignee": "Jason Warren"}, {"id": "3WS.1", "description": "`engine/world/seed.ts` — `createWorldSeed(raw: string): WorldSeed` — seed string → PRNG", "status": "blocked", "dependsOn": ["2GN.56", "M2"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.2", "description": "`engine/world/chronology.ts` — `generateChronology(seed, prng): WorldChronology` — startYear, endYear, presentYear, culture-relative periodisation (no shared timeline)", "status": "blocked", "dependsOn": ["3WS.1"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.3", "description": "`engine/world/culture.ts` — `generateCultures(prng, count): Culture[]` — culture generation with `CulturalProfile` (materialAffinities, motifVocabulary, craftInvestment)", "status": "blocked", "dependsOn": ["3WS.2", "2GN.110"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.4", "description": "`engine/world/culture.ts` — `generatePhases(culture, prng): CulturePhase[]` — 3-4 phases per culture with `PhaseCharacteristics` (technology, economy, society, aesthetics)", "status": "blocked", "dependsOn": ["3WS.3"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.5", "description": "`engine/world/culture.ts` — `generateRelationships(cultures, prng): CultureRelationship[]` — temporal relationship phases with trade, conflict, cultural exchange, politics", "status": "blocked", "dependsOn": ["3WS.3"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.6", "description": "`engine/world/culture.ts` — `MaterialFlow` generation within relationships (tag, materials, direction, volume)", "status": "blocked", "dependsOn": ["3WS.5"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.7", "description": "`engine/world/seed.ts` — geological context generation: `GeologicalContext` with material availability per region, `AvailabilityLevel` per material", "status": "blocked", "dependsOn": ["3WS.1"], "milestone": "M3", "notes": "Inherits the region-vocabulary decision dependency sweep 2026-07-25 deferred here: decide whether regions become first-class (`Culture` gains a region binding, ⚠️ breaking) or stay convention-agreed strings, and reconcile the provisional region strings 2GN.26 and 2GN.47 already mint against mock fixtures.", "assignee": "Jason Warren"}, {"id": "3WS.8", "description": "`engine/world/culture.ts` — motif vocabulary generation per culture (distinctive sets for cultural fingerprinting)", "status": "blocked", "dependsOn": ["3WS.3"], "milestone": "M3", "notes": "Generated vocabularies must be non-empty: doc 05 §8.5 treats motifs as the primary cultural fingerprint and doc 06's decorative-mismatch strain assumes motif attribution works for every culture; `assignDecorativeDetails` (2GN.33) deliberately degrades gracefully on an empty vocabulary rather than enforcing this, so enforcement lives here (recorded 2026-07-25).", "assignee": "Jason Warren"}, {"id": "3WS.9", "description": "`engine/world/seed.ts` — `createWorld(seed: string): WorldState` — full orchestrator: chronology + cultures + geology + relationships", "status": "blocked", "dependsOn": ["3WS.4", "3WS.7", "3WS.5"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.10", "description": "`src/lib/stores/worldState.svelte.ts` — reactive wrapper: chronology, artefacts, sites, scholars, documents, lineage graph, venues, career events", "status": "blocked", "dependsOn": ["3WS.9"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.11", "description": "`src/lib/stores/playerInterpretation.svelte.ts` — reactive wrapper around player's `InterpretiveModel` with immutable update methods (placeholder)", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.12", "description": "`src/lib/stores/lensState.svelte.ts` — lens state store (placeholder, computed later)", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.13", "description": "`src/lib/stores/ui.svelte.ts` — UI state: selected artefact, active panel", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.14", "description": "`src/lib/stores/gameState.svelte.ts` — orchestrator: imports all stores, provides `initialise(seed)`, `surfaceArtefact()`, `refreshLens()`, cross-store coordination", "status": "blocked", "dependsOn": ["3WS.12", "3WS.11", "3WS.13"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.15", "description": "`engine/generation/pipeline.ts` — replace mock culture profiles with real `WorldState` data throughout", "status": "blocked", "dependsOn": ["3WS.14"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.16", "description": "End-to-end determinism verification: same seed + same position → identical artefacts", "status": "blocked", "dependsOn": ["3WS.15"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.17", "description": "Explorer: chronology timeline with period boundaries", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.18", "description": "Explorer: culture profiles with bias summaries", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.19", "description": "Explorer: culture relationship graph visualisation", "status": "blocked", "dependsOn": ["3WS.10"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.20", "description": "Explorer: store inspector panel — live view of `worldState`, `playerInterpretation` contents (`termState` added at 9CR.21)", "status": "blocked", "dependsOn": ["3WS.14", "3WS.19", "3WS.18", "3WS.17"], "milestone": "M3", "notes": "", "assignee": "Jason Warren"}, {"id": "3WS.21", "description": "`engine/world/culture.ts` — phase-attribute continuity: `generatePhases` must evolve `PhaseCharacteristics` continuously between adjacent phases, with bounded per-phase change and sharp breaks as deliberate rare events rather than the default", "status": "blocked", "dependsOn": ["3WS.4"], "milestone": "M3", "notes": "Surfaced 2026-08-04 by the 2GN.80/2GN.77 ruling (doc 11 §2.9, doc 12 §2.28), which records status-tag drift per culture-phase against the immediately preceding phase. That measure is only meaningful if phases evolve continuously, and nothing enforces it: `CulturePhase.characteristics` is a free `PhaseCharacteristics` per phase, and doc 05's five coherence rules are all within-artefact (structural, geological, decorative), none temporal. As specified, a culture could oscillate `decorativeEmphasis` 0.1 → 1.0 → 0.1 across three phases unchallenged, and drift measured across those phases would report noise. Recorded by the decision that depends on it rather than discovered later.", "assignee": "Jason Warren"}, {"id": "2GN.96", "description": "baselines cached on real `WorldState`; drift-vs-preceding-phase; `PhaseCharacteristics.society.stratification` as a live classification input", "status": "blocked", "dependsOn": ["2GN.95", "3WS.4", "3WS.9", "3WS.21"], "milestone": "M3", "notes": "Split out of 2GN.95's scope 2026-08-05: doc 11 §2.9 says baselines are \"cached in world state\", but `WorldState` does not exist (`types/save.ts` — lands at 3WS.9). Drift-vs-preceding-phase needs a real multi-phase timeline; every fixture today is single-phase, and 3WS.21 (phase-attribute continuity) is doc 11 §2.9's own named prerequisite for that measurement to mean anything rather than measure noise across incoherent phases. `stratification` is ruled a live input gating how much `elite` can exist at all, independent of any one distribution — deliberately absent from `ClassificationContext` until this task, since declaring it unread would be a lie the type tells. Moved from M2 to M3 2026-08-05: its dependencies (3WS.4/3WS.9/3WS.21) are all M3 tasks, and M3's own entry point (3WS.1) gates on the whole of M2 completing — an M2 task cannot depend on M3 work without a cycle.", "assignee": ""}, {"id": "4UI.1", "description": "`components/study/ArtefactInspector.svelte` — main artefact display shell (replaces `ItemGenerator.svelte`)", "status": "blocked", "dependsOn": ["3WS.15", "M3"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.2", "description": "`components/study/PropertyList.svelte` — ordered list of artefact properties with register-specific descriptions", "status": "blocked", "dependsOn": ["4UI.1"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.3", "description": "`components/shared/TagBadge.svelte` — tag display badge component", "status": "blocked", "dependsOn": ["4UI.1"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.4", "description": "`components/shared/ConfidenceBadge.svelte` — confidence level badge", "status": "blocked", "dependsOn": ["4UI.1"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.5", "description": "Component list UI — materials, features, decorative layers per component", "status": "blocked", "dependsOn": ["4UI.1"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.6", "description": "Provenance display — site, culture label, period, context, dating framework from corpus", "status": "blocked", "dependsOn": ["4UI.5"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.7", "description": "`routes/study/+page.svelte` — artefact study workspace: generates artefact, displays inspector", "status": "blocked", "dependsOn": ["4UI.6"], "milestone": "M4", "notes": "", "assignee": "Jason Warren"}, {"id": "4UI.8", "description": "Register switching UI — toggle between observa
