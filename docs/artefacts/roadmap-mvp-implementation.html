ht` (2GN.74) supplies the first two (`level`, `culturalAffinity`, `tradeRescued`); provenance comes separately from `MaterialAssignment.provenance` via `deriveMaterialProvenance`; stratification from `PhaseCharacteristics.society.stratification`, unread today. Blocked on 2GN.110 for the same reason as 2GN.68: whether `materialAffinities` can express a per-material judgement determines how precisely \"this culture values this material\" can be read", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 200, "isMilestoneSink": false, "notes": "⚠️ breaking: `ExtractedFeatures` carries zero component-material fields today (its one material-adjacent field, `preciousMaterialsInDecoration`, is about decorative-layer materials and belongs to 2GN.68); this task adds new `ExtractedFeatures` fields (materialId/precious-material signal, in the style of 2GN.17's 13-field addition), a new `materials`/`assignments` parameter on `extractFeatures`, and fixture updates (`neutralExtractedFeatures`/`mockExtractedFeatures`), on top of the rules themselves. Dependency sweep 2026-07-25 corrected the dependency to 2GN.75 (assignments, not just the single-component `assignMaterial`) and flagged the breaking scope the original line hid. Depends on 2GN.78: that task retires `precious-metal`/`precious-stone` as classification inputs entirely, so this task's \"precious metals → elite/ceremonial\" rule must derive standing from material situation (availability × affinity × provenance × stratification) rather than a static precious-tag lookup — without 2GN.78 sequenced first, this task could restore the static reading 2GN.77 ruled against. Blocked on 2GN.142 as of 2026-08-21: doc 11 §2.9 requires material baselines to be keyed by culture-phase × region, but `ClassificationContext`/`baselines.ts` carry no region dimension today, so the relative-tag threshold this task needs to rule (per Jason's ruling that session, percentiled against a sampled weight distribution, not a fixed constant) cannot be computed correctly until that gap closes. Provenance dropped from this task's own formula per the same session's ruling — see 2GN.143.", "assignee": "Jason Warren"}, {"id": "2GN.68", "description": "`engine/generation/classification.ts` — update: decorative motif and introduced-material features contribute to unified tag accumulation (`motifCulturalOrigins` from `DecorativeLayer.motifRef`→culture lookup; `preciousMaterialsInDecoration` from the layer material's **situation in the producing culture**). ⚠️ **Rescoped 2026-08-11 by 2GN.78** (doc 11 §2.9, doc 12 §2.40): this line previously read \"`preciousMaterialsInDecoration` from `DecorativeLayer.material`→precious-material lookup\", which is exactly the static catalogue read 2GN.77 ruled against and which no longer has anything to look up — `MaterialTag`'s `precious-metal`/`precious-stone` members are retired. Populate the field from availability × cultural affinity × provenance instead: Doc 11 §2.9's formula has four terms sourced from three places: `explainMaterialWeight` (2GN.74) returns `level`, `culturalAffinity` and `tradeRescued` for a material/culture pair (availability and cultural affinity); provenance comes separately from `MaterialAssignment.provenance` via `deriveMaterialProvenance`, since `tradeRescued` is a reachability boolean rather than a provenance substitute; and stratification from `PhaseCharacteristics.society.stratification`, which §2.9 makes live and nothing reads yet. The threshold over them is this task's to rule and has not been set. Blocked on 2GN.110 because the affinity term's keyspace (per-tag only, or per-material too) changes what \"this culture prizes it\" can even mean", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 200, "isMilestoneSink": false, "notes": "**Note from 2GN.84 (doc 12 §2.34, 2026-08-06):** confirmed `assignDecorativeDetails` (`engine/generation/decoration.ts`) has no production caller anywhere in `src/` — only its own tests reach it. This task needs that wired into the pipeline before `DecorativeLayer.material` is ever populated outside tests, which is the direct upstream reason `preciousMaterialsInDecoration` is hardcoded `false` in `extractFeatures`. Blocked on 2GN.142 as of 2026-08-21: this task shares 2GN.27's exact four-term formula and its region-keyed-baseline gap; see that task's note.", "assignee": "Jason Warren"}, {"id": "2GN.48", "description": "`engine/world/scholars.ts` — `generateNPCScholars(cultures, chronology, prng): NPCScholarSeed[]` — 3-4 NPCs with name, specialisation, career stage", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 189, "isMilestoneSink": false, "notes": "Signature takes the loose `Culture[]`/`WorldChronology` bag M2 can actually supply rather than `WorldState` (see 2GN.56's note); also needs an `InterpretiveModel` fixture factory added to `tests/fixtures/` since none exists (dependency sweep 2026-07-25).", "assignee": "Jason Warren"}, {"id": "2GN.116", "description": "design spike — should component roles (grip-system, head-system and whatever else the vocabulary needs) become first-class grammar output? All three rules in `data/plausibility.ts` are explicitly proxies standing in for an absent role concept: `hasGrippableSecondComponent` merely counts components, `hasAdequateGripLength` looks for some other medium/long `bar-form` or `elongated` component anywhere on the artefact (its own comment conceding a `disc-form` elsewhere \"says nothing about grip length\"), and `hasRigidShaft` accepts any rigid `sheet-form`/`bar-form` regardless of whether it bears the load. `types/plausibility.ts` names the same hole: the model cannot express a property-level concept like \"a grippable component\". Rule whether roles are authored into the grammar, derived from the attachment graph, or left as proxies for MVP — and if authored, what the role vocabulary is and what it costs across the primitive registry", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 4, "transitiveUnblocks": 182, "isMilestoneSink": false, "notes": "Filed 2026-08-13 from the 2GN.108 spike session. Scoped deliberately narrow: 2GN.108 established that grip-to-edge span is derivable from existing structure (`attachments` graph + `position` + per-component extents) without any role vocabulary, so roles are NOT a prerequisite for oriented normalisation or for a proportional `bladeLengthBand`. What roles would serve is the remaining proxy work in 2GN.13 and 2GN.14, which is why both now depend on this. Note that the `'grip-system'`/`'head-system'` strings in `types/interpretation.ts` are JSDoc illustration, not a defined type, and doc 05's `arrangementGroup` is repetition structure (symmetric/radial/linear-array), unrelated to role — so this vocabulary would be genuinely new rather than a specified-but-unwired concept.", "assignee": "Jason Warren"}, {"id": "2GN.132", "description": "design spike — does sublayer generation live inside `expandDecoration`'s existing slot loop, or as a separate unwired post-pass?", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 182, "isMilestoneSink": false, "notes": "Folding sublayer draws into `expandDecoration`'s existing slot loop changes its deterministic draw sequence for every artefact, moving `EXPECTED_FIRE_RATES`/`EXPECTED_THRESHOLDS`/`EXPECTED_MEAN_GRADE_BY_REGION` in `calibration.test.ts`, the p75 pin in `statistics.regression.test.ts`, and breaking `classification.test.ts`'s explicit `maxDepth === 1` regression guard (the '2GN.31 regression guard' test) — all three carry the 'when this fails, it is usually right, widening the band is usually wrong' warning, so re-recording them correctly requires deliberately re-measuring the new distribution, not just making the assertion pass. The alternative, a separate post-pass, matches the precedent `enforceSubstrates` (2GN.30) and the material-sensitivity extension (2GN.99) already set: both shipped unwired specifically to avoid perturbing the draw sequence and moving any calibration pin. `assignDecorativeDetails`/`gradeDecorativeLayers` are already written recursion-ready in this shape, waiting for something to populate `sublayers`. Neither option is free: the first is real integration at calibration-breaking cost; the second is safe to ship but leaves `expandDecoration` itself flat, and nothing currently calls `assignDecorativeDetails` in production (2GN.84's note) — a discouraging precedent for 'ship it unwired and something will call it later'. Surfaced 2026-08-19 during an attempt to implement 2GN.31/2GN.32 (see BLOCKED.md at the repo root for the full research trail).", "assignee": "Jason Warren"}, {"id": "2GN.136", "description": "design spike — rule the selection criteria and target size for widening the material catalogue: what \"what a real assemblage needs\" (2GN.124's stated judge) means concretely — which single-leaf `MaterialTag` classes must gain siblings for `materials.calibration.test.ts`'s intra-tag guard to measure anything (clay, glass, fiber, leather), which archaeologically common materials earn a slot (shell, amber, horn, pigments, composites), whether new `MaterialTag` members are admitted, and the per-candidate recalibration cost (`EXPECTED_TAG_SHARES`/`EXPECTED_INTRA_TAG_SHARES` move; every authored `materialAffinities` entry array and the 2GN.128 validator verdicts are touched)", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 182, "isMilestoneSink": false, "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.124 is written as implementation but no doc section defines selection criteria or a target catalogue size, and the change is calibration-shifting. This spike rules the scope; 2GN.124 implements it.", "assignee": "Jason Warren"}, {"id": "2GN.138", "description": "design spike — define \"interpretive challenge\" as a measurable per-artefact quantity and rule the excavation ambiguity distribution targets. Doc 05 §11.3 specifies the principle (measure the interpretive-challenge distribution of a batch, steer the next excavation if skewed) and gives one illustrative skew example (\"90%+ clearly classifiable\"), but never defines the quantity — no formula, no per-artefact scoring rule. 2GN.45's target bands (~30-40% clear / ~40-50% moderate / ~20-30% high) trace to no doc section. Rule the scoring formula (candidate inputs: classification-rule fire counts and margins, tag ambiguity, occluded-property coverage) and re-derive or ratify the bands against measured generator output", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 3, "transitiveUnblocks": 182, "isMilestoneSink": false, "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.45 and 2GN.46 both require a metric doc 05 deliberately left qualitative, and 2GN.45's bands appear to originate in the roadmap task text itself. Blocks both.", "assignee": "Jason Warren"}, {"id": "2GN.105", "description": "`engine/generation/materials.ts` + `types/artefact.ts` + `data/materials.ts` — apply 2GN.111's ruling to the property model: give `rigidity` per-state values (`{worked, finished}`), re-author `fragility` and `hardness` to the **working** state across all 16 materials (they feed `computeLayerGrade` and nothing else, so the current finished-state authoring is wrong — glass `fragility: 7` cold while decorated hot, fired clay `6` fired while decorated wet), and document the pinned state on `formability` (working) and the state-independence of `grainFineness`, `porosity` and `combustibility`. ⚠️ re-authoring `fragility`/`hardness` shifts `meanDecorativeGrade` for glass and fired clay, so the 2GN.79 calibration guard will flag it and `EXPECTED_FIRE_RATES` needs re-recording with the drift annotated", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 181, "isMilestoneSink": false, "notes": "Rescoped 2026-08-13 by the 2GN.111 ruling. Was filed presupposing per-state values on every axis ('at minimum worked vs finished'); the spike measured that exactly one axis needs them, so this task now audits a specific list rather than performing a general reconciliation. Surfaced 2026-08-11 during 2GN.102 (doc 12 §2.38). Adding `formability` forced the discovery that its six siblings were authored against the finished object, without the question ever being asked or stated: `glass` (`fragility: 7`) reads cold glass, though hot glass (what `formability` reads) is viscous and freely formable; `iron`'s `hardness`/`rigidity` describe cold-worked iron, not the material as forged hot; `fired-clay`'s `fragility: 6` reads the fired result, though the working state is wet clay; `leather`'s `rigidity: 2` reads cured hide, though wet-moulded cuir bouilli holds a raised form. Only `fired-clay`'s data-file comment ever named this choice, as a one-off aside rather than a stated convention. Not a 2GN.102 workaround to clear — `relief`'s leather exclusion was already corrected on its cured-state merits in that task — this is the general problem of a single finished-state number standing in for a material whose worked properties differ.", "assignee": "Jason Warren"}, {"id": "2GN.131", "description": "design spike — what does the decorative recursion depth cap actually compute from `craftSpecialisation` and `aesthetics.decorativeEmphasis`?", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 181, "isMilestoneSink": false, "notes": "2GN.32's own title names both inputs, but no integer mapping, scale, or per-depth decay exists anywhere. Doc 05 §8.3's four-corner table ('0–1 layers' / 'up to 3 layers deep') was measured and ruled unbuildable as a single volume scalar by doc 11 §2.10 (roadmap 2GN.98), which deliberately split the table into `decorationVolume` (reads `decorativeEmphasis` alone) and `DecorativeLayer.grade` (reads `craftSpecialisation` alone) — leaving recursion depth itself unresolved; doc 12 §2.24 records 'defer to 2GN.31' as one of the rejected candidate answers, confirming depth was consciously left open rather than decided in advance. Nearest in-codebase precedent: `grammar.ts`'s attachment recursion (`MAX_ATTACHMENT_DEPTH = 3`, `ATTACHMENT_PROBABILITY = 0.4`, `ATTACHMENT_DEPTH_DECAY = 0.5`, gated via `prng() \u003c probability * decay ** depth`) — the same shape, but with fixed constants rather than values derived from two phase attributes. Doc 05 §8.3's 'up to 3 layers deep' corner is the only numeric ceiling anchor in the docs. Also stale and worth correcting alongside this ruling: `types/world.ts` lines 42–44 still say craft alone drives the recursion cap, predating §2.10's split of volume from grade. Surfaced 2026-08-19 during an attempt to implement 2GN.31/2GN.32 (see BLOCKED.md at the repo root for the full research trail).", "assignee": "Jason Warren"}, {"id": "2GN.140", "description": "design spike — rule how the grammar models intentional multi-part assemblages versus stray components: `\u003cobject\u003e ::= \u003ccomponent-group\u003e+` lets `expandGrammar` roll multiple independent groups with no signal for whether that is a designed co-deposit (hoard, burial set) or an accidental artefact of complexity-budget rolls. Rule what carries the signal (a deliberate assemblage draw with its own cultural weighting, a post-hoc heuristic over rolled structure, or a provenance-level property assigned at excavation composition rather than generation), and what downstream consumers — classification, description, the lens — are entitled to read from it", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 181, "isMilestoneSink": false, "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.69 is written as implementation but no doc or spike supplies an assemblage-detection heuristic, and its spike dependency 2GN.108 ruled a vocabulary question, not assemblage modelling. 2GN.108 stays as a dependency for the shared recalibration-sweep sequencing its notes record.", "assignee": "Jason Warren"}, {"id": "2GN.16", "description": "`engine/generation/plausibility.ts` — re-expansion loop: on failure, re-expand from grammar up to N attempts", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 181, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.115", "description": "design spike — what defines an artefact's working end in general, for artefacts with no edge? 2GN.108 ruled that normalisation must orient the artefact (working end at a shared pole across all artefacts sharing a dimensional axis) and that orientation is achieved by reversal rather than rejection, but ruled the general pole definition out of its own scope. For edged forms the working end is the edge; for a hafted head it is the head; for a vessel, disc, ring or pin there may be no functional pole at all. Rule whether orientation is total (every artefact oriented, which needs a pole rule for shapes that have no working end) or partial by design (only artefacts with a distinguishable functional pole are oriented, the rest left unoriented as `bladeLengthBand` already reports `'none'` for edgeless forms). ⚠️ this blocks implementation rather than 2GN.108's ruling: reversal cannot be implemented for edged forms and retrofitted to a different general convention without repeating the recalibration sweep", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 180, "isMilestoneSink": false, "notes": "Split out of 2GN.108 during the 2026-08-13 spike session. 2GN.108 established that `position` is intended as an oriented shared axis but is minted in `grammar.ts` as a depth-first traversal index (primary-before-attachments), so the invariant is unenforced — a blade can land at position 0 with its haft after it, and nothing rejects or reverses it. The three existing plausibility proxies (`hasGrippableSecondComponent`, `hasAdequateGripLength`, `hasRigidShaft`) each guess around this absence. Reversal was chosen over rejection because a mirrored artefact carries no information (it is the same artefact described backwards), so rejecting it spends re-expansion budget to enforce something probabilistically rather than by construction — but reversal only works if orientation is definable wherever it is applied, which is this spike's question. ⚠️ **Constraint added 2026-08-13 by 2GN.118 (Finding 6):** `bar-form`'s `taper: ['none','single-end','both-ends']` encodes *which end*, and `single-end` is not reversal-invariant — reverse the component and it still reads 'one end' while which end has silently changed, with no data recording which it was. `none` and `both-ends` are symmetric and survive reversal untouched; `single-end` is the sole asymmetric value in the parameter. No classification rule reads `single-end` — `hasImpactSurfaceIn` tests `bar-form`'s taper only for `'none'`, and the one other rule-side consumer (`bladeProfile`, `classification.ts:181`) reads `elongated`'s taper, a different primitive whose `['none','gradual','abrupt']` vocabulary is symmetric and reversal-safe. The description layer does read it, though: `data/descriptions/observational/bar-form.ts:43` interpolates it into 'The form narrows with a `#taper#` taper.' (asserted at `prose.test.ts:123`), so `single-end` already reaches player-facing prose. A reversal would therefore leave a description asserting which end tapers while no data records which end it was — doc 02 pillar 3 (Simulation Honesty), not a dormant parameter — so whatever this spike rules must either make `single-end` a claim about the oriented axis or accept that reversal silently corrupts it. Ruling reversal without addressing it leaves a parameter whose meaning depends on a traversal order the ruling is designed to stop being meaningful.", "assignee": "Jason Warren"}, {"id": "2GN.134", "description": "design spike — should cultural affinity gate substrate access at all? `materialAccessGate` (`engine/generation/decoration.ts`) requires `culturalAffinityWeight(material, culture) \u003e 1`, strictly better than neutral, so a material authored at exactly `1.0` — explicit indifference under the 2GN.127 ruling — fails the gate identically to one the culture cannot obtain: the ambivalent-versus-absent collapse 2GN.127 eliminated, reappearing inside the gate meant to model access. `hasIntroducedMaterialAccess` deliberately gates on availability alone and is the contrast case. Evidence is live in the presets: xoconahtl authors `['clay', 1.0]` against `abundant` clay and fails the gate (`affinity=1, isAvailable=true` → substrate access `false`); 2GN.128 deliberately kept the `1.0` so the evidence survives for this ruling. Rules the gate question so 2GN.129 can extend the silence rule without inheriting the defect. ⚠️ any change moves technique-selection distributions, so the recalibration cost must be measured before a mechanism is chosen", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 180, "isMilestoneSink": false, "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.129 was written as implementation but its own text names this as \"this task's to rule\", and its dependency 2GN.128 only implements the `materialAffinities` half — the spike (2GN.127) scoped itself to materials and deferred the substrate-gate question by name. Splitting the ruling out leaves 2GN.129 as pure implementation.", "assignee": "Jason Warren"}, {"id": "2GN.135", "description": "design spike — rule the inputs to the derived `wallThickness`/`diameter` quantity 2GN.120 implements: which modelled quantities feed the derivation (`craftSpecialisation`, the component's assigned material, vessel role for thickness; the length ratio 2GN.118 identified for diameter — a cylinder's diameter reads relative to its own length while a disc's is its principal dimension), what continuous value sits beneath the bands, and how per-culture band cutting works so cross-culture comparison stops being impossible by construction. Fourth instance of the band-computed-from-an-absolute-table family (2GN.86 mass, 2GN.87 blade, 2GN.108 axis) — but unlike those, no spike has ruled this one's derivation", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 180, "isMilestoneSink": false, "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.120's deliverable says \"a derived thickness quantity with its inputs ruled\", but nothing upstream rules them — spike 2GN.118 explicitly deferred diameter's derivation \"to the 2GN.120 family\", and 2GN.120 itself has no spike dependency. This spike owns the ruling; 2GN.120 becomes pure implementation.", "assignee": "Jason Warren"}, {"id": "2GN.139", "description": "design spike — rule the arrangement-pattern assignment mechanism 2GN.67 needs: detection is already contracted (`tallyArrangements`' same-primitiveType-within-one-top-level-group boundary, per 2GN.6), but nothing in the grammar ever *assigns* a pattern (2GN.3 rolls repetition incidentally, `checkAccumulation` only validates admissibility), so `arrangementGroup.pattern` has no faithful source. Rule whether assignment threads a deliberate choice through `expandGrammar`'s determinism-critical draw sequence (moving every calibration pin) or is derivable at flatten time from structure already rolled — and if threaded, where in the sequence the draw lands", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 180, "isMilestoneSink": false, "notes": "Filed 2026-08-20 from the M2 dependency audit: 2GN.67's own text names pattern assignment as \"the open question this task owns\", and its spike dependency 2GN.108 ruled a short-bodied-edged-tool vocabulary question, not this. 2GN.108 stays as a dependency for the shared recalibration-sweep sequencing its notes record.", "assignee": "Jason Warren"}, {"id": "2GN.21", "description": "`engine/generation/classification.ts` — `physicalLabel` generation from observable properties (neutral, not interpretive)", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 180, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.72", "description": "`engine/generation/classification.ts` — per-component feature provenance: record which component each collapsed `ExtractedFeatures` field was derived from (doc 12 §2.20 defers this explicitly — the collapse policies are documented but carry no references), so a feature can be traced to its source without re-implementing the dominance rules outside the engine. Prerequisite for attributing classification evidence to components rather than only to rules", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 180, "isMilestoneSink": false, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.106", "description": "`data/decorations.ts` + `engine/generation/decoration.ts` — add `formability` to `MaterialDifficultyAxis`, an `AXIS_NORMALISATION` entry, and per-technique `TECHNIQUE_MATERIAL_SENSITIVITY` weights, with re-measured grade distributions and 2GN.103's regional pins re-verified", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Filed 2026-08-11 alongside 2GN.102 (doc 12 §2.38). Must first revisit the rung-5 casting/forging conflation recorded in that entry: `formability`'s rung 5 deliberately groups cast metals (bronze/gold/silver) with hot-forged iron as one plastic-working-regime rung — a simplification that is inert while `relief`'s gate is a `\u003e= 3` threshold (rungs 3–6 pass identically) but becomes load-bearing the moment this task reads the rungs as a difficulty gradient rather than a threshold. Note the `1`–`6` range differs from the other five difficulty axes' `1`–`7`, so `AXIS_NORMALISATION`'s `mid`/`half` need their own values, not a copy of a sibling's.", "assignee": "Jason Warren"}, {"id": "2GN.107", "description": "`data/decorations.ts` — sweep every `kind: 'material'` substrate test for exclusions that are artefacts of a proxy axis rather than attested practice, the way `relief`'s leather exclusion was", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Filed 2026-08-11 during 2GN.102 (doc 12 §2.38). `relief` excluded leather solely as collateral from `rigidity \u003e= 3`, a test aimed at linen, with no material-science basis — corrected in 2GN.102 once `formability` gave the gate something honest to key on. `overlay` uses the identical `rigidity \u003e= 3` test `relief` used to carry; if `formability` is the correct gate for one, `overlay` is the first candidate for the same scrutiny. `studs`/`gilding` already carry a named leather exception and are not suspect on the same grounds.", "assignee": "Jason Warren"}, {"id": "2GN.109", "description": "`src/lib/data/classification.ts` — replacement edge-family rule for the short-bodied non-blade edge, framed morphologically rather than as a truth-table cell. The deleted R4 (roadmap 2GN.87) failed because its condition described a combination of feature *bands* rather than a shape: whatever signal this rule reads must be one the generator can actually vary independently. **Void if 2GN.108 rules the form out of MVP scope** — file the closure rather than authoring a rule for a form the game does not produce. Adding it shifts `CLASSIFICATION_RULES` indices again, so the pinned-index blocks in `classification.test.ts`, `EXPECTED_FIRE_RATES`/`MIGRATED_RULE_INDICES`/`UNIVERSAL_BY_DESIGN` in `calibration.test.ts` and the Explorer panel's label lookups all need updating together", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "", "assignee": "Jason Warren"}, {"id": "2GN.114", "description": "`tests/fixtures/culture.ts` — extend `mockCulturalProfile`/`mockPhaseCharacteristics` with a high-craft/elite preset (`craftSpecialisation`, `decorativeEmphasis`, `motifComplexity` pushed toward 1.0), so elite/ceremonial-grade artefacts are reachable through ordinary sampling and Explorer calibration runs rather than only via hand-built overrides", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Filed from a real-world-find coverage spike (2026-08-13): ran the full M2 chain (expandGrammar → normaliseArtefact → expandDecoration → assignMaterials → gradeDecorativeLayers → extractFeatures → classifyArtefact) against 18 common real-world archaeological find types across 3000 sampled artefacts (6 mock regions × 500). Coverage (18/18) and frequency ordering (dominant \u003e common \u003e occasional \u003e rare, unranked) both held with no tuning aimed at the outcome. The one gap: `meanDecorativeGrade` capped at ~0.494 across every region under the flat-neutral-0.5 `mockPhaseCharacteristics`/`mockCulturalProfile` fixtures, making elite/ceremonial signatures (gold-lunula-style ornament, ceremonial mace-head) invisible to any default-fixture test or Explorer run — confirmed reachable (70/1000 and 392/1000 respectively) only after hand-pushing `craftSpecialisation`/`decorativeEmphasis`/`motifComplexity` to 1.0 for the spike. Not a pipeline defect; a fixture coverage gap with no reusable preset today.", "assignee": "Jason Warren"}, {"id": "2GN.119", "description": "design spike — should classification conditions read *relations between components* rather than isolated component properties? Measured 2026-08-13 over all 43 shipped rules during 2GN.97: **10 of the 24 unmigrated rules condition on exactly one property** (`f.x === 'value'` and nothing else) — `base-pedestal-display`, `base-pointed-amphora`, the three `perforation-*` rules, both `ring-*` rules, both `sheet-*` rules and `size-small-personal`. A further 7 read two properties that both describe the *same* component (the container rules pair `hasContainer`, a presence flag, with a feature extracted off the dominant container). Exactly one rule is genuinely relational (`motif-multiple-origins`, comparing origins across the artefact's decoration). A base is a relationship between the base and what it supports: a pedestal under a statue and a pedestal under a hat-stand carry opposite readings, identical `baseType`, and no amount of culture-relativity separates them because the difference is not cultural. The rule reads one term of a two-term relation and discards the term carrying the meaning — doc 02 Simulation Honesty. ⚠️ This is orthogonal to doc 11 §2.9's absolute/relative cut: `perforation-central-rotation` awards `tool` (an AbsoluteTag) and is under-conditioned identically, so the defect is a property of how conditions are written, not of which vocabulary they award from. `NormalisedArtefact.attachments` and `NormalisedComponent.position` are populated and unread by every rule — the same unused-graph finding as 2GN.108. Rule whether conditions gain access to component relations, what that does to `ClassificationRule.condition`'s signature (already widened once by 2GN.80), and which rules are rewritten versus left as affordance readings", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Filed 2026-08-13 from the 2GN.97 spike session. Scope is **all 43 rules**, not the 24 unmigrated ones: the measurement that produced it covered the 24, but the defect cuts across the absolute/relative boundary, so scoping to relative-award rules would audit the wrong set. Supersedes the framing 2GN.97 inherited — those rules are not unmigrated-but-fine awaiting a baseline, a class of them is under-conditioned, and no baseline of any kind fixes an under-conditioned rule. Absorbs the ambiguity originally filed as a competing-readings question (a central perforation reads spindle-whorl or pendant depending on the disc's size, mass and what it attaches to — the ambiguity IS the missing relational term). ⚠️ Interacts with 2GN.118: that audits which parameter *values* exist, this audits what a condition may *read*. Independent questions on the same surface; neither blocks the other.", "assignee": "Jason Warren"}, {"id": "2GN.122", "description": "design spike — is there one aperture model, and does it subsume `perforation`? 2GN.118 ruled (2026-08-13) that `opening` is not one axis but at least two crushed into one field: **presence/count** (`closed`/`none` are the same physical fact, scored identically at 0 by `OPENNESS_BY_OPENING`) and **aperture size** (`wide`/`narrow`/`slit`). It also ruled the `cylindrical`/`hollow-enclosed` vocabularies commensurable — `OPENNESS_BY_OPENING` already ranks all seven values on one 0–1 scale, and three shipped rules (`container-wide-open`, `container-restricted-access`, `container-closed-sealed`) pair the cylinder and vessel labels as synonyms by hand, which is the rule layer compensating for a split that should not exist. Two questions this spike owns. **(1) Multiplicity**: a through-void has two mouths (bead, socketed axe, tube) and a two-mouthed vase has two separate apertures — these are different facts and neither is expressible today. **(2) Subsumption**: a hole through a disc (`perforation`) and a hole through a cylinder wall (`opening`) are plausibly one concept split across two parameter names by primitive-by-primitive BNF authoring, the same defect as `base` one level up. If they are one axis, `perforation`'s count/position split (2GN.118's case (c), deferred here whole rather than ruled) resolves inside this model instead. Rule the axis set (count, size, through/blind, position), which parameters survive, and what `ExtractedFeatures` carries. ⚠️ 8 shipped rules read `openingType` or `perforation`; `EXPECTED_FIRE_RATES` re-records once at implementation, which is why this is ruled before 2GN.118's own vocabulary changes are implemented rather than after", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Filed 2026-08-13 from the 2GN.118 spike session, cases (b) `opening` and (c) `perforation`. The full cross-tabulation of `PRIMITIVE_PARAMETERS` found seven disjoint shared-name pairs, not the three originally filed: `base`, `opening`, `perforation` (all unioned into `ExtractedFeatures` and read by rules) plus `crossSection`, `diameter`, `shape`, `taper` (read by no rule, so no live consequence). 2GN.118 ruled on `base` and on the four unread pairs; `opening` and `perforation` were split out here because they outgrew a vocabulary fix. `opening` is the worst of the three splits — zero shared values between the two primitives AND different arities (3 vs 4) for one concept — but the fix is not a union: Jason ruled the two-axis reading, and then raised multiplicity, which neither vocabulary can express at any arity. Subsumption is this spike's open question and was deliberately not ruled in 2GN.118 for want of measurement: if `opening` and `perforation` are one aperture axis, ruling `opening` first and merging `perforation` later means recalibrating `EXPECTED_FIRE_RATES` twice. Scoped as one spike rather than two on that basis. Renaming was considered and rejected as a separate concern: splitting the axes makes the intuitive vocabulary fall out (`closed`/`none` → count, `open` → `wide`, `restricted` → `narrow`), so no new words are needed for the values that survive.", "assignee": "Jason Warren"}, {"id": "2GN.143", "description": "design spike — what role does `MaterialAssignment.provenance` (`local`/`trade`/`unknown`, from `deriveMaterialProvenance`) play in the material-standing formula doc 11 §2.9 states as \"availability × cultural affinity × provenance × stratification\"? Provenance is categorical, not numeric, so it cannot be a literal multiplicative term — the formula as stated in doc 11/roadmap prose is imprecise about provenance's actual mechanism. Measured 2026-08-21 while scoping 2GN.27: `explainMaterialWeight`'s existing weight (culturalAffinity × phaseTechnology × scarcity) already produces a real local/trade split with no separate provenance term (mean weight 0.371 for locally-sourced materials vs 0.119 for trade-sourced, across all 6 regional worlds × 16 materials) — provenance's effect may already be embedded in the scarcity term via `bestRegionalLevel`'s trade-only rung, not an independent signal. Rule whether provenance should (a) stay implicit in the weight as measured, (b) become an explicit categorical multiplier keyed by `provenance.source`, or (c) something else entirely, and update doc 11 §2.9's formula statement to match whichever is ruled", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Filed 2026-08-21 per Jason's ruling that session: 2GN.27 proceeds using the 3-term weight alone (availability × cultural affinity, folded through `explainMaterialWeight`, plus stratification once 2GN.96 lands), dropping provenance as a separate factor for that task rather than blocking on this spike. Also relevant to 2GN.68, which shares the identical formula.", "assignee": "Jason Warren"}, {"id": "2GN.144", "description": "`types/world.ts` + `engine/generation/baselines.ts` + `types/tags.ts` + `engine/generation/materials.ts` — implement 2GN.142's ruling: `CulturePhase` gains `geography: { regions: string[] }` (plural, for a phase spanning several regions); `CulturePhaseSample` gains a matching `geography` field directly (not a nested `CulturePhase` — the sample bag stays structural until 3WS.3/3WS.4 land real culture/phase generation); `ClassificationContext` gains a region label sourced from the same field, alongside the existing `cultureId`/`phaseId` provenance labels (`emptyClassificationContext` needs a placeholder value); `bestRegionalLevel` (`materials.ts`) resolves against a culture-phase's occupied regions instead of scanning the whole `GeologicalContext` unconstrained — the actual collapse fix the spike measured, threaded through its four callers (`isAvailable`, `scarcityWeight`, `explainMaterialWeight`, `deriveMaterialProvenance`) and `assignMaterials`'s call chain. Three call sites also need the new field: `calibration.test.ts`'s `baselineFor` (stops abusing `cultureId` to hold a region name), `routes/dev/explorer/shared/baselineCache.ts`'s `baselineFor`, and the `tests/fixtures/artefact.ts` `ClassificationContext` fixture builder", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 2, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Filed 2026-08-25 as the implementation follow-up to 2GN.142 (ruled, not implemented). Not a blocker for 2GN.27/2GN.68 — neither reads region directly (per 2GN.142's own Finding 2), and both are already unblocked by the ruling itself. 3WS.7 depends on this: it is the task that generates real `GeologicalContext`/regions for production cultures and needs `CulturePhase.geography.regions` to exist before it can populate it. 2GN.143 (provenance-formula spike) gets a soft link, since it measures directly against `bestRegionalLevel`, whose signature this task changes — not a hard blocker since 2GN.143 is unstarted design work, but re-measurement should happen in the right order. Recalibration risk noted in the spike: the `bestRegionalLevel` fix only changes behaviour once a culture-phase's `geography.regions` has more than one entry, which no shipped preset does yet, so `EXPECTED_MEAN_GRADE_BY_REGION` and other calibration pins are not expected to move — confirm with `deno task test` before landing. Full reasoning: `docs/spikes/2GN.142-region-keyed-baselines.md`.", "assignee": "Jason Warren"}, {"id": "2GN.145", "description": "`engine/generation/grammar.ts` — `expandGrammar` consults `allowedMaterialTags` (2GN.10) when rolling join types and head placements, so it stops producing structure the wrapped-join and rigid-shaft plausibility rules reject on sight. 2GN.137 measured 13–43% of expansions discarded at Stage 5 depending on the cell, dominated by those two rules; the rules are correct and the grammar is uninformed. Rule where in the draw sequence the constraint is read (a filter on the attachment option set before `selectGrammarOption`, so the draw count is unchanged, versus a re-roll, which is not), and re-record every calibration pin, since any change here moves `expandGrammar`'s draw sequence for every artefact", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Filed 2026-08-25 from the 2GN.137 spike. ⚠️ calibration-shifting: `EXPECTED_FIRE_RATES`, `EXPECTED_TAG_SHARES` and the plausibility calibration guard all re-record. Not a blocker for 2GN.16 — the cap was ruled with headroom for today's rate — but landing it makes N=20 conservative rather than load-bearing.", "assignee": "Jason Warren"}, {"id": "2GN.76", "description": "`engine/generation/decoration.ts` — motif salience fluctuates across a culture's lifespan: native and borrowed motifs are not equally prominent at every point in the culture's timeline; motif selection weights vary by phase", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Added 2026-07-25 during the 2GN.33 design interview: `assignDecorativeDetails` weights native motifs at 1 and borrowed motifs by exchange intensity, with no temporal variation — this task adds the phase-driven salience dimension.", "assignee": ""}, {"id": "2GN.92", "description": "Doc 05 §13.1 + doc 12 propagation entry — record the `VariantCondition` shape change and the selection-order contract (condition filters the candidate set, then emphasis selects within it)", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Docs task pairing 2GN.91's type change. Doc 05 §13.1 currently publishes `DescriptionTemplate`/`DescriptionVariant` without a condition field; update the quoted interface and prose to match. Doc 12 gets a numbered propagation entry (next after §2.29) recording the change and its origin, matching the convention §2.28/§2.29 set for the `AbsoluteTag`/`RelativeTag` split.", "assignee": "Jason Warren"}, {"id": "2GN.93", "description": "`engine/generation/description.ts` — variant selection honours `condition`: filter candidates by the component's assigned material (via the `componentId → MaterialAssignment → MaterialDefinition` join) before emphasis-based selection", "milestone": "M2", "milestoneName": "Generation Pipeline", "milestoneDonePct": 51, "directDependents": 1, "transitiveUnblocks": 179, "isMilestoneSink": true, "notes": "Nothing currently does the material join at description time — `NormalisedComponent` carries only `allowedMaterialTags` (a constraint), the actual assignment lives on `ClassifiedArtefact.materials` as a side-table (`MaterialAssignment[]`, joined by `componentId`). ⚠️ Overlaps 2GN.38, which already owns `generateDescription`'s variant selection — resolve at pickup whether this is a distinct task or 2GN.38's description should instead be amended to state selection honours `condition`. Flagged unresolved at authoring time (2026-08-05); do not let both exist as separately-tracked selection logic.", "assignee": "Jason Warren"}]}, "mermaid": "graph TD\n\tclassDef todo fill:var(--color-todo-bg),stroke:var(--color-todo),color:var(--color-todo)\n\tclassDef blocked fill:var(--color-blocked-bg),stroke:var(--color-blocked),color:var(--color-blocked),stroke-width:2px\n\tclassDef paused fill:var(--color-paused-bg),stroke:var(--color-paused),color:var(--color-paused),stroke-dasharray:4 3\n\tclassDef deferred fill:var(--color-deferred-bg),stroke:var(--color-deferred),color:var(--color-deferred),stroke-dasharray:2 4,font-style:italic\n\tclassDef done fill:var(--color-done-bg),stroke:var(--color-done),color:var(--color-done)\n\tclassDef outOfScope fill:var(--color-out-of-scope-bg),stroke:var(--color-out-of-scope),color:var(--color-out-of-scope),stroke-dasharray:2 2\n\tclassDef mile fill:var(--color-milestone-bg),stroke:var(--color-milestone),color:var(--color-milestone),font-weight:bold\n\tclassDef external fill:var(--color-gate-bg),stroke:var(--color-gate),color:var(--color-gate),stroke-dasharray:4 3,font-style:italic\n\t2GN.16[\"2GN.16: `engine/generation/plausibility.ts` — r…\"]\n\t2GN.21[\"2GN.21: `engine/generation/classification.ts` —…\"]\n\t2GN.27[\"2GN.27: `engine/generation/materials.ts` + `eng…\"]\n\t2GN.76[\"2GN.76: `engine/generation/decoration.ts` — mot…\"]\n\t2GN.68[\"2GN.68: `engine/generation/classif <script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const DATA = JSON.parse(document.getElementById("roadmap-data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
	c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

document.getElementById("pageTitle").textContent =
	DATA.project ? `${DATA.project}: ${DATA.phase}` : DATA.phase;
document.getElementById("meta").textContent =
	`generated ${DATA.generated} · source .claude/roadmaps.json`;

/* Validation banner (empty when clean) */
if (DATA.validation && DATA.validation.length) {
	document.getElementById("validation").innerHTML =
		`<div class="validation"><strong>${DATA.validation.length} validation ` +
		`discrepancy(ies):</strong> the numbers below reflect the file as-is.` +
		`<ul>${DATA.validation.map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>`;
}

/* Milestone-level state (distinct from task status): computed server-side by
   roadmap.py's milestone_state() and carried as m.state, so the artefact
   never re-derives it and cannot disagree with the CLI's own stats/render
   paths. States: deferred, done, inProgress, todo, blocked, paused. */
const STATE_VAR = {
	deferred: "deferred", done: "done", inProgress: "in-progress",
	todo: "todo", blocked: "blocked", paused: "paused",
};
const STATE_RANK = { inProgress: 0, todo: 1, done: 2, blocked: 3, paused: 4, deferred: 5 };
/* Overview cards and Milestones details share this one ordering, computed
   once here rather than in Python, since build_stats' milestones[] stays in
   roadmap order for other consumers (_human_stats, next-task-*). */
const sortedMilestones = [...DATA.stats.milestones].sort((a, b) =>
	(STATE_RANK[a.state] - STATE_RANK[b.state])
	|| (b.donePct - a.donePct)
	|| a.name.localeCompare(b.name));

/* A dev-chip helper: colour + label for an assignee, empty string when unset. */
const devChip = assignee => {
	const varName = DATA.devColours?.[assignee];
	if (!assignee || !varName) return "";
	return `<span class="chip" style="--chip-fg:var(--color-dev-${varName});--chip-bg:var(--color-dev-${varName}-bg)">${esc(assignee)}</span>`;
};
/* A dependency-id chip: colour by what the id resolves to (task status,
   milestone sky, or gate yellow), using the server-computed depKinds map
   so the artefact never re-derives the graph. */
const depChip = id => {
	const k = DATA.depKinds?.[id];
	if (!k) return `<span class="chip">${esc(id)}</span>`;
	const varName = k.kind === "task" ? STATE_VAR[k.status] ?? "todo"
		: k.kind === "milestone" ? "milestone" : "gate";
	return `<span class="chip" style="--chip-fg:var(--color-${varName});--chip-bg:var(--color-${varName}-bg)">${esc(id)}</span>`;
};

/* Section 1 — Overview */
const st = DATA.stats;
document.getElementById("hero").innerHTML =
	`${st.byStatus.done}/${st.total} tasks<small>${st.donePct}% complete</small>` +
	`<small>${st.milestonesDone}/${st.milestonesTotal} milestones</small>`;

document.getElementById("milestone-cards").innerHTML = sortedMilestones.map(m => `
	<div class="card mini" style="--m-colour:var(--color-${STATE_VAR[m.state]})">
		<h3>${esc(m.id)}: ${esc(m.name)}</h3>
		<span class="count">${m.done}/${m.total} done · ${m.donePct}%</span>
		<div class="progress-bar"><div class="progress-fill"
			style="width:${m.donePct}%;background:var(--color-${STATE_VAR[m.state]})"></div></div>
	</div>`).join("");

/* Section 2 — Milestones. Groups lead with actionable work; milestones
   themselves follow the same order as the Overview cards above (A3), so a
   reader scanning top-to-bottom sees the same priority twice, not two
   different orderings of the same data. */
const GROUPS = [
	["todo",        "○ To Do",        "todo"],
	["blocked",     "✗ Blocked",      "blocked"],
	["paused",      "⏸ Paused",       "paused"],
	["deferred",    "⤓ Deferred",     "deferred"],
	["done",        "✓ Done",         "done"],
	["out_of_scope","⊘ Out of Scope", "out-of-scope"],
];
const readyIds = new Set(DATA.ready.candidates.map(c => c.id));
const tasksByMilestone = {};
for (const t of DATA.tasks) (tasksByMilestone[t.milestone] ??= []).push(t);

document.getElementById("milestone-details").innerHTML = sortedMilestones.map(m => {
	const tasks = tasksByMilestone[m.id] || [];
	const groups = GROUPS.map(([status, label, varName]) => {
		const members = tasks.filter(t => t.status === status);
		if (!members.length) return "";
		const items = members.map(t => {
			const deps = (t.dependsOn && t.dependsOn.length)
				? `<span class="deps">${t.dependsOn.map(depChip).join("")}</span>` : "";
			return `<li class="${status === "out_of_scope" ? "oos" : ""}">
				<span class="tid">${esc(t.id)}</span>${devChip(t.assignee)}
				<span class="tasktext">${esc(t.description)}</span>${deps}</li>`;
		}).join("");
		return `<div class="group">
			<h4 style="color:var(--color-${varName})">${label}</h4><ul>${items}</ul></div>`;
	}).join("");
	// All milestones render collapsed; the reader chooses what to expand
	return `<details class="milestone" style="--m-colour:var(--color-${STATE_VAR[m.state]})">
		<summary><span class="mid">${esc(m.id)}</span>${esc(m.name)}
			<span class="count">${m.done}/${m.total}</span></summary>
		<div class="body">${groups || "<p class='depnote'>No tasks.</p>"}</div>
	</details>`;
}).join("");

/* Section 3 — Dependency graph */
/* ELK lays out this dense a graph with far fewer crossings than the default
   dagre engine; if its module fails to load, dagre still renders. */
let layout = "dagre";
try {
	const elkLayouts = (await import("https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs")).default;
	mermaid.registerLayoutLoaders(elkLayouts);
	layout = "elk";
} catch { /* CDN unreachable — fall back */ }
mermaid.initialize({
	startOnLoad: false,
	theme: "base",
	layout,
	themeVariables: {
		fontSize: "16px",
		fontFamily: '"IBM Plex Mono", monospace',
	},
});
/* Mermaid 11's classDef parser rejects var(--x), so the semantic variables
   are resolved to concrete colours before rendering, and the graph re-renders
   when the colour scheme flips so it keeps tracking the page theme. A render
   failure is contained to the diagram shell — the sections after it must
   still populate. */
const wrap = document.getElementById("wrap");
const shell = document.getElementById("shell");
const diagram = document.getElementById("diagram");
let svgEl = null;
let scale = 1, tx = 0, ty = 0;
const apply = () => { if (svgEl) svgEl.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
const renderGraph = async () => {
	const rootStyle = getComputedStyle(document.documentElement);
	const src = DATA.mermaid.replace(/var\((--[\w-]+)\)/g,
		(_, name) => rootStyle.getPropertyValue(name).trim() || "#888888");
	try {
		const { svg } = await mermaid.render("roadmap-graph", src);
		diagram.innerHTML = svg;
	} catch (err) {
		document.getElementById("droadmap-graph")?.remove();
		diagram.innerHTML = `<p class="depnote">Dependency graph failed to render: ${esc(String(err))}</p>`;
		return;
	}
	svgEl = wrap.querySelector("svg");
	svgEl.addEventListener("dblclick", () => shell.classList.toggle("expanded"));
	apply();
};
await renderGraph();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderGraph);

/* Zoom/pan: buttons, ctrl+wheel, drag; expand toggles a fixed overlay */
const zoom = f => { scale = Math.min(4, Math.max(0.25, scale * f)); apply(); };
shell.querySelector(".diagram-toolbar").addEventListener("click", e => {
	const act = e.target.dataset.act;
	if (act === "in") zoom(1.25);
	else if (act === "out") zoom(0.8);
	else if (act === "reset") { scale = 1; tx = ty = 0; apply(); }
	else if (act === "expand") shell.classList.toggle("expanded");
});
wrap.addEventListener("wheel", e => {
	if (!e.ctrlKey && !e.metaKey) return;
	e.preventDefault();
	zoom(e.deltaY < 0 ? 1.1 : 0.9);
}, { passive: false });
let drag = null;
wrap.addEventListener("pointerdown", e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; wrap.setPointerCapture(e.pointerId); });
wrap.addEventListener("pointermove", e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
wrap.addEventListener("pointerup", () => { drag = null; });

/* Section 4 — Next Up (pre-vetted by roadmap.py ready). Same chip structure
   as the Milestones section (A5); grouped by dev only when the READY SET
   (the candidates actually shown here, not the whole phase) has more than
   one distinct assignee, so a solo project (or a phase where only one dev's
   work happens to be unblocked right now) stays flat rather than gaining a
   pointless single-group heading. */
const candidateLi = c => `
	<li>
		<span class="tid">${esc(c.id)}</span>${devChip(c.assignee)}
		<span class="tasktext">${esc(c.description)}</span>
		<span class="deps"><span class="chip" style="--chip-fg:var(--color-milestone);--chip-bg:var(--color-milestone-bg)">${esc(c.milestone)}: ${esc(c.milestoneName)}</span></span>
		<span class="signal">unblocks ${c.transitiveUnblocks}${c.isMilestoneSink ? " · completes milestone" : ""}</span>
	</li>`;
const readyAssignees = new Set(DATA.ready.candidates.map(c => c.assignee).filter(Boolean));
document.getElementById("ready").innerHTML = !DATA.ready.candidates.length
	? "<li>No unblocked tasks: clear a blocker or a gate.</li>"
	: readyAssignees.size > 1
	? [...readyAssignees].sort().map(dev => `
		<li class="nextup-devgroup"><h4>${devChip(dev)}</h4>
			<ul style="list-style:none;margin:0;padding:0">${DATA.ready.candidates.filter(c => c.assignee === dev).map(candidateLi).join("")}</ul>
		</li>`).join("") +
		(DATA.ready.candidates.some(c => !c.assignee)
			? `<li class="nextup-devgroup"><h4>Unassigned</h4>
				<ul style="list-style:none;margin:0;padding:0">${DATA.ready.candidates.filter(c => !c.assignee).map(candidateLi).join("")}</ul>
			</li>` : "")
	: DATA.ready.candidates.map(candidateLi).join("");

/* Nav highlight */
const links = [...document.querySelectorAll("nav a")];
const highlight = new IntersectionObserver(entries => {
	for (const en of entries) if (en.isIntersecting) {
		links.forEach(a => a.classList.toggle("active", a.hash === "#" + en.target.id));
	}
}, { rootMargin: "-30% 0px -60% 0px" });
links.forEach(a => highlight.observe(document.querySelector(a.hash)));
</script>
</body>
</html>
